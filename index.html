<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFS Draft 25/26</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --rsm-azure:#0091DA; --rsm-green:#4C9C2C; --rsm-navy:#0C2340; --rsm-cyan:#00C1D5;
  --ink:#0C2340; --ink2:#5a6570; --ink3:#8a939c; --line:#e3e6ea; --page:#f4f6f9;
  --gold:#D4AF37; --silver:#B4BCC4; --bronze:#C08A4A; --red:#E5484D; --win:#00A651;
  --comp-league:#0091DA; --comp-h2h:#003399; --comp-cup:#CC0000; --comp-super:#C9A227;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Archivo,system-ui,sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
.shell{display:flex;min-height:100vh;max-width:1360px;margin:0 auto;background:#fff}

/* ---------- SIDEBAR ---------- */
.side{width:186px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:20px 18px 18px}
.brand-mark{display:flex;gap:3px;margin-bottom:7px}
.brand-mark i{width:12px;height:5px;background:var(--rsm-green);display:block}
.brand-mark i:last-child{width:28px;background:var(--rsm-azure)}
.brand-name{font-size:27px;font-weight:900;letter-spacing:-1px;line-height:1;color:var(--ink)}
.brand-sub{font-size:11px;font-weight:600;color:var(--ink3);margin-top:3px}
.nav{display:flex;flex-direction:column;padding:4px 0}
.nav a{font-size:14px;font-weight:500;color:#3d4852;padding:8px 18px;text-decoration:none;border-left:3px solid transparent;cursor:pointer}
.nav a:hover{background:#f7f9fb}
.nav a.on{font-weight:700;color:var(--rsm-azure);border-left-color:var(--rsm-azure)}
.side-panel{margin-top:auto;border-top:1px solid var(--line);padding:15px 18px 18px}
.sp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.sp-title{font-size:10px;font-weight:800;letter-spacing:1.1px}
.sp-rule{height:3px;width:26px;margin-bottom:11px}
.sp-body{min-height:186px}
.sp-dots{display:flex;gap:5px;margin-top:12px}
.sp-dots span{width:16px;height:3px;background:#dde3e9;cursor:pointer}
.sp-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #eef1f4;font-size:12px}
.sp-row .p{font-size:11px;font-weight:600;color:var(--ink3);width:11px}
.sp-row .n{flex:1;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-row .v{font-weight:700}
.sp-fx{border:1px solid #eef1f4;padding:7px 8px;margin-bottom:6px}
.sp-fx div{display:flex;justify-content:space-between;padding:1px 0;font-size:12px}
.sp-empty{border:1px dashed #d8dee4;padding:20px 12px;text-align:center;margin-top:28px}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0}
.page{display:none}
.page.on{display:block}
.load{padding:70px 20px;text-align:center;color:var(--ink3);font-size:13px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--rsm-azure);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{margin:20px;padding:14px 16px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:13px}

/* hero */
.hero{position:relative;height:250px;background:#123A5C;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-slot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.hero-slot div{border:2px dashed rgba(255,255,255,.28);padding:16px 26px;text-align:center;color:rgba(255,255,255,.4);font-size:10px;font-weight:600;letter-spacing:1.2px}
.hero-scrim{position:absolute;inset:0;background:rgba(9,28,50,.64)}
.hero-copy{position:absolute;left:0;right:0;bottom:0;padding:0 26px 24px}
.hero-kicker{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--rsm-cyan);margin-bottom:9px}
.hero-title{font-size:33px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.05}
.hero-sub{font-size:13px;color:rgba(255,255,255,.75);line-height:1.5;margin:10px 0 16px;max-width:430px}
.hero-cta{background:var(--rsm-azure);display:inline-block;padding:10px 18px;font-size:12px;font-weight:700;color:#fff;cursor:pointer}

/* stat strip */
.tiles{background:var(--rsm-azure);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{padding:15px 0 15px 22px}
.tile+.tile{border-left:1px solid rgba(255,255,255,.25);padding-left:15px}
.tile b{display:block;font-size:23px;font-weight:900;color:#fff;letter-spacing:-.7px}
.tile span{display:block;font-size:9px;font-weight:600;letter-spacing:1px;color:rgba(255,255,255,.82);margin-top:3px}

.sec{padding:22px 24px 26px}
.sec-h{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:14px}
.comp{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-left-width:4px;padding:11px 13px;margin-bottom:9px}
.comp-logo{width:42px;height:42px;background:#f2f5f8;border:1px dashed #b9c4cf;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;color:#8a939c;overflow:hidden}
.comp-logo img{width:100%;height:100%;object-fit:contain}
.comp-mid{flex:1;min-width:0}
.comp-name{font-size:14px;font-weight:800;letter-spacing:-.2px}
.comp-meta{font-size:11px;color:var(--ink3);margin-top:2px}
.comp-right{text-align:right}
.comp-lbl{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--ink3)}
.comp-win{font-size:16px;font-weight:900;letter-spacing:-.3px;margin-top:1px}
.comp-note{font-size:11px;color:var(--ink2)}

/* league table page */
.lt-mast{position:relative;height:88px;overflow:hidden}
.lt-mast .bands{position:absolute;inset:0}
.lt-mast .bands i{position:absolute;top:-40px;bottom:-40px;display:block;transform:skewX(-24deg)}
.lt-mast .copy{position:relative;height:100%;display:flex;align-items:center;gap:15px;padding-left:24px}
.lt-slot{width:46px;height:46px;border:1px dashed rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;font-weight:700;letter-spacing:.8px;color:rgba(255,255,255,.7);overflow:hidden}
.lt-slot img{width:100%;height:100%;object-fit:contain}
.lt-mast h1{font-size:31px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1}
.lt-mast p{font-size:9px;font-weight:800;letter-spacing:1.8px;color:rgba(255,255,255,.8);margin-top:4px}
.lt-sub{height:32px;display:flex;align-items:flex-end;padding-left:24px}
.lt-sub span{font-size:12px;font-weight:700;color:#fff;padding-bottom:5px;border-bottom:3px solid}
.scrub{padding:13px 24px;display:flex;align-items:center;gap:11px}
.scrub .btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.scrub .btn svg{width:11px;height:11px;fill:#fff}
.scrub input{flex:1}
.scrub .val{font-size:14px;font-weight:900;min-width:54px;text-align:right}
.card{background:#fff;margin:0 20px 20px;padding:12px 16px 14px;border:1px solid var(--line)}
.lt-head,.lt-row{display:flex;align-items:center;gap:6px}
.lt-head{padding-bottom:9px;border-bottom:1px solid #EFE8F5;font-size:10px;font-weight:700;color:#6B5B78}
.lt-row{padding:8px 6px;margin:0 -6px;border-bottom:1px solid #F5F1F8;cursor:pointer}
.lt-row.pin{background:#F6EFFE}
.c-pos{width:24px;display:flex;align-items:center;gap:5px}
.c-pos i{width:3px;height:16px;display:block}
.c-pos b{font-size:13px;font-weight:800}
.c-mv{width:16px;text-align:center;font-size:9px}
.c-ph{width:26px}
.ph{width:24px;height:24px;border-radius:50%;background:#F2EFF6;border:1px solid #E6DEF0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#A99CBB;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.c-nm{flex:1;min-width:0;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-n{text-align:right;font-size:12px;color:#6B5B78}
.c-pts{width:36px;text-align:right;font-size:14px;font-weight:900}
.c-gap{width:36px;text-align:right;font-size:12px;font-weight:700}
.c-form{width:88px;text-align:right;white-space:nowrap}
.fs{display:inline-block;min-width:15px;text-align:center;font-size:9px;font-weight:800;padding:2px;margin-left:2px}
.note{margin:0 20px 22px;padding:11px 14px;background:#f7f9fb;border:1px solid var(--line);font-size:11px;color:var(--ink2);line-height:1.5}

/* ---------- H2H ---------- */
.h2h{background:#0B1340;min-height:520px}
.h2h-nav{display:flex;gap:0;padding:0 16px;background:#070C2B}
.h2h-nav button{background:none;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.5);
  font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:13px 15px;cursor:pointer}
.h2h-nav button.on{color:#fff;border-bottom-color:#00E5FF}
.h2h-mast{display:flex;align-items:center;gap:13px;padding:16px 18px 14px}
.h2h-slot{width:44px;height:44px;border:1px dashed rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:7px;font-weight:700;letter-spacing:.7px;color:rgba(255,255,255,.5);overflow:hidden}
.h2h-slot img{width:100%;height:100%;object-fit:contain}
.h2h-mast h2{font-size:18px;font-weight:900;color:#fff;letter-spacing:.4px;line-height:1}
.h2h-mast p{font-size:8px;font-weight:700;letter-spacing:1.5px;color:#00E5FF;margin-top:3px}
.h2h-mast .r{margin-left:auto;text-align:right}
.h2h-mast .r span{display:block;font-size:8px;font-weight:800;letter-spacing:1.2px;color:rgba(255,255,255,.45)}
.h2h-mast .r b{display:block;font-size:14px;font-weight:900;color:#00E5FF;margin-top:2px}
.h2h-view{display:none}
.h2h-view.on{display:block}
.h2h-wrap{display:flex}
.h2h-word{width:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.h2h-word span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:27px;font-weight:900;color:#fff;white-space:nowrap}
.h2h-body{flex:1;min-width:0;padding:0 0 16px}
.h2h-zones{width:26px;flex-shrink:0;position:relative}
.h2h-zone{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center}
.h2h-zone span{writing-mode:vertical-rl;font-size:9px;font-weight:900;letter-spacing:1.5px;white-space:nowrap}
.hh{display:flex;align-items:center;gap:6px;padding:0 12px 6px 0;font-size:8px;font-weight:800;letter-spacing:.9px;color:rgba(255,255,255,.5)}
.hr{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 0;cursor:pointer}
.hr:nth-child(odd){background:#0F1749}
.hr:nth-child(even){background:#16205F}
.h-pos{width:24px;text-align:center}
.h-pos b{display:inline-block;min-width:20px;padding:2px 0;font-size:13px;font-weight:900;letter-spacing:-.5px}
.h-ph{width:28px}
.h-ph .ph{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.55);color:#fff}
.h-nm{flex:1;min-width:0;font-size:13px;font-weight:800;color:#fff;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-n{text-align:right;font-size:11px;color:rgba(255,255,255,.55)}
.h-pts{width:26px;text-align:center}
.h-pts b{display:inline-block;min-width:24px;padding:2px 0;font-size:13px;font-weight:900;color:#1E3AE0;letter-spacing:-.5px}
.h-form{width:78px;text-align:right;white-space:nowrap}
.h-form i{display:inline-block;width:13px;height:14px;line-height:14px;text-align:center;font-size:8px;font-weight:900;
  color:#0B1340;margin-left:2px;font-style:normal}
.h-chev{width:10px;text-align:right;font-size:10px;color:rgba(255,255,255,.45)}
.h-cut{height:3px;background:#FF3D9E}
.h-open{background:#070C2B;padding:12px 14px 10px}
.h-open .lbl{font-size:8px;font-weight:900;letter-spacing:1.4px;color:#00E5FF;margin-bottom:8px}
.h-grid i{display:inline-block;width:12px;height:16px;line-height:16px;text-align:center;font-size:8px;font-weight:900;
  color:#070C2B;margin-right:1px;margin-bottom:2px;font-style:normal}
.h-streaks{display:flex;gap:22px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
.h-streaks b{display:block;font-size:19px;font-weight:900;letter-spacing:-.5px}
.h-streaks span{display:block;font-size:8px;font-weight:800;letter-spacing:1.1px;color:rgba(255,255,255,.5);margin-top:2px}
.h2h-pad{padding:0 18px 18px}
.rnav{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.rnav .b{width:26px;height:26px;border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:13px}
.rnav .lab{font-size:15px;font-weight:900;color:#FF3D9E;min-width:70px;text-align:center}
.fxgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.srow{display:flex;align-items:center;background:#16205F;padding:9px 12px}
.srow .nm{flex:1;font-size:12px;font-weight:800;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sc{display:flex;flex-direction:column;align-items:center;width:30px;flex-shrink:0}
.srow .sc b{font-size:16px;font-weight:900;letter-spacing:-.5px;line-height:1.05}
.srow .sc i{display:block;height:3px;width:20px;margin-top:3px}
.srow .ft{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);margin:0 5px;align-self:flex-start;padding-top:3px}
.srow .av{width:24px;height:24px;flex-shrink:0;margin:0 8px}
.rec-pick{display:flex;align-items:stretch;gap:10px;margin-bottom:14px}
.rec-pick .side{flex:1;background:#16205F;padding:12px;text-align:center}
.rec-pick select{width:100%;background:#0B1340;color:#fff;border:1px solid rgba(255,255,255,.25);font-family:inherit;
  font-size:12px;font-weight:800;padding:5px;outline:none}
.rec-vs{width:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#FF3D9E}
.rec-bar{display:flex;height:32px;margin-bottom:5px}
.rec-bar div{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#0B1340}
.rec-lbl{display:flex;justify-content:space-between;font-size:8px;font-weight:800;letter-spacing:1.1px;color:rgba(255,255,255,.5);margin-bottom:14px}
.rec-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.rec-stats div{background:#16205F;padding:11px}
.rec-stats b{display:block;font-size:16px;font-weight:900;letter-spacing:-.4px}
.rec-stats span{display:block;font-size:8px;font-weight:800;letter-spacing:1px;color:rgba(255,255,255,.5);margin-top:3px}
.rec-m{display:flex;align-items:center;gap:10px;padding:8px 10px}
.champ{margin-top:16px}
.champ .strip{display:flex;height:3px}
.champ .panel{background:#CFD5DC;padding:15px 18px;display:flex;align-items:center;gap:14px}
.champ .av{width:48px;height:48px;border-radius:50%;background:#5C646E;border:2px solid #EDEFF2;display:flex;align-items:center;
  justify-content:center;color:#EDEFF2;font-size:15px;font-weight:800;flex-shrink:0;overflow:hidden}
.champ .av img{width:100%;height:100%;object-fit:cover}
.champ .lbl{font-size:8px;font-weight:900;letter-spacing:2.2px;color:#5C646E}
.champ .nm{font-size:27px;font-weight:900;color:#22262B;letter-spacing:-.9px;line-height:1.05;margin-top:1px}
.champ .tro{width:56px;height:56px;border:1px dashed #8A929C;display:flex;flex-direction:column;align-items:center;
  justify-content:center;flex-shrink:0;font-size:6px;font-weight:800;letter-spacing:.7px;color:#5C646E;overflow:hidden}
.champ .tro img{width:100%;height:100%;object-fit:contain}

@media(max-width:820px){
  .shell{flex-direction:column}
  .side{width:100%;border-right:none;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;padding:0 10px}
  .nav a{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:10px 12px}
  .nav a.on{border-left-color:transparent;border-bottom-color:var(--rsm-azure)}
  .side-panel{display:none}
  .tiles{grid-template-columns:1fr 1fr}
  .tile+.tile{border-left:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><i></i><i></i><i></i></div>
      <div class="brand-name">FFS</div>
      <div class="brand-sub">Draft 25/26</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-panel">
      <div class="sp-head"><span class="sp-title" id="spTitle">LEAGUE TABLE</span></div>
      <div class="sp-rule" id="spRule"></div>
      <div class="sp-body" id="spBody"></div>
      <div class="sp-dots" id="spDots"></div>
    </div>
  </aside>

  <main class="main">
    <section class="page on" id="p-home"><div class="load"><div class="spin"></div>Loading season data</div></section>
    <section class="page" id="p-league"><div class="load"><div class="spin"></div>Loading league table</div></section>
    <section class="page" id="p-h2h"><div class="load"><div class="spin"></div>Loading head to head</div></section>
    <section class="page" id="p-stub"></section>
  </main>
</div>

<script>

   CONFIG  - everything season-specific lives here
   ===================================================================== */

  refreshMs: 60000,
  leagues: [
    {
      key: 'L1',

      subBar: '#2A1160',

        h2h:         '800583406',

        h2hForm:     '379347250',

      }
    }
  ],
  managers: {
    'Ben L':    { body:'#6CABE0', accent:'#8B1E33', type:'#1C2C5B' },
    'Adam S':   { body:'#FFD700', accent:'#003087', type:'#003087' },
    'Danny C':  { body:'#D4AF37', accent:'#8A6A0C', type:'#2A2A2A' },
    'Habeel K': { body:'#C8102E', accent:'#FFFFFF', type:'#FFFFFF' },
    'Josh R':   { body:'#6B2D6B', accent:'#6CADDF', type:'#FFFFFF' },
    'Jamie S':  { body:'#1D4ED8', accent:'#FFD700', type:'#FFFFFF' },
    'Hugo H':   { body:'#003087', accent:'#FFD700', type:'#FFFFFF' },
    'Chris W':  { body:'#003087', accent:'#FFD700', type:'#FFFFFF' },
    'Max W':    { body:'#111111', accent:'#FFD700', type:'#FFFFFF' },

    { key:'h2h',    name:'Head to Head',   colour:'#003399', meta:'GW1-36 - final GW38' },
    { key:'cup',    name:'FFS Cup',        colour:'#CC0000', meta:'GW21-30 - final GW38' },

  ],
  img: {

    manager:   function(name){ return 'img/managers/' + slug(name) + '.jpg'; },
    comp:      function(key){ return 'img/comps/' + key + '.png'; }
  }
};

/* =====================================================================
   UTILITIES
   ===================================================================== */
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function num(v){ var x = parseFloat(v); return isNaN(x) ? 0 : x; }
function txt(v){ return (v === null || v === undefined || v === '') ? '-' : String(v); }
function ordinal(n){
  var s = n % 100; if (s >= 11 && s <= 13) return n + 'th';
  var r = n % 10;
  return n + (r === 1 ? 'st' : r === 2 ? 'nd' : r === 3 ? 'rd' : 'th');
}
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }

/* photo element with graceful fallback to initials */
function photo(name, size){
  var wrap = el('span','ph');
  if (size) { wrap.style.width = size + 'px'; wrap.style.height = size + 'px'; }
  var im = document.createElement('img');
  im.alt = '';
  im.src = CONFIG.img.manager(name);
  im.addEventListener('error', function(){
    if (im.parentNode) im.parentNode.removeChild(im);
    wrap.textContent = String(name).substring(0,2);
  });
  wrap.appendChild(im);
  return wrap;
}

/* =====================================================================
   DATA LAYER
   ===================================================================== */
var cache = {};

function parseCSV(text){
  var lines = text.replace(/\r/g,'').split('\n');
  var rows = [];
  for (var i = 0; i < lines.length; i++){
    var line = lines[i], row = [], cell = '', q = false;
    for (var c = 0; c < line.length; c++){
      var ch = line[c];
      if (ch === '"') { q = !q; }
      else if (ch === ',' && !q) { row.push(cell.trim()); cell = ''; }
      else { cell += ch; }
    }
    row.push(cell.trim());
    rows.push(row);
  }
  return rows;
}

function sheetUrl(league, key){ return CONFIG.sheetBase + league.gids[key]; }

function fetchSheet(league, key){
  var url = sheetUrl(league, key);
  if (cache[url]) return Promise.resolve(cache[url]);
  return fetch(url)
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(t){ var rows = parseCSV(t); cache[url] = rows; return rows; });
}

/* ---- parsers ---- */
/* League Table: 0 Pos | 1 Team | 2 Manager | 3 Pld | 4 Total | 5 Ave | 6 High */
function parseLeagueTable(rows){
  return rows.slice(1)
    .filter(function(r){ return r[0] && r[1]; })
    .map(function(r, i){
      return {
        pos: num(r[0]) || (i+1),
        name: String(r[1]).trim(),
        played: num(r[3]),
        points: num(r[4]),
        ave: r[5],
        high: num(r[6])
      };
    });
}

/* Gameweek Scores: row0 = ['GW', name, name...]; rows 'GW1'.. */
function parseGwScores(rows){
  if (!rows || rows.length < 2) return { names: [], byName: {}, played: 0 };
  var names = rows[0].slice(1).map(function(s){ return String(s).trim(); }).filter(Boolean);
  var byName = {};
  names.forEach(function(nm){ byName[nm] = []; });
  var played = 0;
  rows.slice(1).forEach(function(r){
    if (!r[0] || String(r[0]).indexOf('GW') !== 0) return;
    var any = false;
    names.forEach(function(nm, i){
      var v = num(r[i+1]);
      byName[nm].push(v);
      if (v > 0) any = true;
    });
    if (any) played++;
  });
  return { names: names, byName: byName, played: played };
}

/* H2H sheet: standings block then fixtures block */
function parseH2H(rows){
  var table = [], fixtures = [], inTable = false, inFix = false;
  rows.forEach(function(r){
    var f0 = r[0] ? String(r[0]).trim() : '';
    if (f0 === 'Pos') { inTable = true; inFix = false; return; }
    if (f0 === 'Fixtures' || (f0 === 'GW' && r[1] === 'Home')) { inTable = false; inFix = true; return; }
    if (inTable && f0 && !isNaN(f0)) {
      table.push({ pos:num(r[0]), name:String(r[1]).trim(), played:num(r[2]), w:num(r[3]),
                   d:num(r[4]), l:num(r[5]), f:num(r[6]), a:num(r[7]), pd:num(r[8]), pts:num(r[9]) });
    }
    if (inFix && f0.indexOf('GW') === 0) {
      fixtures.push({ gw: num(f0.replace('GW','')), home:r[1], hs:r[2], as:r[3], away:r[4] });
    }
  });
  return { table: table, fixtures: fixtures };
}

/* Cup groups sheet */
function parseCupGroups(rows){
  var a = [], b = [], where = '';
  rows.forEach(function(r){
    var f0 = r[0] ? String(r[0]).trim() : '';
    if (f0.indexOf('Group A') >= 0) { where = 'a'; return; }
    if (f0.indexOf('Group B') >= 0) { where = 'b'; return; }
    if (f0 === 'Fixtures' || (f0 === 'GW' && r[1] === 'Home')) { where = ''; return; }
    if (f0 === 'Pos') return;
    if (where && f0 && !isNaN(f0)) {
      var row = { pos:num(r[0]), name:String(r[1]).trim(), played:num(r[2]), w:num(r[3]),
                  d:num(r[4]), l:num(r[5]), f:num(r[6]), pd:num(r[8]), pts:num(r[9]) };
      (where === 'a' ? a : b).push(row);
    }
  });
  return { a: a, b: b };
}

/* KO sheets - generic: label, home, hs, as, away */
function parseKO(rows){
  var out = [], champion = '';
  rows.forEach(function(r){
    var f0 = r[0] ? String(r[0]).trim() : '';
    if (!f0) return;
    var low = f0.toLowerCase();
    if (low.indexOf('champion') >= 0) { champion = r[1] ? String(r[1]).trim() : ''; return; }
    if (!r[1] || !r[4]) return;
    out.push({ label:f0, home:String(r[1]).trim(), hs:r[2], as:r[3], away:String(r[4]).trim() });
  });
  return { ties: out, champion: champion };
}

/* H2H form grid: row0 = Team | GW1 | GW2 ... ; rows = team name + W/D/L */
function parseH2HForm(rows){
  if (!rows || rows.length < 2) return { gws: [], byName: {} };
  var gws = rows[0].slice(1).map(function(s){ return String(s).trim(); }).filter(Boolean);
  var byName = {};
  rows.slice(1).forEach(function(r){
    var nm = r[0] ? String(r[0]).trim() : '';
    if (!nm || nm === 'Team' || nm.indexOf('GW') === 0) return;
    var vals = [];
    for (var i = 1; i <= gws.length; i++){
      vals.push(r[i] ? String(r[i]).trim() : '');
    }
    byName[nm] = vals;
  });
  return { gws: gws, byName: byName };
}

   [bestGw,'BEST GW - ' + bestGwTeam.toUpperCase()],[avg.toFixed(1),'LEAGUE AVERAGE']]

  var cupWin = winnerOf(DATA.cupKO, null);

    if (c.key === 'h2h')    { winner = h2hWin.name || '-'; note = h2hWin.note || c.meta; }
    if (c.key === 'cup')    { winner = cupWin.name || '-'; note = cupWin.note || c.meta; }

    var r = e.target.closest('.comp[data-comp]');
    if (r) go(r.getAttribute('data-comp'));
  });

function winnerOf(ko, table){
  if (ko && ko.champion && ko.champion !== 'TBD') return { name: ko.champion, note: 'Champion' };
  if (ko && ko.ties && ko.ties.length){
    var fin = null;
    ko.ties.forEach(function(t){ if (String(t.label).toLowerCase().indexOf('final') >= 0 && String(t.label).toLowerCase().indexOf('semi') < 0) fin = t; });
    if (!fin) fin = ko.ties[ko.ties.length - 1];
    if (fin && fin.hs !== '' && fin.as !== ''){
      var hw = num(fin.hs) > num(fin.as);
      return { name: hw ? fin.home : fin.away, note: 'Beat ' + (hw ? fin.away : fin.home) + ' ' + fin.hs + '-' + fin.as };
    }
  }
  if (table && table.length) return { name: table[0].name, note: table[0].pts + ' pts' };
  return { name: '', note: '' };
}

/* =====================================================================
   SIDE PANEL - rotates through competitions
   ===================================================================== */
var panels = [], panelIdx = 0, panelTimer = null;

/* a competition counts as being at the knockout stage once its KO sheet
   holds at least one tie with two real teams in it */
function koActive(ko){
  if (!ko || !ko.ties || !ko.ties.length) return false;
  return ko.ties.some(function(t){
    return t.home && t.away && t.home !== 'TBD' && t.away !== 'TBD';
  });
}

function renderKOList(host, ko, colour){
  var ties = ko.ties.filter(function(t){
    return t.home && t.away && t.home !== 'TBD' && t.away !== 'TBD';
  }).slice(-4);

  ties.forEach(function(t){
    var lab = String(t.label).split('-')[0].trim();
    var head = el('div', null, lab.toUpperCase());
    head.style.cssText = 'font-size:9px;font-weight:800;letter-spacing:1px;color:#8a939c;margin:7px 0 3px';
    host.appendChild(head);

    var played = t.hs !== '' && t.hs !== undefined && t.as !== '' && t.as !== undefined;
    var hw = played && num(t.hs) > num(t.as);
    var aw = played && num(t.as) > num(t.hs);

    var box = el('div','sp-fx');
    [[t.home, t.hs, hw],[t.away, t.as, aw]].forEach(function(side){
      var line = el('div');
      var nm = el('span', null, side[0]);
      nm.style.cssText = 'font-weight:' + (side[2] ? '700' : '500') + ';color:' + (side[2] ? 'var(--ink)' : 'var(--ink2)')
        + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px';
      var sc = el('span', null, played ? String(side[1]) : '-');
      sc.style.cssText = 'font-weight:800;color:' + (side[2] ? colour : 'var(--ink3)');
      line.appendChild(nm); line.appendChild(sc);
      box.appendChild(line);
    });
    host.appendChild(box);
  });

  if (ko.champion && ko.champion !== 'TBD'){
    var win = el('div');
    win.style.cssText = 'margin-top:9px;padding:8px 9px;background:#f7f9fb;border-left:3px solid ' + colour;
    var l = el('div', null, 'WINNER');
    l.style.cssText = 'font-size:8px;font-weight:800;letter-spacing:1.1px;color:var(--ink3)';
    var v = el('div', null, ko.champion);
    v.style.cssText = 'font-size:14px;font-weight:900;color:var(--ink);margin-top:1px';
    win.appendChild(l); win.appendChild(v);
    host.appendChild(win);
  }
}

function drawPanel(){
  if (!panels.length) return;

/* rebuild the table as it stood after a given gameweek */
function tableAt(gw){
  var out = [];
  DATA.table.forEach(function(t){
    var series = DATA.gw.byName[t.name];
    if (!series) {
      out.push({ name:t.name, points:t.points, low:'-', high:t.high, ave:t.ave, form:[] });
      return;
    }
    var slice = series.slice(0, gw);
    var total = 0, low = Infinity, high = 0;
    slice.forEach(function(v){ total += v; if (v > 0 && v < low) low = v; if (v > high) high = v; });
    out.push({
      name: t.name,
      points: total,
      low: low === Infinity ? '-' : low,
      high: high,
      ave: gw ? (total / gw).toFixed(1) : '0.0',
      form: slice.slice(-5)
    });
  });
  out.sort(function(a,b){ return b.points - a.points; });
  return out;
}

/* shared scoreline row - reused by Cup and Supercopa later */
function scoreRow(home, hs, away, as, colour){
  var played = hs !== '' && hs !== undefined && hs !== null && as !== '' && as !== undefined && as !== null;
  var hw = played && num(hs) > num(as);
  var aw = played && num(as) > num(hs);

  var row = el('div','srow');
  var n1 = el('span','nm', String(home).toUpperCase());
  n1.style.textAlign = 'right';
  n1.style.color = hw || !played ? '#fff' : 'rgba(255,255,255,.55)';
  row.appendChild(n1);

  var a1 = photo(home, 24); a1.className = 'ph av'; row.appendChild(a1);

  function sc(v, win){
    var b = el('span','sc');
    var num1 = el('b', null, played ? String(v) : '-');
    num1.style.color = win ? colour : played ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.35)';
    var bar = el('i');
    bar.style.background = win ? colour : 'transparent';
    b.appendChild(num1); b.appendChild(bar);
    return b;
  }
  row.appendChild(sc(hs, hw));
  row.appendChild(el('span','ft', played ? 'FT' : 'V'));
  row.appendChild(sc(as, aw));

  var a2 = photo(away, 24); a2.className = 'ph av'; row.appendChild(a2);

  var n2 = el('span','nm', String(away).toUpperCase());
  n2.style.color = aw || !played ? '#fff' : 'rgba(255,255,255,.55)';
  row.appendChild(n2);
  return row;
}

function streaks(arr){
  var bw=0,cw=0,bu=0,cu=0,bl=0,cl=0;
  arr.forEach(function(v){
    if (v !== 'W' && v !== 'D' && v !== 'L') return;
    cw = v === 'W' ? cw+1 : 0; if (cw > bw) bw = cw;
    cu = v === 'L' ? 0 : cu+1;  if (cu > bu) bu = cu;
    cl = v === 'L' ? cl+1 : 0;  if (cl > bl) bl = cl;
  });
  return [bw, bu, bl];
}

/* ---- fixtures by round ---- */
function buildFixtures(host){
  clear(host);
  var pad = el('div','h2h-pad');
  var byGw = {};
  DATA.h2h.fixtures.forEach(function(f){
    if (!byGw[f.gw]) byGw[f.gw] = [];
    byGw[f.gw].push(f);
  });
  var rounds = Object.keys(byGw).map(Number).sort(function(a,b){ return a-b; });
  if (!rounds.length){
    pad.appendChild(el('div','h2h-pad','No fixtures found in the H2H sheet.'));
    host.appendChild(pad);
    return;
  }
  h2hRound = rounds.length - 1;

  var nav = el('div','rnav');
  var prev = el('span','b','\u2039');
  var lab = el('span','lab','');
  var next = el('span','b','\u203A');
  nav.appendChild(prev); nav.appendChild(lab); nav.appendChild(next);
  pad.appendChild(nav);

  var grid = el('div','fxgrid');
  pad.appendChild(grid);
  host.appendChild(pad);

  function paint(){
    var gw = rounds[h2hRound];
    lab.textContent = 'GW' + gw;
    clear(grid);
    byGw[gw].forEach(function(f){
      grid.appendChild(scoreRow(f.home, f.hs, f.away, f.as, H2H_CY));
    });
  }
  prev.addEventListener('click', function(){ if (h2hRound > 0){ h2hRound--; paint(); } });
  next.addEventListener('click', function(){ if (h2hRound < rounds.length-1){ h2hRound++; paint(); } });
  paint();
}

      row.appendChild(n1);
      var v1 = el('span', null, String(sa));
      v1.style.cssText = 'min-width:26px;text-align:center;font-size:15px;font-weight:900;color:' + (num(sa)>num(sb)?H2H_CY:'rgba(255,255,255,.5)');
      row.appendChild(v1);
      var dash = el('span', null, '-'); dash.style.cssText = 'font-size:10px;color:rgba(255,255,255,.3)';
      row.appendChild(dash);
      var v2 = el('span', null, String(sb));
      v2.style.cssText = 'min-width:26px;text-align:center;font-size:15px;font-weight:900;color:' + (num(sb)>num(sa)?H2H_PK:'rgba(255,255,255,.5)');
      row.appendChild(v2);
      var n2 = el('span', null, b.toUpperCase());
      n2.style.cssText = 'flex:1;font-size:12px;font-weight:' + (num(sb)>num(sa)?'800':'600')
        + ';color:' + (num(sb)>num(sa)?'#fff':'rgba(255,255,255,.6)');
      row.appendChild(n2);
      mts.appendChild(row);
    });
  }

  sA.querySelector('select').addEventListener('change', paint);
  sB.querySelector('select').addEventListener('change', paint);
  paint();
}

/* ---- knockout ---- */
function buildKnockout(host){
  clear(host);
  var pad = el('div','h2h-pad');

  if (!DATA.h2hKO || !DATA.h2hKO.ties.length){
    var none = el('div', null, 'Knockout fixtures not yet available.');
    none.style.cssText = 'padding:26px;color:rgba(255,255,255,.45);font-size:12px;font-style:italic';
    pad.appendChild(none);
    host.appendChild(pad);
    return;
  }

  var groups = {};
  DATA.h2hKO.ties.forEach(function(t){
    var low = String(t.label).toLowerCase();
    var key = low.indexOf('semi') >= 0 || low.indexOf('sf') === 0 ? 'SEMI-FINALS - GW37' : 'FINAL - GW38';
    if (!groups[key]) groups[key] = [];
    groups[key].push(t);
  });

  ['SEMI-FINALS - GW37','FINAL - GW38'].forEach(function(k){
    if (!groups[k]) return;
    var h = el('div', null, k);
    h.style.cssText = 'font-size:9px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.9);margin:8px 0 9px';
    pad.appendChild(h);
    groups[k].forEach(function(t){
      var r = scoreRow(t.home, t.hs, t.away, t.as, H2H_CY);
      r.style.marginBottom = '9px';
      pad.appendChild(r);
    });
  });

  var win = winnerOf(DATA.h2hKO, DATA.h2h.table);
  if (win.name){
    var c = el('div','champ');
    var strip = el('div','strip');
    var s1 = el('span'); s1.style.cssText = 'flex:1;background:' + H2H_CY;
    var s2 = el('span'); s2.style.cssText = 'flex:1;background:' + H2H_PK;
    strip.appendChild(s1); strip.appendChild(s2);
    c.appendChild(strip);

    var p = el('div','panel');
    var av = el('div','av');
    var im = document.createElement('img');
    im.alt = ''; im.src = CONFIG.img.manager(win.name);
    im.addEventListener('error', function(){
      if (im.parentNode) im.parentNode.removeChild(im);
      av.textContent = win.name.substring(0,2);
    });
    av.appendChild(im);
    p.appendChild(av);

    var m = el('div'); m.style.flex = '1';
    m.appendChild(el('div','lbl','HEAD TO HEAD CHAMPION'));
    m.appendChild(el('div','nm', win.name.toUpperCase()));
    p.appendChild(m);

    var tro = el('div','tro');
    var tim = document.createElement('img');
    tim.alt = ''; tim.src = 'img/trophies/h2h.png';
    tim.addEventListener('error', function(){
      if (tim.parentNode) tim.parentNode.removeChild(tim);
      tro.textContent = 'TROPHY';
    });
    tro.appendChild(tim);
    p.appendChild(tro);

    var right = el('div');
    right.style.textAlign = 'right';
    var note = el('div', null, win.note || '');
    note.style.cssText = 'font-size:11px;font-weight:800;letter-spacing:.6px;color:#5C646E';
    right.appendChild(note);
    p.appendChild(right);

    c.appendChild(p);
    pad.appendChild(c);
  }

  host.appendChild(pad);
}

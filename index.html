<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFS Draft 26/27</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --rsm-azure:#0091DA; --rsm-green:#4C9C2C; --rsm-navy:#0C2340; --rsm-cyan:#00C1D5;
  --ink:#0C2340; --ink2:#5a6570; --ink3:#8a939c; --line:#e3e6ea; --page:#f4f6f9;
  --gold:#D4AF37; --silver:#B4BCC4; --bronze:#C08A4A; --red:#E5484D; --win:#00A651;
  --comp-league:#0091DA; --comp-h2h:#003399; --comp-cup:#CC0000; --comp-super:#C9A227;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Archivo,system-ui,sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
.shell{display:flex;min-height:100vh;max-width:1360px;margin:0 auto;background:#fff}

/* ---------- SIDEBAR ---------- */
.side{width:186px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:20px 18px 18px}
.brand-mark{display:flex;gap:3px;margin-bottom:7px}
.brand-mark i{width:12px;height:5px;background:var(--rsm-green);display:block}
.brand-mark i:last-child{width:28px;background:var(--rsm-azure)}
.brand-name{font-size:27px;font-weight:900;letter-spacing:-1px;line-height:1;color:var(--ink)}
.brand-sub{font-size:11px;font-weight:600;color:var(--ink3);margin-top:3px}
.nav{display:flex;flex-direction:column;padding:4px 0}
.nav a{font-size:14px;font-weight:500;color:#3d4852;padding:8px 18px;text-decoration:none;border-left:3px solid transparent;cursor:pointer}
.nav a:hover{background:#f7f9fb}
.nav a.on{font-weight:700;color:var(--rsm-azure);border-left-color:var(--rsm-azure)}
.side-panel{margin-top:auto;border-top:1px solid var(--line);padding:15px 18px 18px}
.sp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.sp-title{font-size:10px;font-weight:800;letter-spacing:1.1px}
.sp-rule{height:3px;width:26px;margin-bottom:11px}
.sp-body{min-height:186px}
.sp-dots{display:flex;gap:5px;margin-top:12px}
.sp-dots span{width:16px;height:3px;background:#dde3e9;cursor:pointer}
.sp-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #eef1f4;font-size:12px}
.sp-row .p{font-size:11px;font-weight:600;color:var(--ink3);width:11px}
.sp-row .n{flex:1;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-row .v{font-weight:700}
.sp-fx{border:1px solid #eef1f4;padding:7px 8px;margin-bottom:6px}
.sp-fx div{display:flex;justify-content:space-between;padding:1px 0;font-size:12px}
.sp-empty{border:1px dashed #d8dee4;padding:20px 12px;text-align:center;margin-top:28px}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0}
.page{display:none}
.page.on{display:block}
/* league bar - which strand you are looking at, on every page that
   has two of them. It is sticky because the answer has to be visible
   at the bottom of a long table as much as the top. */
.lgbar{position:sticky;top:0;z-index:30;display:none;align-items:center;gap:10px;
       padding:10px 24px;background:#fff;border-bottom:1px solid #e3e8ee}
.lgbar.on{display:flex}
.lgbar .lbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
            color:#8a939c;margin-right:2px}
.lgbar button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;
              padding:7px 16px;border-radius:3px;border:1px solid #dbe2e9;
              background:#fff;color:#5a6570;transition:none}
.lgbar button.on{color:#fff;border-color:transparent}
.lgbar .count{margin-left:auto;font-size:11px;color:#8a939c}
@media(max-width:700px){ .lgbar{padding:9px 16px} .lgbar button{padding:6px 12px;font-size:12px} }

.load{padding:70px 20px;text-align:center;color:var(--ink3);font-size:13px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--rsm-azure);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{margin:20px;padding:14px 16px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:13px}

/* hero */
.hero{position:relative;height:250px;background:#123A5C;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-slot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.hero-slot div{border:2px dashed rgba(255,255,255,.28);padding:16px 26px;text-align:center;color:rgba(255,255,255,.4);font-size:10px;font-weight:600;letter-spacing:1.2px}
.hero-scrim{position:absolute;inset:0;background:rgba(9,28,50,.64)}
.hero-copy{position:absolute;left:0;right:0;bottom:0;padding:0 26px 24px}
.hero-kicker{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--rsm-cyan);margin-bottom:9px}
.hero-title{font-size:33px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.05}
.hero-sub{font-size:13px;color:rgba(255,255,255,.75);line-height:1.5;margin:10px 0 16px;max-width:430px}
.hero-cta{background:var(--rsm-azure);display:inline-block;padding:10px 18px;font-size:12px;font-weight:700;color:#fff;cursor:pointer}

/* stat strip */
.tiles{background:var(--rsm-azure);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{padding:15px 0 15px 22px}
.tile+.tile{border-left:1px solid rgba(255,255,255,.25);padding-left:15px}
.tile b{display:block;font-size:23px;font-weight:900;color:#fff;letter-spacing:-.7px}
.tile span{display:block;font-size:9px;font-weight:600;letter-spacing:1px;color:rgba(255,255,255,.82);margin-top:3px}

.sec{padding:22px 24px 26px}
.sec-h{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:14px}
.comp{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-left-width:4px;padding:11px 13px;margin-bottom:9px}
.comp-logo{width:42px;height:42px;background:#f2f5f8;border:1px dashed #b9c4cf;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;color:#8a939c;overflow:hidden}
.comp-logo img{width:100%;height:100%;object-fit:contain}
.comp-mid{flex:1;min-width:0}
.comp-name{font-size:14px;font-weight:800;letter-spacing:-.2px}
.comp-meta{font-size:11px;color:var(--ink3);margin-top:2px}
.comp-right{text-align:right}
.comp-lbl{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--ink3)}
.comp-win{font-size:16px;font-weight:900;letter-spacing:-.3px;margin-top:1px}
.comp-note{font-size:11px;color:var(--ink2)}

/* league table page */
.lt-mast{position:relative;height:88px;overflow:hidden}
.lt-mast .bands{position:absolute;inset:0}
.lt-mast .bands i{position:absolute;top:-40px;bottom:-40px;display:block;transform:skewX(-24deg)}
.lt-mast .copy{position:relative;height:100%;display:flex;align-items:center;gap:15px;padding-left:24px}
.lt-slot{width:46px;height:46px;border:1px dashed rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;font-weight:700;letter-spacing:.8px;color:rgba(255,255,255,.7);overflow:hidden}
.lt-slot img{width:100%;height:100%;object-fit:contain}
.lt-mast h1{font-size:31px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1}
.lt-mast p{font-size:9px;font-weight:800;letter-spacing:1.8px;color:rgba(255,255,255,.8);margin-top:4px}
.lt-sub{height:32px;display:flex;align-items:flex-end;padding-left:24px}
.lt-sub span{font-size:12px;font-weight:700;color:#fff;padding-bottom:5px;border-bottom:3px solid}
.scrub{padding:13px 24px;display:flex;align-items:center;gap:11px}
.scrub .btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.scrub .btn svg{width:11px;height:11px;fill:#fff}
.scrub input{flex:1}
.scrub .val{font-size:14px;font-weight:900;min-width:54px;text-align:right}
.card{background:#fff;margin:0 20px 20px;padding:12px 16px 14px;border:1px solid var(--line)}
.lt-head,.lt-row{display:flex;align-items:center;gap:6px}
.lt-head{padding-bottom:9px;border-bottom:1px solid #EFE8F5;font-size:10px;font-weight:700;color:#6B5B78}
.lt-row{padding:8px 6px;margin:0 -6px;border-bottom:1px solid #F5F1F8;cursor:pointer}
.lt-row.pin{background:#F6EFFE}
.c-pos{width:24px;display:flex;align-items:center;gap:5px}
.c-pos i{width:3px;height:16px;display:block}
.c-pos b{font-size:13px;font-weight:800}
.c-mv{width:16px;text-align:center;font-size:9px}
.c-ph{width:26px}
.ph{width:24px;height:24px;border-radius:50%;background:#F2EFF6;border:1px solid #E6DEF0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#A99CBB;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.c-nm{flex:1;min-width:0;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-n{text-align:right;font-size:12px;color:#6B5B78}
.c-pts{width:36px;text-align:right;font-size:14px;font-weight:900}
.c-gap{width:36px;text-align:right;font-size:12px;font-weight:700}
.c-form{width:88px;text-align:right;white-space:nowrap}
.fs{display:inline-block;min-width:15px;text-align:center;font-size:9px;font-weight:800;padding:2px;margin-left:2px}
.note{margin:0 20px 22px;padding:11px 14px;background:#f7f9fb;border:1px solid var(--line);font-size:11px;color:var(--ink2);line-height:1.5}

/* ---------- H2H ---------- */
.h2h{background:#0B1340;min-height:520px}
.h2h-nav{display:flex;gap:0;padding:0 16px;background:#070C2B}
.h2h-nav button{background:none;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.5);
  font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:13px 15px;cursor:pointer}
.h2h-nav button.on{color:#fff;border-bottom-color:#00E5FF}
.h2h-mast{display:flex;align-items:center;gap:13px;padding:16px 18px 14px}
.h2h-slot{width:44px;height:44px;border:1px dashed rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:7px;font-weight:700;letter-spacing:.7px;color:rgba(255,255,255,.5);overflow:hidden}
.h2h-slot img{width:100%;height:100%;object-fit:contain}
.h2h-mast h2{font-size:18px;font-weight:900;color:#fff;letter-spacing:.4px;line-height:1}
.h2h-mast p{font-size:8px;font-weight:700;letter-spacing:1.5px;color:#00E5FF;margin-top:3px}
.h2h-mast .r{margin-left:auto;text-align:right}
.h2h-mast .r span{display:block;font-size:8px;font-weight:800;letter-spacing:1.2px;color:rgba(255,255,255,.45)}
.h2h-mast .r b{display:block;font-size:14px;font-weight:900;color:#00E5FF;margin-top:2px}
.h2h-view{display:none}
.h2h-view.on{display:block}
.h2h-wrap{display:flex}
.h2h-word{width:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.h2h-word span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:27px;font-weight:900;color:#fff;white-space:nowrap}
.h2h-body{flex:1;min-width:0;padding:0 0 16px}
.h2h-zones{width:26px;flex-shrink:0;position:relative}
.h2h-zone{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center}
.h2h-zone span{writing-mode:vertical-rl;font-size:9px;font-weight:900;letter-spacing:1.5px;white-space:nowrap}
.hh{display:flex;align-items:center;gap:6px;padding:0 12px 6px 0;font-size:8px;font-weight:800;letter-spacing:.9px;color:rgba(255,255,255,.5)}
.hr{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 0;cursor:pointer}
.hr:nth-child(odd){background:#0F1749}
.hr:nth-child(even){background:#16205F}
.h-pos{width:24px;text-align:center}
.h-pos b{display:inline-block;min-width:20px;padding:2px 0;font-size:13px;font-weight:900;letter-spacing:-.5px}
.h-ph{width:28px}
.h-ph .ph{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.55);color:#fff}
.h-nm{flex:1;min-width:0;font-size:13px;font-weight:800;color:#fff;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-n{text-align:right;font-size:11px;color:rgba(255,255,255,.55)}
.h-pts{width:26px;text-align:center}
.h-pts b{display:inline-block;min-width:24px;padding:2px 0;font-size:13px;font-weight:900;color:#1E3AE0;letter-spacing:-.5px}
.h-form{width:78px;text-align:right;white-space:nowrap}
.h-form i{display:inline-block;width:13px;height:14px;line-height:14px;text-align:center;font-size:8px;font-weight:900;
  color:#0B1340;margin-left:2px;font-style:normal}
.h-chev{width:10px;text-align:right;font-size:10px;color:rgba(255,255,255,.45)}
.h-cut{height:3px;background:#FF3D9E}
.h-open{background:#070C2B;padding:12px 14px 10px}
.h-open .lbl{font-size:8px;font-weight:900;letter-spacing:1.4px;color:#00E5FF;margin-bottom:8px}
.h-grid i{display:inline-block;width:12px;height:16px;line-height:16px;text-align:center;font-size:8px;font-weight:900;
  color:#070C2B;margin-right:1px;margin-bottom:2px;font-style:normal}
.h-streaks{display:flex;gap:22px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
.h-streaks b{display:block;font-size:19px;font-weight:900;letter-spacing:-.5px}
.h-streaks span{display:block;font-size:8px;font-weight:800;letter-spacing:1.1px;color:rgba(255,255,255,.5);margin-top:2px}
.h2h-pad{padding:0 18px 18px}
.rnav{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.rnav .b{width:26px;height:26px;border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:13px}
.rnav .lab{font-size:15px;font-weight:900;color:#FF3D9E;min-width:70px;text-align:center}
.fxgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.srow{display:flex;align-items:center;background:#16205F;padding:9px 12px}
.srow .nm{flex:1;font-size:12px;font-weight:800;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sc{display:flex;flex-direction:column;align-items:center;width:30px;flex-shrink:0}
.srow .sc b{font-size:16px;font-weight:900;letter-spacing:-.5px;line-height:1.05}
.srow .sc i{display:block;height:3px;width:20px;margin-top:3px}
.srow .ft{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);margin:0 5px;align-self:flex-start;padding-top:3px}
.srow .av{width:24px;height:24px;flex-shrink:0;margin:0 8px}
.rec-pick{display:flex;align-items:stretch;gap:10px;margin-bottom:14px}
.rec-pick .side{flex:1;background:#16205F;padding:12px;text-align:center}
.rec-pick select{width:100%;background:#0B1340;color:#fff;border:1px solid rgba(255,255,255,.25);font-family:inherit;
  font-size:12px;font-weight:800;padding:5px;outline:none}
.rec-vs{width:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#FF3D9E}
.rec-bar{display:flex;height:32px;margin-bottom:5px}
.rec-bar div{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#0B1340}
.rec-lbl{display:flex;justify-content:space-between;font-size:8px;font-weight:800;letter-spacing:1.1px;color:rgba(255,255,255,.5);margin-bottom:14px}
.rec-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.rec-stats div{background:#16205F;padding:11px}
.rec-stats b{display:block;font-size:16px;font-weight:900;letter-spacing:-.4px}
.rec-stats span{display:block;font-size:8px;font-weight:800;letter-spacing:1px;color:rgba(255,255,255,.5);margin-top:3px}
.rec-m{display:flex;align-items:center;gap:10px;padding:8px 10px}
.champ{margin-top:16px}
.champ .strip{display:flex;height:3px}
.champ .panel{background:#CFD5DC;padding:15px 18px;display:flex;align-items:center;gap:14px}
.champ .av{width:48px;height:48px;border-radius:50%;background:#5C646E;border:2px solid #EDEFF2;display:flex;align-items:center;
  justify-content:center;color:#EDEFF2;font-size:15px;font-weight:800;flex-shrink:0;overflow:hidden}
.champ .av img{width:100%;height:100%;object-fit:cover}
.champ .lbl{font-size:8px;font-weight:900;letter-spacing:2.2px;color:#5C646E}
.champ .nm{font-size:27px;font-weight:900;color:#22262B;letter-spacing:-.9px;line-height:1.05;margin-top:1px}
.champ .tro{width:56px;height:56px;border:1px dashed #8A929C;display:flex;flex-direction:column;align-items:center;
  justify-content:center;flex-shrink:0;font-size:6px;font-weight:800;letter-spacing:.7px;color:#5C646E;overflow:hidden}
.champ .tro img{width:100%;height:100%;object-fit:contain}


/* ---------- CUP ---------- */
.cup{background:#D42A26;position:relative;min-height:520px;overflow:hidden}
.cup-b1{position:absolute;left:-90px;top:-80px;width:320px;height:320px;border-radius:50%;background:#E8443F;opacity:.45}
.cup-b2{position:absolute;right:-80px;bottom:-100px;width:300px;height:300px;border-radius:50%;background:#B31F1C;opacity:.5}
.cup-nav{position:relative;display:flex;padding:0 16px;background:rgba(0,0,0,.18)}
.cup-nav button{background:none;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.65);
  font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:13px 15px;cursor:pointer}
.cup-nav button.on{color:#fff;border-bottom-color:#fff}
.cup-mast{position:relative;padding:20px 22px 16px;display:flex;align-items:center;gap:15px}
.cup-slot{width:44px;height:44px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:7px;font-weight:800;color:#fff;overflow:hidden}
.cup-slot img{width:100%;height:100%;object-fit:contain}
.cup-mast h2{font-size:25px;font-weight:900;color:#fff;letter-spacing:-.5px;line-height:1}
.cup-mast p{font-size:15px;font-weight:800;color:#D9DCE0;letter-spacing:-.2px;margin-top:3px}
.cup-view{position:relative;display:none;padding:0 18px 20px}
.cup-view.on{display:block}
.cup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cup-gt{text-align:center;font-size:11px;font-weight:900;letter-spacing:2px;color:#fff;padding-bottom:7px}
.cup-panel{background:#fff;padding:10px 12px 12px}
.cgh{display:flex;align-items:center;gap:4px;padding:0 0 6px;border-bottom:1px solid #2A2A2A;
  font-size:8px;font-weight:900;letter-spacing:.8px;color:#7A7A7A}
.cgr{display:flex;align-items:center;gap:4px;padding:6px 0;border-bottom:.5px solid #EDEFF2}
.cgr .p{width:16px;display:flex;align-items:center;gap:3px}
.cgr .p i{width:3px;height:14px;display:block}
.cgr .p b{font-size:11px;font-weight:900;color:#2A2A2A}
.cgr .av{width:20px}
.cgr .av .ph{width:19px;height:19px;background:#F0F2F5;border:1px solid #DDE1E6;color:#A8AFB7}
.cgr .nm{flex:1;min-width:0;font-size:10px;font-weight:800;letter-spacing:.3px;color:#2A2A2A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgr .n{text-align:right;font-size:10px;color:#8A8F96}
.cgr .pt{width:20px;text-align:right;font-size:14px;font-weight:900;color:#2A2A2A;letter-spacing:-.5px}
.cup-key{display:flex;gap:18px;justify-content:center;padding-top:14px}
.cup-key span{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:800;letter-spacing:.8px;color:#fff}
.cup-key i{width:3px;height:12px;display:block}
.cup-bar{display:flex;align-items:stretch;background:#fff;margin-bottom:9px}
.cup-bar .nm{flex:1;padding:10px 13px;font-size:11px;font-weight:800;letter-spacing:.9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* =====================================================================
   UTILITIES
   ===================================================================== */
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function num(v){ var x = parseFloat(v); return isNaN(x) ? 0 : x; }
function txt(v){ return (v === null || v === undefined || v === '') ? '-' : String(v); }
function ordinal(n){
  var s = n % 100; if (s >= 11 && s <= 13) return n + 'th';
  var r = n % 10;
  return n + (r === 1 ? 'st' : r === 2 ? 'nd' : r === 3 ? 'rd' : 'th');
}
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }

/* An image that tries each file type in turn, and does something
   sensible if none of them exist.

   The alternative is insisting every photo is a .jpg, which means
   converting files by hand and remembering the rule months later when
   you add one more. Four quiet 404s cost nothing; a photo that
   silently never appears costs an evening.                          */
function imgTry(base, onGone){
  var im = document.createElement('img');
  var i = 0, done = false;
  im.alt = '';
  im.addEventListener('error', function(){
    /* A browser can fire error more than once for the same element.
       Without this, the fallback runs again on each one and you get
       three "HERO IMAGE SLOT" placeholders stacked up instead of one. */
    if (done) return;
    i++;
    if (i < CONFIG.img.types.length) { im.src = base + CONFIG.img.types[i]; return; }
    done = true;
    if (im.parentNode) im.parentNode.removeChild(im);
    if (onGone) onGone();
  });
  im.src = base + CONFIG.img.types[0];
  return im;
}

/* photo element with graceful fallback to initials */
function photo(name, size){
  var wrap = el('span','ph');
  if (size) { wrap.style.width = size + 'px'; wrap.style.height = size + 'px'; }
  wrap.appendChild(imgTry(CONFIG.img.manager(name), function(){
    wrap.textContent = String(name).substring(0,2);
  }));
  return wrap;
}

/* =====================================================================
   DATA LAYER
   ===================================================================== */
var cache = {};

function parseCSV(text){
  var lines = text.replace(/\r/g,'').split('\n');
  var rows = [];
  for (var i = 0; i < lines.length; i++){
    var line = lines[i], row = [], cell = '', q = false;
    for (var c = 0; c < line.length; c++){
      var ch = line[c];
      if (ch === '"') { q = !q; }
      else if (ch === ',' && !q) { row.push(cell.trim()); cell = ''; }
      else { cell += ch; }
    }
    row.push(cell.trim());
    rows.push(row);
  }
  return rows;
}

function sheetUrl(league, key){ return CONFIG.sheetBase + league.gids[key]; }

/* Stands in for a league when the sheet belongs to neither - the two
   competitions that span both, the colours, the history.            */
var SHARED = CONFIG.shared;

function fetchSheet(league, key){
  /* A sheet whose tab id is not set yet simply does not exist. Reject
     rather than fetching a malformed URL, so the caller's catch turns
     it into null and the page shows its own empty state.            */
  if (!league || !league.gids || !league.gids[key]) {
    return Promise.reject(new Error('no tab id for ' + key));
  }
  var url = sheetUrl(league, key);
  if (cache[url]) return Promise.resolve(cache[url]);
  return fetch(url)
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(t){ var rows = parseCSV(t); cache[url] = rows; return rows; });
}

/* ---- parsers ---- */
/* League Table: 0 Pos | 1 Team | 2 Manager | 3 Pld | 4 Total | 5 Ave | 6 High */
function parseLeagueTable(rows){
  return rows.slice(1)
    .filter(function(r){ return r[0] && r[1]; })
    .map(function(r, i){
      return {
        pos: num(r[0]) || (i+1),
        name: String(r[1]).trim(),
        played: num(r[3]),
        points: num(r[4]),
        ave: r[5],
        high: num(r[6])
      };
    });
}

/* Gameweek Scores.

   The 25/26 workbook had managers across the top and gameweeks down
   the side. The new one is the other way round - one row per manager,
   38 columns - which is far easier to read and is what every
   competition consumes. So this reads the new shape:

     row 0  : Manager | GW1 | GW2 | ... | GW38
     row 1+ : Ben L   |  50 |  30 | ...

   A gameweek counts as played if any manager has a value in it. A
   genuine zero counts; a blank does not.                             */
function parseGwScores(rows){
  if (!rows || rows.length < 2) return { names: [], byName: {}, played: 0 };

  var head = rows[0] || [];
  var cols = [];
  head.forEach(function(v, i){
    if (i === 0) return;
    var t = String(v || '').trim().toUpperCase();
    if (t.indexOf('GW') === 0) cols.push(i);
  });
  if (!cols.length) return { names: [], byName: {}, played: 0 };

  var names = [], byName = {}, anyIn = {};

  rows.slice(1).forEach(function(r){
    var nm = r[0] ? String(r[0]).trim() : '';
    if (!nm) return;
    names.push(nm);
    var series = [];
    cols.forEach(function(c, k){
      var raw = r[c];
      var has = !(raw === undefined || raw === null || String(raw).trim() === '');
      if (has) anyIn[k] = true;
      series.push(has ? num(raw) : 0);
    });
    byName[nm] = series;
  });

  var played = 0;
  for (var k = 0; k < cols.length; k++) if (anyIn[k]) played = k + 1;

  return { names: names, byName: byName, played: played };
}

/* H2H sheet: standings block then fixtures block */
function parseH2H(rows){
  var table = [], fixtures = [], inTable = false, inFix = false;
  rows.forEach(function(r){
    var f0 = r[0] ? String(r[0]).trim() : '';
    if (f0 === 'Pos') { inTable = true; inFix = false; return; }
    if (f0 === 'Fixtures' || (f0 === 'GW' && r[1] === 'Home')) { inTable = false; inFix = true; return; }
    if (inTable && f0 && !isNaN(f0)) {
      table.push({ pos:num(r[0]), name:String(r[1]).trim(), played:num(r[2]), w:num(r[3]),
                   d:num(r[4]), l:num(r[5]), f:num(r[6]), a:num(r[7]), pd:num(r[8]), pts:num(r[9]) });
    }
    if (inFix && f0.indexOf('GW') === 0) {
      fixtures.push({ gw: num(f0.replace('GW','')), home:r[1], hs:r[2], as:r[3], away:r[4] });
    }
  });
  return { table: table, fixtures: fixtures };
}

/* Cup groups sheet - groups plus the fixture block beneath */
/* Group tables. Written for the two-group cups, and now also used by
   the Supercopa, which has four - so the group letter is read out of
   the heading rather than assumed to be A or B.

   .a and .b are kept as they were so the cup page did not need
   rewriting; .groups holds every group by its letter.               */
function parseCupGroups(rows){
  var groups = {}, fixtures = [], where = '';

  rows.forEach(function(r){
    var f0 = r[0] ? String(r[0]).trim() : '';

    var m = f0.match(/^Group ([A-Z])\b/);
    if (m) { where = m[1]; if (!groups[where]) groups[where] = []; return; }

    if (f0 === 'Fixtures' || (f0 === 'GW' && r[1] === 'Home')) { where = 'f'; return; }
    if (f0 === 'Pos') return;

    if (where === 'f' && f0.indexOf('GW') === 0){
      fixtures.push({ gw:num(f0.replace('GW','')), home:r[1], hs:r[2], as:r[3], away:r[4] });
      return;
    }
    if (groups[where] && f0 && !isNaN(f0)) {
      groups[where].push({ pos:num(r[0]), name:String(r[1]).trim(), played:num(r[2]),
        w:num(r[3]), d:num(r[4]), l:num(r[5]), f:num(r[6]), pd:num(r[8]), pts:num(r[9]) });
    }
  });

  return { a: groups.A || [], b: groups.B || [], groups: groups, fixtures: fixtures };
}

/* Fixtures sheet: competition | league_key | stage | gw | home | away | note

   Every competition shares this one sheet, which is what makes a
   combined record possible at all - one read gives every meeting
   between any two managers, whichever competition it happened in.  */
function parseFixtures(rows){
  if (!rows || rows.length < 2) return [];
  var out = [];
  rows.forEach(function(r){
    var comp = String(r[0] || '').trim();
    var home = String(r[4] || '').trim();
    var away = String(r[5] || '').trim();
    var gw   = num(r[3]);
    if (!comp || !home || !away || !gw) return;
    if (comp === 'competition') return;
    out.push({ comp: comp, leagueKey: String(r[1] || '').trim(),
               stage: String(r[2] || '').trim(), gw: gw,
               home: home, away: away, note: String(r[6] || '').trim() });
  });
  return out;
}

/* Every manager's gameweek scores, both leagues in one lookup.
   A manager only appears in one league, so this is a join.         */
function mergedScores(){
  var out = {};
  CONFIG.leagues.forEach(function(lg){
    var d = DATA.byLeague[lg.key];
    if (!d || !d.gw || !d.gw.byName) return;
    Object.keys(d.gw.byName).forEach(function(n){ out[n] = d.gw.byName[n]; });
  });
  return out;
}

/* Transfer Player List */
function parseTransfers(rows){
  var h = rows[0] || [];
  function ix(nm){ return h.indexOf(nm); }
  var iId = ix('ID'), iWeb = ix('Web Name'), iFirst = ix('First Name'), iSec = ix('Second Name');
  var iPos = ix('Position'), iClub = ix('Club'), iPts = ix('Total Points');
  var iG = ix('Goals'), iA = ix('Assists'), iCs = ix('Clean Sheets'), iTeam = ix('Team Owned');
  var iCode = ix('Code'), iBonus = ix('Bonus');
  var iFee = -1;
  h.forEach(function(v, k){ if (String(v).indexOf('Fee') === 0) iFee = k; });
  return rows.slice(1).filter(function(r){ return r[iId]; }).map(function(r){
    return {
      id: String(r[iId]), web: r[iWeb] || '', first: r[iFirst] || '', sec: r[iSec] || '',
      pos: r[iPos] || '', club: r[iClub] || '', pts: num(r[iPts]),
      goals: num(r[iG]), assists: num(r[iA]), cs: num(r[iCs]),
      code: iCode >= 0 ? (r[iCode] || '') : '',
      bonus: iBonus >= 0 ? num(r[iBonus]) : 0,
      team: iTeam >= 0 ? (r[iTeam] || '') : '', fee: iFee >= 0 ? num(r[iFee]) : 0
    };
  });
}

/* Player Data - bonus points keyed on ID */
function parseBonus(rows){
  var map = {};
  if (!rows || rows.length < 2) return map;
  var h = rows[0], iId = h.indexOf('ID'), iB = h.indexOf('Bonus');
  if (iId < 0 || iB < 0) return map;
  rows.slice(1).forEach(function(r){ if (r[iId]) map[String(r[iId])] = num(r[iB]); });
  return map;
}

/* Query1 - id and name to FPL photo code */
function parsePhotoCodes(rows){
  var byId = {}, byName = {};
  if (!rows || rows.length < 2) return { byId: byId, byName: byName };
  var h = rows[0], iId = -1, iCode = -1, iWeb = -1, iSec = -1;
  h.forEach(function(v, k){
    var t = String(v);
    if (t.indexOf('.id') >= 0 && iId < 0) iId = k;
    if (t.indexOf('.code') >= 0 && iCode < 0) iCode = k;
    if (t.indexOf('web_name') >= 0) iWeb = k;
    if (t.indexOf('second_name') >= 0) iSec = k;
  });
  if (iId < 0 || iCode < 0) return { byId: byId, byName: byName };
  rows.slice(1).forEach(function(r){
    var id = r[iId], code = r[iCode];
    if (!id || !code) return;
    byId[String(id).trim()] = String(code).trim();
    if (iWeb >= 0 && r[iWeb]) byName[String(r[iWeb]).toLowerCase().trim()] = String(code).trim();
    if (iSec >= 0 && r[iSec]) byName[String(r[iSec]).toLowerCase().trim()] = String(code).trim();
  });
  return { byId: byId, byName: byName };
}

/* =====================================================================
   TELLING TWO MANAGERS APART

   The record bar puts one manager's colour against another's. Twenty
   two kits chosen independently means some of them collide - and one
   pair, Ben L and Tom W, is the same hex exactly, because they picked
   the same City shirt.

   Distance is measured in Lab rather than on the hex digits, because
   hex arithmetic does not match what an eye does: two colours can be
   numerically far apart and look identical, and the reverse.

   The manager whose page you are on always keeps their own Main. The
   opponent tries Main, then Second, then Text, and takes the first
   that is far enough away. Across all 462 orderings that resolves
   every pair - 424 keep their Main, 31 fall back to Second, 7 to
   Text - so there is no need for a list of exceptions, and it will
   cope with next season's kits without anyone remembering why.
   ===================================================================== */

var KIT_CLASH_LIMIT = 25;

function labOf(hex){
  var h = String(hex || '').replace('#','');
  if (h.length !== 6) return [0,0,0];
  var v = [0,2,4].map(function(i){
    var c = parseInt(h.substr(i,2),16)/255;
    return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  });
  var X = v[0]*0.4124 + v[1]*0.3576 + v[2]*0.1805;
  var Y = v[0]*0.2126 + v[1]*0.7152 + v[2]*0.0722;
  var Z = v[0]*0.0193 + v[1]*0.1192 + v[2]*0.9505;
  function k(t){ return t > 0.008856 ? Math.pow(t, 1/3) : 7.787*t + 16/116; }
  var fx = k(X/0.95047), fy = k(Y/1.0), fz = k(Z/1.08883);
  return [116*fy - 16, 500*(fx - fy), 200*(fy - fz)];
}

function colourGap(a, b){
  var x = labOf(a), y = labOf(b);
  return Math.sqrt(Math.pow(x[0]-y[0],2) + Math.pow(x[1]-y[1],2) + Math.pow(x[2]-y[2],2));
}

/* What the opponent should be shown in, against a given manager.
   Returns { bg, fg, using } where using is main, second or text.  */
function opponentColour(mineName, theirName){
  var mine = kitFor(mineName), them = kitFor(theirName);

  var tries = [
    { bg: them.main,   fg: them.text,   using: 'main'   },
    { bg: them.second, fg: them.fourth, using: 'second' },
    { bg: them.text,   fg: them.main,   using: 'text'   }
  ];

  for (var i = 0; i < tries.length; i++){
    if (colourGap(mine.main, tries[i].bg) >= KIT_CLASH_LIMIT) return tries[i];
  }
  /* nothing separated - the last option is still the least bad */
  return tries[tries.length - 1];
}


/* =====================================================================
   ONE MANAGER'S SEASON
   Every fixture they appear in, across every competition, with the
   score attached where both sides have played.
   ===================================================================== */

function managerFixtures(name){
  var fx = DATA.fixtures || [];
  var sc = DATA.scores || {};
  var out = [];

  fx.forEach(function(f){
    var home = f.home === name, away = f.away === name;
    if (!home && !away) return;

    var opp = home ? f.away : f.home;
    /* a placeholder like "Winner of Apertura M4" is not a manager */
    var real = !!(sc[opp] || (DATA.kits && DATA.kits[opp]) || CONFIG.managers[opp]);

    var mine = sc[name] && sc[name][f.gw];
    var theirs = sc[opp] && sc[opp][f.gw];
    var played = mine !== undefined && mine !== '' && theirs !== undefined && theirs !== '';

    out.push({
      comp: f.comp, stage: f.stage, gw: f.gw, note: f.note,
      opp: opp, oppReal: real, home: home,
      mine: played ? num(mine) : null,
      theirs: played ? num(theirs) : null,
      played: played,
      result: played ? (num(mine) > num(theirs) ? 'W' : num(mine) < num(theirs) ? 'L' : 'D') : ''
    });
  });

  out.sort(function(a,b){ return a.gw - b.gw || String(a.comp).localeCompare(String(b.comp)); });
  return out;
}

/* The combined head to head against every opponent, whichever
   competition the meetings happened in. */
function managerRecord(name){
  var by = {};
  managerFixtures(name).forEach(function(f){
    if (!f.played || !f.oppReal) return;
    if (!by[f.opp]) by[f.opp] = { opp:f.opp, p:0, w:0, d:0, l:0, f:0, a:0, fx:[] };
    var r = by[f.opp];
    r.p++; r.f += f.mine; r.a += f.theirs;
    if (f.result === 'W') r.w++; else if (f.result === 'L') r.l++; else r.d++;
    r.fx.push(f);
  });
  return Object.keys(by).map(function(k){ return by[k]; })
    .sort(function(a,b){ return b.p - a.p || String(a.opp).localeCompare(String(b.opp)); });
}

/* Where a manager stands in a competition, read from the table the
   sheet already built rather than worked out again here.           */
function positionIn(comp, name){
  function find(tab){
    if (!tab) return null;
    for (var i = 0; i < tab.length; i++) if (tab[i].name === name) return tab[i];
    return null;
  }
  var sets = [];
  if (DATA.h2h) sets.push(DATA.h2h.table);
  if (DATA.cup) { sets.push(DATA.cup.a); sets.push(DATA.cup.b); }
  [DATA.superliga, DATA.apertura, DATA.clausura].forEach(function(g){
    if (!g) return;
    if (g.table) sets.push(g.table);
    if (g.groups) Object.keys(g.groups).forEach(function(k){ sets.push(g.groups[k]); });
  });
  for (var i = 0; i < sets.length; i++){
    var hit = find(sets[i]);
    if (hit) return hit;
  }
  return null;
}

/* =====================================================================
   PLAYER PHOTOS
   One place that decides which face belongs to which player, so no
   page has to work it out for itself.

   THE BUG THIS EXISTS TO KILL
   A player's photo is keyed on their FPL "code", which is a permanent
   six-digit number, and NOT on their element id. The two are easy to
   confuse and both are numbers, so using the wrong one gives you a
   perfectly valid photo of completely the wrong player.

   Worse was the old fallback: if the id missed, it looked the player
   up by name, and then by the LAST WORD of their name. Premier League
   squads are full of shared surnames - the Silvas, the Sanchezes, the
   Gomeses - so whichever one happened to be read last silently won,
   and the other wore his face all season.

   So the rules here are:

     1. The element id is the only key trusted outright.
     2. A name is used only if it belongs to exactly ONE player in the
        pool. Any name shared by two or more is thrown away entirely.
     3. No photo is better than the wrong photo. A player we cannot
        resolve with confidence gets their initials.

   Rule 3 is the whole point. A missing face reads as missing data. A
   wrong face reads as a working site that is quietly lying.
   ===================================================================== */

var PlayerPhotos = (function(){

  var byId = {};          /* element id  -> code   the trusted key   */
  var byName = {};        /* unique name -> code   only if unshared  */
  var dropped = {};       /* names thrown away, and how many shared  */
  var built = false;

  /* THE PATH MATTERS AS MUCH AS THE CODE

     Current:  .../premierleague25/photos/players/110x140/154561.png
     Old:      .../premierleague/photos/players/110x140/p154561.png

     Two differences, and both bite. The asset set is versioned -
     premierleague25 - and the current one has NO "p" in front of the
     code. The old path has not been taken down: it still answers for
     plenty of players, just with photographs from an earlier season.

     That is worse than a 404. A dead link shows initials and you know
     something is wrong. A stale link shows a real face, of the right
     player, three seasons ago, and looks like it is working.

     So the current path is tried first and the old one is kept only as
     a last resort, for anyone the new set has not got.

     When the asset set rolls over - premierleague26 and so on - change
     SET below and nothing else needs touching.                       */
  var HOST  = 'https://resources.premierleague.com/';

  /* The asset set is versioned and rolls over between seasons. Rather
     than hard-coding a guess, both are tried and the first that
     answers is used for everything afterwards.

     A single probe image decides it, once, at load. Guessing wrong
     without the probe would mean either a season of stale faces or,
     if the new set is not live yet, no faces at all - and neither
     failure announces itself.                                       */
  var SETS   = ['premierleague26', 'premierleague25'];
  var SIZES  = ['110x140', '250x250'];
  var PROBE  = '154561';          /* David Raya - known to exist */
  var active = null;              /* set once the probe answers   */

  /* Ask for one image from the newer set. If it loads, everything
     uses it; if not, fall back to the older one. Costs one request. */
  function probe(){
    if (active) return;
    var i = 0;
    var im = new Image();
    im.onload  = function(){ active = SETS[i]; };
    im.onerror = function(){
      i++;
      if (i < SETS.length) { im.src = probeUrl(SETS[i]); return; }
      active = SETS[SETS.length - 1];
    };
    im.src = probeUrl(SETS[0]);
  }

  function probeUrl(set){
    return HOST + set + '/photos/players/' + SIZES[0] + '/' + PROBE + '.png';
  }

  /* The sets in the order worth trying: whichever the probe found
     first, then the other, so a photo still appears even if the probe
     has not come back yet.                                          */
  function setOrder(){
    if (!active) return SETS;
    return [active].concat(SETS.filter(function(x){ return x !== active; }));
  }

  function reset(){
    byId = {}; byName = {}; dropped = {}; built = false;
  }

  /* Build the indexes from the Transfer Player List, which carries an
     ID column and a Code column for all 587.                        */
  function build(players){
    reset();
    probe();
    if (!players || !players.length) return;

    var nameCount = {};

    players.forEach(function(p){
      var code = clean(p.code);
      var id   = clean(p.id);
      if (!code) return;

      if (id) byId[id] = code;

      /* count every name form before trusting any of them */
      names(p).forEach(function(n){
        if (!nameCount[n]) nameCount[n] = {};
        nameCount[n][code] = true;
      });
    });

    /* a name is only usable if every player answering to it is the
       same player */
    Object.keys(nameCount).forEach(function(n){
      var codes = Object.keys(nameCount[n]);
      if (codes.length === 1) byName[n] = codes[0];
      else dropped[n] = codes.length;
    });

    built = true;
  }

  function clean(v){
    var t = String(v == null ? '' : v).trim();
    return /^\d+$/.test(t) ? t : '';
  }

  function key(v){
    return String(v == null ? '' : v).toLowerCase().trim().replace(/\s+/g,' ');
  }

  /* The forms a player might be referred to by elsewhere on the site.
     Deliberately does NOT include the surname on its own - that is
     the form that collides, and the counting above would drop most of
     them anyway, but there is no reason to invite it.               */
  function names(p){
    var out = [];
    if (p.web) out.push(key(p.web));
    if (p.first && p.sec) out.push(key(p.first + ' ' + p.sec));
    if (p.name) out.push(key(p.name));
    return out.filter(function(n){ return n.length > 1; });
  }

  /* The code for a player, or '' if we are not sure.                */
  function codeFor(id, name){
    if (!built) return '';

    var byid = byId[clean(id)];
    if (byid) return byid;

    var n = key(name);
    if (n && byName[n]) return byName[n];

    return '';
  }

  function urls(code){
    var out = [];
    setOrder().forEach(function(set){
      SIZES.forEach(function(sz){
        out.push(HOST + set + '/photos/players/' + sz + '/' + code + '.png');
      });
    });
    /* last resort only - see the note above about stale faces */
    out.push(HOST + 'premierleague/photos/players/110x140/p' + code + '.png');
    return out;
  }

  /* An <img> that walks the sizes, then gives up quietly.           */
  function imgFor(code, onGone){
    var list = urls(code);
    var im = document.createElement('img');
    var i = 0, done = false;
    im.alt = '';
    im.addEventListener('error', function(){
      if (done) return;
      i++;
      if (i < list.length) { im.src = list[i]; return; }
      done = true;
      if (im.parentNode) im.parentNode.removeChild(im);
      if (onGone) onGone();
    });
    im.src = list[0];
    return im;
  }

  /* The one thing pages call. */
  function element(id, name, size){
    var wrap = el('span','ph');
    if (size){ wrap.style.width = size + 'px'; wrap.style.height = size + 'px'; }

    var code = codeFor(id, name);
    if (!code){ wrap.textContent = initials(name); return wrap; }

    wrap.appendChild(imgFor(code, function(){ wrap.textContent = initials(name); }));
    return wrap;
  }

  function initials(name){
    var n = String(name || '?').trim();
    return n.substring(0,2).toUpperCase();
  }

  /* Say plainly how well this is working, rather than leaving it to
     be judged by squinting at a page.                               */
  function report(players){
    var total = (players || []).length;
    var withCode = 0, resolvable = 0, unresolved = [];

    (players || []).forEach(function(p){
      if (clean(p.code)) withCode++;
      if (codeFor(p.id, p.web)) resolvable++;
      else unresolved.push(p.web || p.name || p.id);
    });

    var shared = Object.keys(dropped);

    return {
      players: total,
      withCode: withCode,
      resolvable: resolvable,
      byIdEntries: Object.keys(byId).length,
      byNameEntries: Object.keys(byName).length,
      sharedNamesDropped: shared.length,
      sharedNames: shared.slice(0, 20),
      unresolved: unresolved.slice(0, 20)
    };
  }

  return {
    build: build,
    codeFor: codeFor,
    urls: urls,
    element: element,
    report: report,
    _sets: SETS,
    _active: function(){ return active; },
    _sizes: SIZES
  };
})();

/* Kept so the pages did not all need rewriting. */
function playerPhoto(id, nm, size){ return PlayerPhotos.element(id, nm, size); }
function playerPhotoUrl(id, nm){
  var code = PlayerPhotos.codeFor(id, nm);
  return code ? PlayerPhotos.urls(code)[0] : null;
}

/* Type photoCheck() in the browser console to see how many of the 587
   resolve, and which names were thrown away for being shared.      */
function photoCheck(){
  var r = PlayerPhotos.report(DATA.players);
  console.log('player photos');
  console.log('  players in the pool     ', r.players);
  console.log('  with a code in the sheet', r.withCode);
  console.log('  resolvable to a photo   ', r.resolvable);
  console.log('  indexed by element id   ', r.byIdEntries);
  console.log('  indexed by unique name  ', r.byNameEntries);
  console.log('  names dropped as shared ', r.sharedNamesDropped, r.sharedNames);
  if (r.unresolved.length) console.log('  unresolved              ', r.unresolved);
  return r;
}

/* KO sheets - generic: label, home, hs, as, away */
/* USER Kits: 0 Manager | 1 League | 2 Main | 3 Second | 4 Text | 5 4th | 6 Kit

   Main, Second and Text are the manager's identity - the shirt they
   picked. The 4th is functional: it is what gets written on Second,
   and it exists because white on a pale Second is unreadable, which
   is what broke last season.

   Anything unreadable falls back rather than coming through blank, so
   nothing downstream has to guard against an empty colour.          */
/* Squads L1 / L2. Two blocks:

     SUMMARY  Manager | Name | Players | Spent | Remaining | Squad Points
              | Points in XI | Best Player | Source
     SQUADS   Manager | Player | Pos | Club | Fee | Starts | Points in XI
              | Points Total | PPG in XI | Status

   Read by finding the two markers rather than by counting rows, so an
   extra blank line in the sheet cannot shift everything by one.     */
function parseSquads(rows){
  if (!rows || !rows.length) return null;

  var mode = '', summary = [], players = [];

  for (var i = 0; i < rows.length; i++){
    var r = rows[i];
    var first = String(r[0] || '').trim();

    if (first === 'SUMMARY') { mode = 'S'; continue; }
    if (first === 'SQUADS')  { mode = 'P'; continue; }
    if (!first || first === 'Manager') continue;

    if (mode === 'S'){
      summary.push({
        name:      first,
        real:      String(r[1] || '').trim(),
        count:     num(r[2]),
        spent:     r[3] === '' ? null : num(r[3]),
        remaining: r[4] === '' ? null : num(r[4]),
        squadPts:  num(r[5]),
        xiPts:     num(r[6]),
        best:      String(r[7] || '').trim(),
        source:    String(r[8] || '').trim()
      });
    } else if (mode === 'P'){
      players.push({
        manager:  first,
        name:     String(r[1] || '').trim(),
        pos:      String(r[2] || '').trim(),
        club:     String(r[3] || '').trim(),
        fee:      r[4] === '' ? null : num(r[4]),
        starts:   num(r[5]),
        xiPts:    num(r[6]),
        totalPts: num(r[7]),
        ppg:      num(r[8]),
        status:   String(r[9] || '').trim()
      });
    }
  }

  if (!summary.length && !players.length) return null;

  var byManager = {};
  summary.forEach(function(m){ byManager[m.name] = { summary: m, players: [] }; });
  players.forEach(function(p){
    if (!byManager[p.manager]) byManager[p.manager] = { summary: null, players: [] };
    byManager[p.manager].players.push(p);
  });

  return { summary: summary, players: players, byManager: byManager };
}

function parseKits(rows){
  if (!rows || !rows.length) return null;
  var out = {};
  for (var i = 1; i < rows.length; i++){
    var r = rows[i];
    var name = String(r[0] || '').trim();
    if (!name) continue;
    out[name] = {
      main:   hex(r[2]) || KIT_FALLBACK.main,
      second: hex(r[3]) || KIT_FALLBACK.second,
      text:   hex(r[4]) || KIT_FALLBACK.text,
      fourth: hex(r[5]) || KIT_FALLBACK.fourth,
      kit:    String(r[6] || '').trim()
    };
  }
  return Object.keys(out).length ? out : null;
}

var KIT_FALLBACK = { main:'#3A3A3A', second:'#EFEFEF', text:'#FFFFFF', fourth:'#111111' };

function hex(v){
  var t = String(v == null ? '' : v).trim().replace(/^#/,'').toUpperCase();
  if (/^[0-9A-F]{3}$/.test(t)) t = t[0]+t[0]+t[1]+t[1]+t[2]+t[2];
  return /^[0-9A-F]{6}$/.test(t) ? '#' + t : '';
}

/* One manager's colours. The sheet wins; CONFIG.managers is only what
   the site falls back to if the sheet cannot be read at all.

   `body`, `accent` and `type` are the names the older pages use, and
   are kept as aliases so nothing had to be rewritten to take the new
   colours.                                                          */
function kitFor(name){
  var k = (DATA.kits && DATA.kits[name]) || CONFIG.managers[name] || KIT_FALLBACK;
  return {
    main:   k.main   || k.body   || KIT_FALLBACK.main,
    second: k.second || k.accent || KIT_FALLBACK.second,
    text:   k.text   || k.type   || KIT_FALLBACK.text,
    fourth: k.fourth || KIT_FALLBACK.fourth,
    kit:    k.kit || '',
    /* aliases for the pages written before the kits sheet existed */
    body:   k.main   || k.body   || KIT_FALLBACK.main,
    accent: k.second || k.accent || KIT_FALLBACK.second,
    type:   k.text   || k.type   || KIT_FALLBACK.text
  };
}

function parseKO(rows){
  var out = [], champion = '';
  rows.forEach(function(r){
    var f0 = r[0] ? String(r[0]).trim() : '';
    if (!f0) return;
    var low = f0.toLowerCase();
    if (low.indexOf('champion') >= 0) { champion = r[1] ? String(r[1]).trim() : ''; return; }
    if (!r[1] || !r[4]) return;
    out.push({ label:f0, home:String(r[1]).trim(), hs:r[2], as:r[3], away:String(r[4]).trim() });
  });
  return { ties: out, champion: champion };
}

/* H2H form grid: row0 = Team | GW1 | GW2 ... ; rows = team name + W/D/L */
function parseH2HForm(rows){
  if (!rows || rows.length < 2) return { gws: [], byName: {} };
  var gws = rows[0].slice(1).map(function(s){ return String(s).trim(); }).filter(Boolean);
  var byName = {};
  rows.slice(1).forEach(function(r){
    var nm = r[0] ? String(r[0]).trim() : '';
    if (!nm || nm === 'Team' || nm.indexOf('GW') === 0) return;
    var vals = [];
    for (var i = 1; i <= gws.length; i++){
      vals.push(r[i] ? String(r[i]).trim() : '');
    }
    byName[nm] = vals;
  });
  return { gws: gws, byName: byName };
}

/* Point the shared DATA.table / DATA.gw at one league. Everything that
   already existed reads those two, so switching league is a matter of
   repointing them rather than reworking every render function.      */
function useLeague(key){
  LEAGUE = leagueByKey(key);
  var d = DATA.byLeague[key] || {};

  DATA.table   = d.table   || null;
  DATA.gw      = d.gw      || null;
  DATA.squads  = d.squads  || null;
  DATA.h2h     = d.h2h     || null;
  DATA.h2hKO   = d.h2hKO   || null;
  DATA.h2hForm = d.h2hForm || null;
  DATA.cup     = d.cup     || null;
  DATA.cupKO   = d.cupKO   || null;

  /* Every one of those pages is drawn from league data, so a page
     already drawn for the other league is now wrong. Marking them
     unloaded makes each redraw the next time it is opened, and the
     one on screen is redrawn straight away.

     Without this, switching league left whichever page you were on
     showing the previous league's numbers under the new league's
     name - wrong, and wrong in a way that looks fine.               */
  loaded.league = false;
  loaded.h2h    = false;
  loaded.cup    = false;
  loaded.managers = false;

  sqTeam = null;

  if (typeof route !== 'undefined' && bootDone) {
    buildNav();
    buildLeagueBar();
    redrawCurrent();
  }
}

var bootDone = false;

/* Redraw whichever page is showing, without touching the others. */
function redrawCurrent(){
  if (route === 'league')      renderLeague();
  else if (route === 'h2h')    renderH2H();

/* =====================================================================
   BOOT - load core sheets then render
   ===================================================================== */
function boot(){
  /* Every competition sheet beyond the league tables is still to be
     built. fetchSheet rejects for a gid that is not set, the catch
     turns that into null, and each page already handles null by
     showing its own "not yet available" state. So this loads what
     exists today and grows as sheets appear.                        */
  var jobs = [];

  CONFIG.leagues.forEach(function(lg){
    jobs.push(
      fetchSheet(lg,'leagueTable').then(parseLeagueTable).catch(function(){ return null; })
        .then(function(t){
          if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
          DATA.byLeague[lg.key].table = t;
        })
    );
    jobs.push(
      fetchSheet(lg,'gwScores').then(parseGwScores).catch(function(){ return null; })
        .then(function(g){
          if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
          DATA.byLeague[lg.key].gw = g;
        })
    );
  });

  /* colours first - every page reads them, and a page that renders
     before they arrive would show the fallback greys and then flicker */
  jobs.push(fetchSheet(SHARED,'kits').then(parseKits).catch(function(){ return null; })
    .then(function(k){ DATA.kits = k; }));

  /* one sheet holds every competition's fixtures, which is what makes
     a combined record across all of them possible */
  jobs.push(fetchSheet(SHARED,'fixtures').then(parseFixtures).catch(function(){ return []; })
    .then(function(f){ DATA.fixtures = f; }));

  jobs.push(fetchSheet(SHARED,'superliga').then(parseCupGroups).catch(function(){ return null; })
    .then(function(x){ DATA.superliga = x; }));
  jobs.push(fetchSheet(SHARED,'apertura').then(parseCupGroups).catch(function(){ return null; })
    .then(function(x){ DATA.apertura = x; }));
  jobs.push(fetchSheet(SHARED,'clausura').then(parseCupGroups).catch(function(){ return null; })
    .then(function(x){ DATA.clausura = x; }));
  jobs.push(fetchSheet(SHARED,'aperturaKO').then(parseKO).catch(function(){ return null; })
    .then(function(x){ DATA.aperturaKO = x; }));
  jobs.push(fetchSheet(SHARED,'clausuraKO').then(parseKO).catch(function(){ return null; })
    .then(function(x){ DATA.clausuraKO = x; }));

  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'squads').then(parseSquads).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].squads = x;
      }));
  });

  var L1 = CONFIG.leagues[0];
  jobs.push(fetchSheet(L1,'transfers').then(parseTransfers).catch(function(){ return null; })
    .then(function(p){ DATA.players = p; }));
  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'h2h').then(parseH2H).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].h2h = x;
        if (lg.key === 'L1') DATA.h2h = x;
      }));
  });
  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'cupGroups').then(parseCupGroups).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].cup = x;
        if (lg.key === 'L1') DATA.cup = x;
      }));
  });
  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'h2hKO').then(parseKO).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].h2hKO = x;
        if (lg.key === 'L1') DATA.h2hKO = x;
      }));
  });
  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'cupKO').then(parseKO).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].cupKO = x;
        if (lg.key === 'L1') DATA.cupKO = x;
      }));
  });
  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'h2hForm').then(parseH2HForm).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].h2hForm = x;
        if (lg.key === 'L1') DATA.h2hForm = x;
      }));
  });

  Promise.all(jobs).then(function(){
    /* the Transfer Player List carries bonus and the player code, so
       photos and bonus points come from the one sheet now           */
    PlayerPhotos.build(DATA.players);
    if (DATA.players) DATA.players.forEach(function(p){ p.bonus = p.bonus || 0; });

    DATA.scores = mergedScores();
    bootDone = false;
    useLeague(CONFIG.leagues[0].key);
    bootDone = true;
    buildNav();
    buildLeagueBar();
    renderHome();
    buildSidePanels();
  });
}



/* =====================================================================
   HOME
   ===================================================================== */
function renderHome(){
  var host = document.getElementById('p-home');
  if (loaded.home) return;
  /* A table that loaded but holds no rows is as unusable as one that
     did not load - the page below reads t[0] straight away. Treating
     them the same turns a blank white screen into a sentence.

     It happens for real between a reset and the rebuild that follows
     it, and pre-season before anyone has a squad.                    */
  if (!DATA.table || !DATA.table.length) {
    clear(host);
    var e1 = el('div','err', DATA.table
      ? 'The league table is empty. Rebuild it from the sheet, or wait for the '
        + 'first gameweek if the season has not started.'
      : 'Could not load the league table sheet. Check it is still published to the web.');
    host.appendChild(e1);
    return;
  }
  loaded.home = true;
  clear(host);

  var t = DATA.table;
  var leader = t[0];
  var margin = t.length > 1 ? (t[0].points - t[1].points) : 0;
  var played = DATA.gw ? DATA.gw.played : 0;
  var complete = played >= 38;

  /* hero */
  var hero = el('div','hero');
  /* every file type is tried before the placeholder appears, so a png
     hero does not get replaced by "HERO IMAGE SLOT" on the first miss */
  var him = imgTry(CONFIG.img.hero, function(){
    var slot = el('div','hero-slot');
    slot.appendChild(el('div', null, 'HERO IMAGE SLOT'));
    hero.insertBefore(slot, hero.firstChild);
  });
  hero.appendChild(him);
  hero.appendChild(el('div','hero-scrim'));

  var copy = el('div','hero-copy');
  copy.appendChild(el('div','hero-kicker', complete ? 'CHAMPIONS ' + CONFIG.season : 'GAMEWEEK ' + played));
  copy.appendChild(el('div','hero-title', complete ? leader.name + ' takes the title' : leader.name + ' leads the way'));
  var story = complete
    ? 'Champions by ' + margin + ' points from ' + (t[1] ? t[1].name : '') + ', with ' + leader.points + ' across the season.'
    : leader.name + ' tops the table on ' + leader.points + ' points, ' + margin + ' clear of ' + (t[1] ? t[1].name : '') + '.';
  copy.appendChild(el('div','hero-sub', story));
  var cta = el('div','hero-cta','View full standings');
  cta.addEventListener('click', function(){ go('league'); });
  copy.appendChild(cta);
  hero.appendChild(copy);
  host.appendChild(hero);

  /* tiles */
  var totalPoints = 0, bestGw = 0, bestGwTeam = '';
  t.forEach(function(r){ totalPoints += r.points; if (r.high > bestGw) { bestGw = r.high; bestGwTeam = r.name; } });
  var avg = played ? (totalPoints / (played * t.length)) : 0;

  var tiles = el('div','tiles');
  [[played,'GAMEWEEKS'],[totalPoints.toLocaleString(),'POINTS SCORED'],
   [bestGw,'BEST GW - ' + bestGwTeam.toUpperCase()],[avg.toFixed(1),'LEAGUE AVERAGE']]
    .forEach(function(pair){
      var d = el('div','tile');
      d.appendChild(el('b', null, String(pair[0])));
      d.appendChild(el('span', null, pair[1]));
      tiles.appendChild(d);
    });
  host.appendChild(tiles);

  /* competitions */
  var sec = el('div','sec');
  sec.appendChild(el('div','sec-h','Competitions'));

  var h2hWin = winnerOf(DATA.h2hKO, DATA.h2h ? DATA.h2h.table : null);
  var cupWin = winnerOf(DATA.cupKO, null);

  CONFIG.comps.forEach(function(c){
    var winner = '-', note = c.meta;
    if (c.key === 'league') { winner = leader.name; note = leader.points + ' pts - ' + (complete ? 'won by ' + margin : margin + ' ahead'); }
    if (c.key === 'h2h')    { winner = h2hWin.name || '-'; note = h2hWin.note || c.meta; }
    if (c.key === 'cup')    { winner = cupWin.name || '-'; note = cupWin.note || c.meta; }
    if (c.key === 'superliga') { winner = '-'; note = c.meta; }
    if (c.key === 'supercopa') { winner = '-'; note = c.meta; }

    var row = el('div','comp');
    row.style.borderLeftColor = c.colour;
    row.style.cursor = 'pointer';
    row.setAttribute('data-comp', c.key);
    if (winner === '-') row.style.opacity = '.72';

    var lg = el('div','comp-logo');
    var lim = imgTry(CONFIG.img.comp(c.key), function(){ lg.textContent = 'LOGO'; });
    lg.appendChild(lim);
    row.appendChild(lg);

    var mid = el('div','comp-mid');
    mid.appendChild(el('div','comp-name', c.name));
    mid.appendChild(el('div','comp-meta', c.meta));
    row.appendChild(mid);

    var right = el('div','comp-right');
    right.appendChild(el('div','comp-lbl','WINNER'));
    right.appendChild(el('div','comp-win', winner));
    right.appendChild(el('div','comp-note', note));
    row.appendChild(right);

    sec.appendChild(row);
  });

  sec.addEventListener('click', function(e){
    var r = e.target.closest('.comp[data-comp]');
    if (r) go(r.getAttribute('data-comp'));
  });

  host.appendChild(sec);
}

function winnerOf(ko, table){
  if (ko && ko.champion && ko.champion !== 'TBD') return { name: ko.champion, note: 'Champion' };
  if (ko && ko.ties && ko.ties.length){
    var fin = null;
    ko.ties.forEach(function(t){ if (String(t.label).toLowerCase().indexOf('final') >= 0 && String(t.label).toLowerCase().indexOf('semi') < 0) fin = t; });
    if (!fin) fin = ko.ties[ko.ties.length - 1];
    if (fin && fin.hs !== '' && fin.as !== ''){
      var hw = num(fin.hs) > num(fin.as);
      return { name: hw ? fin.home : fin.away, note: 'Beat ' + (hw ? fin.away : fin.home) + ' ' + fin.hs + '-' + fin.as };
    }
  }
  if (table && table.length) return { name: table[0].name, note: table[0].pts + ' pts' };
  return { name: '', note: '' };
}

var panels = [], panelIdx = 0, panelTimer = null;

/* a competition counts as being at the knockout stage once its KO sheet
   holds at least one tie with two real teams in it */
function koActive(ko){
  if (!ko || !ko.ties || !ko.ties.length) return false;
  return ko.ties.some(function(t){
    return t.home && t.away && t.home !== 'TBD' && t.away !== 'TBD';
  });
}

function renderKOList(host, ko, colour){
  var ties = ko.ties.filter(function(t){
    return t.home && t.away && t.home !== 'TBD' && t.away !== 'TBD';
  }).slice(-4);

  ties.forEach(function(t){
    var lab = String(t.label).split('-')[0].trim();
    var head = el('div', null, lab.toUpperCase());
    head.style.cssText = 'font-size:9px;font-weight:800;letter-spacing:1px;color:#8a939c;margin:7px 0 3px';
    host.appendChild(head);

    var played = t.hs !== '' && t.hs !== undefined && t.as !== '' && t.as !== undefined;
    var hw = played && num(t.hs) > num(t.as);
    var aw = played && num(t.as) > num(t.hs);

    var box = el('div','sp-fx');
    [[t.home, t.hs, hw],[t.away, t.as, aw]].forEach(function(side){
      var line = el('div');
      var nm = el('span', null, side[0]);
      nm.style.cssText = 'font-weight:' + (side[2] ? '700' : '500') + ';color:' + (side[2] ? 'var(--ink)' : 'var(--ink2)')
        + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px';
      var sc = el('span', null, played ? String(side[1]) : '-');
      sc.style.cssText = 'font-weight:800;color:' + (side[2] ? colour : 'var(--ink3)');
      line.appendChild(nm); line.appendChild(sc);
      box.appendChild(line);
    });
    host.appendChild(box);
  });

  if (ko.champion && ko.champion !== 'TBD'){
    var win = el('div');
    win.style.cssText = 'margin-top:9px;padding:8px 9px;background:#f7f9fb;border-left:3px solid ' + colour;
    var l = el('div', null, 'WINNER');
    l.style.cssText = 'font-size:8px;font-weight:800;letter-spacing:1.1px;color:var(--ink3)';
    var v = el('div', null, ko.champion);
    v.style.cssText = 'font-size:14px;font-weight:900;color:var(--ink);margin-top:1px';
    win.appendChild(l); win.appendChild(v);
    host.appendChild(win);
  }
}

/* rebuild the table as it stood after a given gameweek */
function tableAt(gw){
  var out = [];
  DATA.table.forEach(function(t){
    var series = DATA.gw.byName[t.name];
    if (!series) {
      out.push({ name:t.name, points:t.points, low:'-', high:t.high, ave:t.ave, form:[] });
      return;
    }
    var slice = series.slice(0, gw);
    var total = 0, low = Infinity, high = 0;
    slice.forEach(function(v){ total += v; if (v > 0 && v < low) low = v; if (v > high) high = v; });
    out.push({
      name: t.name,
      points: total,
      low: low === Infinity ? '-' : low,
      high: high,
      ave: gw ? (total / gw).toFixed(1) : '0.0',
      form: slice.slice(-5)
    });
  });
  out.sort(function(a,b){ return b.points - a.points; });
  return out;
}

function streaks(arr){
  var bw=0,cw=0,bu=0,cu=0,bl=0,cl=0;
  arr.forEach(function(v){
    if (v !== 'W' && v !== 'D' && v !== 'L') return;
    cw = v === 'W' ? cw+1 : 0; if (cw > bw) bw = cw;
    cu = v === 'L' ? 0 : cu+1;  if (cu > bu) bu = cu;
    cl = v === 'L' ? cl+1 : 0;  if (cl > bl) bl = cl;
  });
  return [bw, bu, bl];
}

  var rounds = Object.keys(byGw).map(Number).sort(function(a,b){ return a-b; });
  if (!rounds.length){
    pad.appendChild(el('div','h2h-pad','No fixtures found in the H2H sheet.'));
    host.appendChild(pad);
    return;
  }
  h2hRound = rounds.length - 1;

  var nav = el('div','rnav');
  var prev = el('span','b','\u2039');
  var lab = el('span','lab','');
  var next = el('span','b','\u203A');
  nav.appendChild(prev); nav.appendChild(lab); nav.appendChild(next);
  pad.appendChild(nav);

  var grid = el('div','fxgrid');
  pad.appendChild(grid);
  host.appendChild(pad);

  function paint(){
    var gw = rounds[h2hRound];
    lab.textContent = 'GW' + gw;
    clear(grid);
    byGw[gw].forEach(function(f){
      grid.appendChild(scoreRow(f.home, f.hs, f.away, f.as, H2H_CY));
    });
  }
  prev.addEventListener('click', function(){ if (h2hRound > 0){ h2hRound--; paint(); } });
  next.addEventListener('click', function(){ if (h2hRound < rounds.length-1){ h2hRound++; paint(); } });
  paint();
}

/* ---- the record: every meeting between two managers ---- */
function buildRecord(host){
  clear(host);
  var pad = el('div','h2h-pad');
  var names = DATA.h2h.table.map(function(t){ return t.name; });

  var pick = el('div','rec-pick');
  function side(id, ring){
    var d = el('div','side');
    var av = el('div');
    av.style.cssText = 'width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid '
      + ring + ';display:flex;align-items:center;justify-content:center;margin:0 auto 8px;color:#fff;font-size:12px;font-weight:800;overflow:hidden';
    d.appendChild(av);
    var sel = document.createElement('select');
    sel.id = id;
    names.forEach(function(n){
      var o = document.createElement('option'); o.textContent = n; sel.appendChild(o);
    });
    d.appendChild(sel);
    d.avatar = av;
    return d;
  }
  var sA = side('recA', H2H_CY), sB = side('recB', H2H_PK);
  pick.appendChild(sA);
  pick.appendChild(el('div','rec-vs','VS'));
  pick.appendChild(sB);
  pad.appendChild(pick);

  var bar = el('div','rec-bar'); pad.appendChild(bar);
  var lbl = el('div','rec-lbl'); pad.appendChild(lbl);
  var stats = el('div','rec-stats'); pad.appendChild(stats);
  var mtHead = el('div', null, 'ALL MEETINGS');
  mtHead.style.cssText = 'font-size:8px;font-weight:900;letter-spacing:1.4px;color:' + H2H_CY + ';margin-bottom:8px';
  pad.appendChild(mtHead);
  var mts = el('div'); pad.appendChild(mts);
  host.appendChild(pad);

  sA.querySelector('select').value = names[0];
  sB.querySelector('select').value = names[1] || names[0];

  function avatar(host2, name){
    clear(host2);
    var im = imgTry(CONFIG.img.manager(name), function(){
      host2.textContent = name.substring(0,2);
    });
    im.style.cssText = 'width:100%;height:100%;object-fit:cover';
    host2.appendChild(im);
  }

  function paint(){
    var a = sA.querySelector('select').value, b = sB.querySelector('select').value;
    avatar(sA.avatar, a); avatar(sB.avatar, b);
    clear(bar); clear(lbl); clear(stats); clear(mts);

    if (a === b){
      var msg = el('div', null, 'Pick two different managers');
      msg.style.cssText = 'padding:24px;text-align:center;color:rgba(255,255,255,.4);font-size:12px';
      mts.appendChild(msg);
      return;
    }

    var ms = DATA.h2h.fixtures.filter(function(f){
      return (f.home === a && f.away === b) || (f.home === b && f.away === a);
    });

    var w=0,d=0,l=0,fa=0,fb=0,bigM=0,bigTxt='-';
    ms.forEach(function(f){
      var sa = f.home === a ? num(f.hs) : num(f.as);
      var sb = f.home === a ? num(f.as) : num(f.hs);
      fa += sa; fb += sb;
      if (sa > sb) w++; else if (sb > sa) l++; else d++;
      if (Math.abs(sa-sb) > bigM){ bigM = Math.abs(sa-sb); bigTxt = bigM + ' pts'; }
    });
    var tot = Math.max(1, w+d+l);

    [[w, H2H_CY], [d, '#FFFFFF'], [l, H2H_PK]].forEach(function(c){
      var seg = el('div', null, c[0] ? String(c[0]) : '');
      seg.style.width = (c[0]/tot*100) + '%';
      seg.style.background = c[1];
      bar.appendChild(seg);
    });
    lbl.appendChild(el('span', null, a.toUpperCase() + ' WINS'));
    lbl.appendChild(el('span', null, 'DRAWS'));
    lbl.appendChild(el('span', null, b.toUpperCase() + ' WINS'));

    var lead = w > l ? a : l > w ? b : 'Level';
    [[fa + '-' + fb, 'AGGREGATE POINTS', '#fff'], [lead, 'LEADS THE SERIES', H2H_CY], [bigTxt, 'BIGGEST MARGIN', H2H_PK]]
      .forEach(function(c){
        var d2 = el('div');
        var bb = el('b', null, String(c[0])); bb.style.color = c[2];
        d2.appendChild(bb); d2.appendChild(el('span', null, c[1]));
        stats.appendChild(d2);
      });

    if (!ms.length){
      var none = el('div', null, 'No meetings found');
      none.style.cssText = 'padding:18px;text-align:center;color:rgba(255,255,255,.4);font-size:12px';
      mts.appendChild(none);
      return;
    }

    ms.forEach(function(f, i){
      var sa = f.home === a ? f.hs : f.as;
      var sb = f.home === a ? f.as : f.hs;
      var row = el('div','rec-m');
      row.style.background = i % 2 ? '#16205F' : '#0F1749';
      var g = el('span', null, 'GW' + f.gw);
      g.style.cssText = 'width:40px;font-size:10px;font-weight:800;color:rgba(255,255,255,.5)';
      row.appendChild(g);
      var n1 = el('span', null, a.toUpperCase());
      n1.style.cssText = 'flex:1;text-align:right;font-size:12px;font-weight:' + (num(sa)>num(sb)?'800':'600')
        + ';color:' + (num(sa)>num(sb)?'#fff':'rgba(255,255,255,.6)');
      row.appendChild(n1);
      var v1 = el('span', null, String(sa));
      v1.style.cssText = 'min-width:26px;text-align:center;font-size:15px;font-weight:900;color:' + (num(sa)>num(sb)?H2H_CY:'rgba(255,255,255,.5)');
      row.appendChild(v1);
      var dash = el('span', null, '-'); dash.style.cssText = 'font-size:10px;color:rgba(255,255,255,.3)';
      row.appendChild(dash);
      var v2 = el('span', null, String(sb));
      v2.style.cssText = 'min-width:26px;text-align:center;font-size:15px;font-weight:900;color:' + (num(sb)>num(sa)?H2H_PK:'rgba(255,255,255,.5)');
      row.appendChild(v2);
      var n2 = el('span', null, b.toUpperCase());
      n2.style.cssText = 'flex:1;font-size:12px;font-weight:' + (num(sb)>num(sa)?'800':'600')
        + ';color:' + (num(sb)>num(sa)?'#fff':'rgba(255,255,255,.6)');
      row.appendChild(n2);
      mts.appendChild(row);
    });
  }

  sA.querySelector('select').addEventListener('change', paint);
  sB.querySelector('select').addEventListener('change', paint);
  paint();
}

/* ---- knockout ---- */
function buildKnockout(host){
  clear(host);
  var pad = el('div','h2h-pad');

  if (!DATA.h2hKO || !DATA.h2hKO.ties.length){
    var none = el('div', null, 'Knockout fixtures not yet available.');
    none.style.cssText = 'padding:26px;color:rgba(255,255,255,.45);font-size:12px;font-style:italic';
    pad.appendChild(none);
    host.appendChild(pad);
    return;
  }

  var groups = {};
  DATA.h2hKO.ties.forEach(function(t){
    var low = String(t.label).toLowerCase();
    var key = low.indexOf('semi') >= 0 || low.indexOf('sf') === 0 ? 'SEMI-FINALS - GW37' : 'FINAL - GW38';
    if (!groups[key]) groups[key] = [];
    groups[key].push(t);
  });

  ['SEMI-FINALS - GW37','FINAL - GW38'].forEach(function(k){
    if (!groups[k]) return;
    var h = el('div', null, k);
    h.style.cssText = 'font-size:9px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.9);margin:8px 0 9px';
    pad.appendChild(h);
    groups[k].forEach(function(t){
      var r = scoreRow(t.home, t.hs, t.away, t.as, H2H_CY);
      r.style.marginBottom = '9px';
      pad.appendChild(r);
    });
  });

  var win = winnerOf(DATA.h2hKO, DATA.h2h.table);
  if (win.name){
    var c = el('div','champ');
    var strip = el('div','strip');
    var s1 = el('span'); s1.style.cssText = 'flex:1;background:' + H2H_CY;
    var s2 = el('span'); s2.style.cssText = 'flex:1;background:' + H2H_PK;
    strip.appendChild(s1); strip.appendChild(s2);
    c.appendChild(strip);

    var p = el('div','panel');
    var av = el('div','av');
    var im = imgTry(CONFIG.img.manager(win.name), function(){
      av.textContent = win.name.substring(0,2);
    });
    av.appendChild(im);
    p.appendChild(av);

    var m = el('div'); m.style.flex = '1';
    m.appendChild(el('div','lbl','HEAD TO HEAD CHAMPION'));
    m.appendChild(el('div','nm', win.name.toUpperCase()));
    p.appendChild(m);

    var tro = el('div','tro');
    var tim = document.createElement('img');
    tim = imgTry(CONFIG.img.trophy('h2h'), null);
    tim.addEventListener('error', function(){
      if (tim.parentNode) tim.parentNode.removeChild(tim);
      tro.textContent = 'TROPHY';
    });
    tro.appendChild(tim);
    p.appendChild(tro);

    var right = el('div');
    right.style.textAlign = 'right';
    var note = el('div', null, win.note || '');
    note.style.cssText = 'font-size:11px;font-weight:800;letter-spacing:.6px;color:#5C646E';
    right.appendChild(note);
    p.appendChild(right);

    c.appendChild(p);
    pad.appendChild(c);
  }

  host.appendChild(pad);
}

var CUP_RED = '#D42A26', CUP_NAVY = '#0A1A5C';
var cupRound = 0;

function renderCup(){
  var host = document.getElementById('p-cup');
  if (loaded.cup) return;
  if (!DATA.cup || (!DATA.cup.a.length && !DATA.cup.b.length)){
    clear(host); host.appendChild(el('div','err','Could not load the cup groups sheet.')); return;
  }
  loaded.cup = true;
  clear(host);

  var wrap = el('div','cup');
  wrap.appendChild(el('div','cup-b1'));
  wrap.appendChild(el('div','cup-b2'));

  var nav = el('div','cup-nav');
  [['grp','Group Stage'],['fix','Fixtures'],['ko','Knockout']].forEach(function(v,i){
    var b = document.createElement('button');
    b.textContent = v[1]; b.setAttribute('data-v', v[0]);
    if (i===0) b.className = 'on';
    nav.appendChild(b);
  });
  wrap.appendChild(nav);

  var mast = el('div','cup-mast');

  mast.appendChild(slot);

    (LEAGUE.cupName || 'Cup').toUpperCase() + ' ' + CONFIG.season.replace('/','-')));

  mast.appendChild(mid);

function cupGroups(host){
  clear(host);

    var col = el('div');

    var panel = el('div','cup-panel');
    var head = el('div','cgh');
    [['',16],['',20],['TEAM','flex'],['W',13],['D',11],['L',11],['PD',26],['PTS',20]].forEach(function(c){
      var sp = el('span', null, c[0]);
      if (c[1]==='flex') sp.style.flex='1';
      else { sp.style.width = c[1]+'px'; sp.style.textAlign='right'; }
      if (c[0]==='TEAM') sp.style.textAlign='left';
      head.appendChild(sp);
    });
    panel.appendChild(head);
    g[1].forEach(function(t, i){
      var pos = i+1, q = pos <= 3;

      pw.appendChild(bar); pw.appendChild(el('b', null, String(pos)));

      var av = el('span','av'); av.appendChild(photo(t.name)); row.appendChild(av);
      row.appendChild(el('span','nm', t.name.toUpperCase()));
      [[t.w,13,'#2A2A2A',1],[t.d,11,'#8A8F96',0],[t.l,11,'#8A8F96',0]].forEach(function(c){
        var sp = el('span','n', String(c[0]));
        sp.style.width = c[1]+'px'; sp.style.color = c[2];
        if (c[3]) sp.style.fontWeight = '800';
        row.appendChild(sp);
      });

    sp.appendChild(i2); sp.appendChild(document.createTextNode(k[1]));
    key.appendChild(sp);
  });

function cupBar(home, hs, away, as){
  var played = hs !== '' && hs !== undefined && as !== '' && as !== undefined;
  var hw = played && num(hs) > num(as);
  var row = el('div','cup-bar');
  var n1 = el('span','nm', String(home).toUpperCase());
  n1.style.textAlign='right'; n1.style.color = hw||!played ? '#2A2A2A' : '#9AA0A7';
  row.appendChild(n1);
  var s1 = el('span','sc', played ? String(hs) : '');
  s1.style.color = hw ? '#2A2A2A' : '#9AA0A7';
  row.appendChild(s1);
  row.appendChild(el('span','v','V'));
  var s2 = el('span','sc', played ? String(as) : '');
  s2.style.color = !hw && played ? '#2A2A2A' : '#9AA0A7';
  row.appendChild(s2);
  var n2 = el('span','nm', String(away).toUpperCase());
  n2.style.color = !hw||!played ? '#2A2A2A' : '#9AA0A7';
  row.appendChild(n2);
  return row;
}

function cupFixtures(host){
  clear(host);
  var byGw = {};
  (DATA.cup.fixtures || []).forEach(function(f){
    if (!byGw[f.gw]) byGw[f.gw] = [];
    byGw[f.gw].push(f);
  });
  var rounds = Object.keys(byGw).map(Number).sort(function(a,b){ return a-b; });
  if (!rounds.length){
    var n2 = el('div', null, 'No cup fixtures found in the sheet.');
    n2.style.cssText = 'padding:26px;color:#fff;font-size:12px;font-style:italic';
    host.appendChild(n2); return;
  }
  cupRound = rounds.length - 1;

  var nav = el('div','rnav');
  var prev = el('span','b','\u2039'), lab = el('span','lab',''), next = el('span','b','\u203A');
  lab.style.color = '#fff';
  nav.appendChild(prev); nav.appendChild(lab); nav.appendChild(next);
  host.appendChild(nav);
  var box = el('div');
  host.appendChild(box);

  function paint(){
    var gw = rounds[cupRound];
    lab.textContent = 'GW' + gw;
    clear(box);
    byGw[gw].forEach(function(f){ box.appendChild(cupBar(f.home, f.hs, f.away, f.as)); });
  }
  prev.addEventListener('click', function(){ if (cupRound>0){ cupRound--; paint(); } });
  next.addEventListener('click', function(){ if (cupRound<rounds.length-1){ cupRound++; paint(); } });
  paint();
}

function cupKnockout(host){
  clear(host);
  if (!DATA.cupKO || !DATA.cupKO.ties.length){
    var n2 = el('div', null, 'Knockout fixtures not yet available.');
    n2.style.cssText = 'padding:26px;color:#fff;font-size:12px;font-style:italic';
    host.appendChild(n2); return;
  }
  var order = [['po','PLAY-OFF ROUND'],['sf','SEMI-FINALS'],['fin','FINAL']];
  var buckets = { po:[], sf:[], fin:[] };
  DATA.cupKO.ties.forEach(function(t){
    var low = String(t.label).toLowerCase();

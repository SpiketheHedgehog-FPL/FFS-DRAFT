      id: String(r[iId]), web: r[iWeb] || '', first: r[iFirst] || '', sec: r[iSec] || '',
      pos: r[iPos] || '', club: r[iClub] || '', pts: num(r[iPts]),
      goals: num(r[iG]), assists: num(r[iA]), cs: num(r[iCs]),
      code: iCode >= 0 ? (r[iCode] || '') : '',
      bonus: iBonus >= 0 ? num(r[iBonus]) : 0,
      team: iTeam >= 0 ? (r[iTeam] || '') : '', fee: iFee >= 0 ? num(r[iFee]) : 0,
      /* the Players table asks for g and a; the sheet calls them
         Goals and Assists. Two names for one number is how a column
         ends up permanently blank with nothing to show for it. */
      g: num(r[iG]), a: num(r[iA]),
      ppg: 0
    };
  });
}

/* Player Data - bonus points keyed on ID */
function parseBonus(rows){
  var map = {};
  if (!rows || rows.length < 2) return map;
  var h = rows[0], iId = h.indexOf('ID'), iB = h.indexOf('Bonus');
  if (iId < 0 || iB < 0) return map;
  rows.slice(1).forEach(function(r){ if (r[iId]) map[String(r[iId])] = num(r[iB]); });
  return map;
}

/* Query1 - id and name to FPL photo code */
function parsePhotoCodes(rows){
  var byId = {}, byName = {};
  if (!rows || rows.length < 2) return { byId: byId, byName: byName };
  var h = rows[0], iId = -1, iCode = -1, iWeb = -1, iSec = -1;
  h.forEach(function(v, k){
    var t = String(v);
    if (t.indexOf('.id') >= 0 && iId < 0) iId = k;
    if (t.indexOf('.code') >= 0 && iCode < 0) iCode = k;
    if (t.indexOf('web_name') >= 0) iWeb = k;
    if (t.indexOf('second_name') >= 0) iSec = k;
  });
  if (iId < 0 || iCode < 0) return { byId: byId, byName: byName };
  rows.slice(1).forEach(function(r){
    var id = r[iId], code = r[iCode];
    if (!id || !code) return;
    byId[String(id).trim()] = String(code).trim();
    if (iWeb >= 0 && r[iWeb]) byName[String(r[iWeb]).toLowerCase().trim()] = String(code).trim();
    if (iSec >= 0 && r[iSec]) byName[String(r[iSec]).toLowerCase().trim()] = String(code).trim();
  });
  return { byId: byId, byName: byName };
}

/* =====================================================================
   TELLING TWO MANAGERS APART

   The record bar puts one manager's colour against another's. Twenty
   two kits chosen independently means some of them collide - and one
   pair, Ben L and Tom W, is the same hex exactly, because they picked
   the same City shirt.

   Distance is measured in Lab rather than on the hex digits, because
   hex arithmetic does not match what an eye does: two colours can be
   numerically far apart and look identical, and the reverse.

   The manager whose page you are on always keeps their own Main. The
   opponent tries Main, then Second, then Text, and takes the first
   that is far enough away. Across all 462 orderings that resolves
   every pair - 424 keep their Main, 31 fall back to Second, 7 to
   Text - so there is no need for a list of exceptions, and it will
   cope with next season's kits without anyone remembering why.
   ===================================================================== */

var KIT_CLASH_LIMIT = 25;

function labOf(hex){
  var h = String(hex || '').replace('#','');
  if (h.length !== 6) return [0,0,0];
  var v = [0,2,4].map(function(i){
    var c = parseInt(h.substr(i,2),16)/255;
    return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  });
  var X = v[0]*0.4124 + v[1]*0.3576 + v[2]*0.1805;
  var Y = v[0]*0.2126 + v[1]*0.7152 + v[2]*0.0722;
  var Z = v[0]*0.0193 + v[1]*0.1192 + v[2]*0.9505;
  function k(t){ return t > 0.008856 ? Math.pow(t, 1/3) : 7.787*t + 16/116; }
  var fx = k(X/0.95047), fy = k(Y/1.0), fz = k(Z/1.08883);
  return [116*fy - 16, 500*(fx - fy), 200*(fy - fz)];
}

function colourGap(a, b){
  var x = labOf(a), y = labOf(b);
  return Math.sqrt(Math.pow(x[0]-y[0],2) + Math.pow(x[1]-y[1],2) + Math.pow(x[2]-y[2],2));
}

/* What the opponent should be shown in, against a given manager.
   Returns { bg, fg, using } where using is main, second or text.  */
function opponentColour(mineName, theirName){
  var mine = kitFor(mineName), them = kitFor(theirName);

  var tries = [
    { bg: them.main,   fg: them.text,   using: 'main'   },
    { bg: them.second, fg: them.fourth, using: 'second' },
    { bg: them.text,   fg: them.main,   using: 'text'   }
  ];

  for (var i = 0; i < tries.length; i++){
    if (colourGap(mine.main, tries[i].bg) >= KIT_CLASH_LIMIT) return tries[i];
  }
  /* nothing separated - the last option is still the least bad */
  return tries[tries.length - 1];
}


/* =====================================================================
   ONE MANAGER'S SEASON
   Every fixture they appear in, across every competition, with the
   score attached where both sides have played.
   ===================================================================== */

function managerFixtures(name){
  var fx = DATA.fixtures || [];
  var sc = DATA.scores || {};
  var out = [];

  fx.forEach(function(f){
    var home = f.home === name, away = f.away === name;
    if (!home && !away) return;

    var opp = home ? f.away : f.home;
    /* a placeholder like "Winner of Apertura M4" is not a manager */
    var real = !!(sc[opp] || (DATA.kits && DATA.kits[opp]) || CONFIG.managers[opp]);

    var mine = sc[name] && sc[name][f.gw];
    var theirs = sc[opp] && sc[opp][f.gw];
    var played = mine !== undefined && mine !== '' && theirs !== undefined && theirs !== '';

    out.push({
      comp: f.comp, stage: f.stage, gw: f.gw, note: f.note,
      opp: opp, oppReal: real, home: home,
      mine: played ? num(mine) : null,
      theirs: played ? num(theirs) : null,
      played: played,
      result: played ? (num(mine) > num(theirs) ? 'W' : num(mine) < num(theirs) ? 'L' : 'D') : ''
    });
  });

  out.sort(function(a,b){ return a.gw - b.gw || String(a.comp).localeCompare(String(b.comp)); });
  return out;
}

/* The combined head to head against every opponent, whichever
   competition the meetings happened in. */
function managerRecord(name){
  var by = {};
  managerFixtures(name).forEach(function(f){
    if (!f.played || !f.oppReal) return;
    if (!by[f.opp]) by[f.opp] = { opp:f.opp, p:0, w:0, d:0, l:0, f:0, a:0, fx:[] };
    var r = by[f.opp];
    r.p++; r.f += f.mine; r.a += f.theirs;
    if (f.result === 'W') r.w++; else if (f.result === 'L') r.l++; else r.d++;
    r.fx.push(f);
  });
  return Object.keys(by).map(function(k){ return by[k]; })
    .sort(function(a,b){ return b.p - a.p || String(a.opp).localeCompare(String(b.opp)); });
}

/* Where a manager stands in a named competition.

   This used to take the competition and then search every table in
   order, returning whichever matched first - so a SuperLiga block
   showed a Head to Head position, and looked entirely plausible while
   doing it. The competition now actually selects the table.        */
function positionIn(comp, name){
  var c = String(comp || '');

  function find(tab){
    if (!tab) return null;
    for (var i = 0; i < tab.length; i++){
      if (tab[i].name === name) return { pos: tab[i].pos || (i + 1), w: tab[i].w || 0,
        d: tab[i].d || 0, l: tab[i].l || 0, name: name };
    }
    return null;
  }
  function inGroups(g){
    if (!g) return null;
    if (g.table){ var t = find(g.table); if (t) return t; }
    var hit = null;
    Object.keys(g.groups || {}).forEach(function(k){
      if (hit) return;
      var f = find(g.groups[k]);
      if (f) { f.group = k; hit = f; }
    });
    if (hit) return hit;
    return find(g.a) || find(g.b);
  }

  if (c.indexOf('H2H') >= 0 || c.indexOf('Head to Head') >= 0)
    return DATA.h2h ? find(DATA.h2h.table) : null;
  if (c.indexOf('Cup') >= 0 && c.indexOf('Copa') < 0)
    return DATA.cup ? inGroups(DATA.cup) : null;
  if (c.indexOf('SuperLiga') >= 0)
    return inGroups(DATA.superliga);
  if (c.indexOf('Apertura') >= 0)
    return inGroups(DATA.apertura);
  if (c.indexOf('Clausura') >= 0)
    return inGroups(DATA.clausura);

  return null;
}

/* =====================================================================
   PLAYER PHOTOS
   One place that decides which face belongs to which player, so no
   page has to work it out for itself.

   THE BUG THIS EXISTS TO KILL
   A player's photo is keyed on their FPL "code", which is a permanent
   six-digit number, and NOT on their element id. The two are easy to
   confuse and both are numbers, so using the wrong one gives you a
   perfectly valid photo of completely the wrong player.

   Worse was the old fallback: if the id missed, it looked the player
   up by name, and then by the LAST WORD of their name. Premier League
   squads are full of shared surnames - the Silvas, the Sanchezes, the
   Gomeses - so whichever one happened to be read last silently won,
   and the other wore his face all season.

   So the rules here are:

     1. The element id is the only key trusted outright.
     2. A name is used only if it belongs to exactly ONE player in the
        pool. Any name shared by two or more is thrown away entirely.
     3. No photo is better than the wrong photo. A player we cannot
        resolve with confidence gets their initials.

   Rule 3 is the whole point. A missing face reads as missing data. A
   wrong face reads as a working site that is quietly lying.
   ===================================================================== */

var PlayerPhotos = (function(){

  var byId = {};          /* element id  -> code   the trusted key   */
  var byName = {};        /* unique name -> code   only if unshared  */
  var dropped = {};       /* names thrown away, and how many shared  */
  var built = false;

  /* THE PATH MATTERS AS MUCH AS THE CODE

     Current:  .../premierleague25/photos/players/110x140/154561.png
     Old:      .../premierleague/photos/players/110x140/p154561.png

     Two differences, and both bite. The asset set is versioned -
     premierleague25 - and the current one has NO "p" in front of the
     code. The old path has not been taken down: it still answers for
     plenty of players, just with photographs from an earlier season.

     That is worse than a 404. A dead link shows initials and you know
     something is wrong. A stale link shows a real face, of the right
     player, three seasons ago, and looks like it is working.

     So the current path is tried first and the old one is kept only as
     a last resort, for anyone the new set has not got.

     When the asset set rolls over - premierleague26 and so on - change
     SET below and nothing else needs touching.                       */
  var HOST  = 'https://resources.premierleague.com/';

  /* The asset set is versioned and rolls over between seasons. Rather
     than hard-coding a guess, both are tried and the first that
     answers is used for everything afterwards.

     A single probe image decides it, once, at load. Guessing wrong
     without the probe would mean either a season of stale faces or,
     if the new set is not live yet, no faces at all - and neither
     failure announces itself.                                       */
  var SETS   = ['premierleague26', 'premierleague25'];
  var SIZES  = ['110x140', '250x250'];
  var PROBE  = '154561';          /* David Raya - known to exist */
  var active = null;              /* set once the probe answers   */

  /* Ask for one image from the newer set. If it loads, everything
     uses it; if not, fall back to the older one. Costs one request. */
  function probe(){
    if (active) return;
    var i = 0;
    var im = new Image();
    im.onload  = function(){ active = SETS[i]; };
    im.onerror = function(){
      i++;
      if (i < SETS.length) { im.src = probeUrl(SETS[i]); return; }
      active = SETS[SETS.length - 1];
    };
    im.src = probeUrl(SETS[0]);
  }

  function probeUrl(set){
    return HOST + set + '/photos/players/' + SIZES[0] + '/' + PROBE + '.png';
  }

  /* The sets in the order worth trying: whichever the probe found
     first, then the other, so a photo still appears even if the probe
     has not come back yet.                                          */
  function setOrder(){
    if (!active) return SETS;
    return [active].concat(SETS.filter(function(x){ return x !== active; }));
  }

  function reset(){
    byId = {}; byName = {}; dropped = {}; built = false;
  }

  /* Build the indexes from the Transfer Player List, which carries an
     ID column and a Code column for all 587.                        */
  function build(players){
    reset();
    probe();
    if (!players || !players.length) return;

    var nameCount = {};

    players.forEach(function(p){
      var code = clean(p.code);
      var id   = clean(p.id);
      if (!code) return;

      if (id) byId[id] = code;

      /* count every name form before trusting any of them */
      names(p).forEach(function(n){
        if (!nameCount[n]) nameCount[n] = {};
        nameCount[n][code] = true;
      });
    });

    /* a name is only usable if every player answering to it is the
       same player */
    Object.keys(nameCount).forEach(function(n){
      var codes = Object.keys(nameCount[n]);
      if (codes.length === 1) byName[n] = codes[0];
      else dropped[n] = codes.length;
    });

    built = true;
  }

  function clean(v){
    var t = String(v == null ? '' : v).trim();
    return /^\d+$/.test(t) ? t : '';
  }

  function key(v){
    return String(v == null ? '' : v).toLowerCase().trim().replace(/\s+/g,' ');
  }

  /* The forms a player might be referred to by elsewhere on the site.
     Deliberately does NOT include the surname on its own - that is
     the form that collides, and the counting above would drop most of
     them anyway, but there is no reason to invite it.               */
  function names(p){
    var out = [];
    if (p.web) out.push(key(p.web));
    if (p.first && p.sec) out.push(key(p.first + ' ' + p.sec));
    if (p.name) out.push(key(p.name));
    return out.filter(function(n){ return n.length > 1; });
  }

  /* The code for a player, or '' if we are not sure.                */
  function codeFor(id, name){
    if (!built) return '';

    var byid = byId[clean(id)];
    if (byid) return byid;

    var n = key(name);
    if (n && byName[n]) return byName[n];

    return '';
  }

  function urls(code){
    var out = [];
    setOrder().forEach(function(set){
      SIZES.forEach(function(sz){
        out.push(HOST + set + '/photos/players/' + sz + '/' + code + '.png');
      });
    });
    /* last resort only - see the note above about stale faces */
    out.push(HOST + 'premierleague/photos/players/110x140/p' + code + '.png');
    return out;
  }

  /* An <img> that walks the sizes, then gives up quietly.           */
  function imgFor(code, onGone){
    var list = urls(code);
    var im = document.createElement('img');
    var i = 0, done = false;
    im.alt = '';
    im.addEventListener('error', function(){
      if (done) return;
      i++;
      if (i < list.length) { im.src = list[i]; return; }
      done = true;
      if (im.parentNode) im.parentNode.removeChild(im);
      if (onGone) onGone();
    });
    im.src = list[0];
    return im;
  }

  /* The one thing pages call. */
  function element(id, name, size){
    var wrap = el('span','ph');
    if (size){ wrap.style.width = size + 'px'; wrap.style.height = size + 'px'; }

    var code = codeFor(id, name);
    if (!code){ wrap.textContent = initials(name); return wrap; }

    wrap.appendChild(imgFor(code, function(){ wrap.textContent = initials(name); }));
    return wrap;
  }

  function initials(name){
    var n = String(name || '?').trim();
    return n.substring(0,2).toUpperCase();
  }

  /* Say plainly how well this is working, rather than leaving it to
     be judged by squinting at a page.                               */
  function report(players){
    var total = (players || []).length;
    var withCode = 0, resolvable = 0, unresolved = [];

    (players || []).forEach(function(p){
      if (clean(p.code)) withCode++;
      if (codeFor(p.id, p.web)) resolvable++;
      else unresolved.push(p.web || p.name || p.id);
    });

    var shared = Object.keys(dropped);

    return {
      players: total,
      withCode: withCode,
      resolvable: resolvable,
      byIdEntries: Object.keys(byId).length,
      byNameEntries: Object.keys(byName).length,
      sharedNamesDropped: shared.length,
      sharedNames: shared.slice(0, 20),
      unresolved: unresolved.slice(0, 20)
    };
  }

  return {
    build: build,
    codeFor: codeFor,
    urls: urls,
    element: element,
    report: report,
    _sets: SETS,
    _active: function(){ return active; },
    _sizes: SIZES
  };
})();

/* Kept so the pages did not all need rewriting. */
function playerPhoto(id, nm, size){ return PlayerPhotos.element(id, nm, size); }
function playerPhotoUrl(id, nm){
  var code = PlayerPhotos.codeFor(id, nm);
  return code ? PlayerPhotos.urls(code)[0] : null;
}

/* Type photoCheck() in the browser console to see how many of the 587
   resolve, and which names were thrown away for being shared.      */
function photoCheck(){
  var r = PlayerPhotos.report(DATA.players);
  console.log('player photos');
  console.log('  players in the pool     ', r.players);
  console.log('  with a code in the sheet', r.withCode);
  console.log('  resolvable to a photo   ', r.resolvable);
  console.log('  indexed by element id   ', r.byIdEntries);
  console.log('  indexed by unique name  ', r.byNameEntries);
  console.log('  names dropped as shared ', r.sharedNamesDropped, r.sharedNames);
  if (r.unresolved.length) console.log('  unresolved              ', r.unresolved);
  return r;
}

/* KO sheets - generic: label, home, hs, as, away */
/* USER Kits: 0 Manager | 1 League | 2 Main | 3 Second | 4 Text | 5 4th | 6 Kit

   Main, Second and Text are the manager's identity - the shirt they
   picked. The 4th is functional: it is what gets written on Second,
   and it exists because white on a pale Second is unreadable, which
   is what broke last season.

   Anything unreadable falls back rather than coming through blank, so
   nothing downstream has to guard against an empty colour.          */
/* Squads L1 / L2. Two blocks:

     SUMMARY  Manager | Name | Players | Spent | Remaining | Squad Points
              | Points in XI | Best Player | Source
     SQUADS   Manager | Player | Pos | Club | Fee | Starts | Points in XI
              | Points Total | PPG in XI | Status

   Read by finding the two markers rather than by counting rows, so an
   extra blank line in the sheet cannot shift everything by one.     */
function parseSquads(rows){
  if (!rows || !rows.length) return null;

  var mode = '', summary = [], players = [];

  for (var i = 0; i < rows.length; i++){
    var r = rows[i];
    var first = String(r[0] || '').trim();

    if (first === 'SUMMARY') { mode = 'S'; continue; }
    if (first === 'SQUADS')  { mode = 'P'; continue; }
    if (!first || first === 'Manager') continue;

    if (mode === 'S'){
      summary.push({
        name:      first,
        real:      String(r[1] || '').trim(),
        count:     num(r[2]),
        spent:     r[3] === '' ? null : num(r[3]),
        remaining: r[4] === '' ? null : num(r[4]),
        squadPts:  num(r[5]),
        xiPts:     num(r[6]),
        best:      String(r[7] || '').trim(),
        source:    String(r[8] || '').trim()
      });
    } else if (mode === 'P'){
      players.push({
        manager:  first,
        name:     String(r[1] || '').trim(),
        pos:      String(r[2] || '').trim(),
        club:     String(r[3] || '').trim(),
        fee:      r[4] === '' ? null : num(r[4]),
        starts:   num(r[5]),
        xiPts:    num(r[6]),
        totalPts: num(r[7]),
        ppg:      num(r[8]),
        status:   String(r[9] || '').trim(),
        /* per gameweek, for the form boxes and the season strip.
           Blank means not owned that week, which is not the same as
           a zero, so they are kept apart all the way through. */
        gwPts:    String(r[10] === undefined ? '' : r[10]).split(','),
        gwXI:     String(r[11] === undefined ? '' : r[11])
      });
    }
  }

  if (!summary.length && !players.length) return null;

  var byManager = {};
  summary.forEach(function(m){ byManager[m.name] = { summary: m, players: [] }; });
  players.forEach(function(p){
    if (!byManager[p.manager]) byManager[p.manager] = { summary: null, players: [] };
    byManager[p.manager].players.push(p);
  });

  return { summary: summary, players: players, byManager: byManager };
}

/* USER_CHAMPIONS:  Season | Teams | League | League points | Head to Head | Cup | ...
   One row per season with a column per competition. Columns are read
   from the header rather than assumed by position, so adding SuperLiga
   and Supercopa columns needs no code change here.                  */
function parseChampions(rows){
  if (!rows || rows.length < 2) return [];
  var head = rows[0].map(function(h){ return String(h || '').trim(); });
  var cols = head.slice(1).filter(function(h){
    return h && h.toLowerCase() !== 'teams' && h.toLowerCase().indexOf('points') < 0;
  });

  var out = [];
  rows.slice(1).forEach(function(r){
    var season = String(r[0] || '').trim();
    if (!season) return;
    var by = {};
    head.forEach(function(h, i){
      if (!h || i === 0) return;
      var v = String(r[i] === undefined ? '' : r[i]).trim();
      if (v) by[h] = v;
    });
    out.push({ season: season, by: by, cols: cols });
  });
  out.sort(function(a,b){ return a.season < b.season ? 1 : a.season > b.season ? -1 : 0; });
  return out;
}

/* USER_HISTORIC_SEASONS: Competition | Season | a column per manager
   holding their finish. "Did not enter" is dropped rather than shown
   as a placing.                                                     */
function parseHistoric(rows){
  if (!rows || rows.length < 2) return [];
  var head = rows[0].map(function(h){ return String(h || '').trim(); });
  var managers = head.slice(2).filter(Boolean);

  var out = [];
  rows.slice(1).forEach(function(r){
    var comp = String(r[0] || '').trim();
    var season = String(r[1] || '').trim();
    if (!comp || !season) return;
    var by = {};
    managers.forEach(function(m, i){
      var v = String(r[i + 2] === undefined ? '' : r[i + 2]).trim();
      if (v && v.toLowerCase() !== 'did not enter') by[m] = v;
    });
    out.push({ comp: comp, season: season, by: by, managers: managers });
  });
  return out;
}

/* USER_MOTM: Season | Team, newest first, "None" where a month held no
   gameweeks. Anything that is not a real name is dropped.           */
function parseMotm(rows){
  if (!rows || rows.length < 2) return [];
  var out = [];
  rows.slice(1).forEach(function(r){
    var month = String(r[0] || '').trim();
    var who = String(r[1] || '').trim();
    if (!/^\d{4}-\d{2}$/.test(month)) return;
    if (!who || who.toLowerCase() === 'none') return;
    out.push({ month: month, name: who });
  });
  out.sort(function(a,b){ return a.month < b.month ? 1 : a.month > b.month ? -1 : 0; });
  return out;
}

/* USER_TEXT: your wording, with the shipped line as the fallback. */
function parseText(rows){
  if (!rows || !rows.length) return null;
  var out = { text: {}, notices: [] }, mode = '';
  rows.forEach(function(r){
    var first = String(r[0] || '').trim();
    if (first === 'TEXT'){ mode = 'T'; return; }
    if (first === 'NOTICES'){ mode = 'N'; return; }
    if (!first || first === 'Key' || first === 'Active') return;

    if (mode === 'T'){
      var mine = String(r[1] || '').trim();
      if (mine) out.text[first] = mine;
    } else if (mode === 'N'){
      var on = first.toLowerCase();
      out.notices.push({
        on: on === 'yes' || on === 'y' || on === 'true' || on === '1',
        msg: String(r[1] || '').trim(),
        style: String(r[2] || 'info').trim().toLowerCase(),
        from: String(r[3] || '').trim(),
        until: String(r[4] || '').trim()
      });
    }
  });
  return out;
}

/* One line of wording. Yours if you have written one, otherwise the
   fallback given at the call site - so the site never depends on the
   sheet being reachable. */
function txt(key, fallback){
  var t = DATA.text && DATA.text.text;
  return (t && t[key]) || fallback || '';
}

/* Squad Register: timestamp | league_key | action | element_id
   | player | manager | fee | note

   The transaction log the draft tool writes. The portal reads it for
   the ticker, the done-deal panel and the feed, so those show what
   actually happened rather than anything worked out afterwards.    */
function parseRegister(rows){
  if (!rows || rows.length < 2) return [];
  var out = [];
  rows.slice(1).forEach(function(r){
    var action = String(r[2] || '').trim().toUpperCase();
    var player = String(r[4] || '').trim();
    if (!action || !player) return;
    out.push({
      ts: r[0], leagueKey: String(r[1] || '').trim(), action: action,
      elementId: String(r[3] || '').trim(), player: player,
      manager: String(r[5] || '').trim(), fee: num(r[6]),
      note: String(r[7] || '').trim()
    });
  });
  return out;
}

/* Club colours, read from USER Kits where the sheet has them and
   falling back to the built-in list. Same bargain as the manager
   kits - a colour and its ink, never just a colour. */
var CLUB_COLOURS = {
  ARS:['#EF0107','#FFFFFF'], AVL:['#95BFE5','#670E36'], BOU:['#DA291C','#FFFFFF'],
  BRE:['#E30613','#FFFFFF'], BHA:['#0057B8','#FFFFFF'], BUR:['#6C1D45','#99D6EA'],
  CHE:['#034694','#FFFFFF'], CRY:['#1B458F','#FFFFFF'], EVE:['#003399','#FFFFFF'],
  FUL:['#FFFFFF','#000000'], IPS:['#3A64A3','#FFFFFF'], LEE:['#FFCD00','#1D428A'],
  LEI:['#003090','#FDBE11'], LIV:['#C8102E','#FFFFFF'], MCI:['#6CABDD','#1C2C5B'],
  MUN:['#DA291C','#FFFFFF'], NEW:['#241F20','#FFFFFF'], NFO:['#DD0000','#FFFFFF'],
  SOU:['#D71920','#FFFFFF'], SUN:['#EB172B','#FFFFFF'], TOT:['#FFFFFF','#132257'],
  WHU:['#7A263A','#1BB1E7'], WOL:['#FDB913','#231F20']
};
var CLUB_FALLBACK = ['#5A6570','#FFFFFF'];

/* The long name for a code, so the card reads the same whichever
   season it is showing - the raw sheet gives ARS, the archive gives
   Arsenal, and neither should decide how it looks. */
var CLUB_LONG = {
  ARS:'Arsenal', AVL:'Aston Villa', BOU:'Bournemouth', BRE:'Brentford',
  BHA:'Brighton', BUR:'Burnley', CHE:'Chelsea', CRY:'Crystal Palace',
  EVE:'Everton', FUL:'Fulham', IPS:'Ipswich', LEE:'Leeds', LEI:'Leicester',
  LIV:'Liverpool', MCI:'Man City', MUN:'Man Utd', NEW:'Newcastle',
  NFO:'Nott\u2019m Forest', SOU:'Southampton', SUN:'Sunderland',
  TOT:'Tottenham', WHU:'West Ham', WOL:'Wolves'
};

function clubLabel(v){
  var c = clubCode(v);
  return CLUB_LONG[c] || String(v || '');
}

/* Full club names to the three letter codes the colours are keyed on.

   RAW_Players writes short codes because that is what the API sends;
   the archive sheet holds full names. So last season every club
   missed the lookup and came back grey, and the card showed the right
   player in nobody's colours.

   Matched on letters and digits only, so "Nott'm Forest",
   "Nottingham Forest" and "nottm forest" all land.                  */
var CLUB_NAMES = {
  arsenal:'ARS', astonvilla:'AVL', bournemouth:'BOU', afcbournemouth:'BOU',
  brentford:'BRE', brighton:'BHA', brightonhovealbion:'BHA', burnley:'BUR',
  chelsea:'CHE', crystalpalace:'CRY', everton:'EVE', fulham:'FUL',
  ipswich:'IPS', ipswichtown:'IPS', leeds:'LEE', leedsunited:'LEE',
  leicester:'LEI', leicestercity:'LEI', liverpool:'LIV',
  mancity:'MCI', manchestercity:'MCI', manutd:'MUN', manunited:'MUN',
  manchesterunited:'MUN', newcastle:'NEW', newcastleunited:'NEW',
  nottmforest:'NFO', nottinghamforest:'NFO', forest:'NFO',
  southampton:'SOU', sunderland:'SUN', spurs:'TOT', tottenham:'TOT',
  tottenhamhotspur:'TOT', westham:'WHU', westhamunited:'WHU',
  wolves:'WOL', wolverhampton:'WOL', wolverhamptonwanderers:'WOL'
};

/* A club code from whatever the sheet happens to say. */
function clubCode(v){
  var raw = String(v || '').trim();
  if (!raw) return '';
  var up = raw.toUpperCase();
  if (up.length <= 4 && (CLUB_COLOURS[up] || !/\s/.test(raw))) return up;
  var key = raw.toLowerCase().replace(/[^a-z0-9]/g, '');
  return CLUB_NAMES[key] || up;
}

function clubColour(code){
  var k = clubCode(code);
  var sheet = DATA.clubs && DATA.clubs[k];
  if (sheet) return sheet;
  var c = CLUB_COLOURS[k] || CLUB_FALLBACK;
  return { colour: c[0], ink: c[1] };
}

/* The club rows sit on USER Kits below the managers - a short code in
   the first column and two colours. */
/* A full stats sheet, read by header name rather than position.

   Used for both RAW_Players and the archive tabs, which carry the
   same information under different spellings - snake_case from the
   API, Title Case in the archive. Reading by name means one parser
   serves both, and a column added next season shifts nothing.     */
/* GKP and GK are the same position under two spellings. */
function normPos_(v){
  var t = String(v || '').toUpperCase().trim();
  return t === 'GKP' ? 'GK' : t;
}

function parsePlayerStats(rows){
  if (!rows || rows.length < 2) return null;
  var head = rows[0].map(function(h){ return String(h || '').trim().toLowerCase(); });
  var idx = {};
  head.forEach(function(h, i){ if (h) idx[h] = i; });

  var byId = {}, byCode = {}, byName = {}, ambiguous = {};
  rows.slice(1).forEach(function(r){
    function g(name){
      var i = idx[name];
      return i === undefined ? '' : r[i];
    }
    var id = String(g('id') || '').trim();
    /* the API says web_name, the archive says Web Name */
    var web = String(g('web name') || g('web_name') || '').trim();
    if (!id && !web) return;

    var code = String(g('code') || '').trim();

    var rec = { id: id, code: code, web: web,
      pos: normPos_(g('position') || g('element_type') || ''),
      club: String(g('club') || '').trim(), get: g };
    if (id) byId[id] = rec;
    if (code) byCode[code] = rec;
    var k = web.toLowerCase();
    if (k){
      if (byName[k] && byName[k].id !== id) ambiguous[k] = true;
      else byName[k] = rec;
    }
  });

  Object.keys(ambiguous).forEach(function(k){ delete byName[k]; });
  return { byId: byId, byCode: byCode, byName: byName, cols: idx };
}

function parseClubs(rows){
  if (!rows || !rows.length) return null;
  var out = {};
  rows.forEach(function(r){
    var c = String(r[0] || '').trim().toUpperCase();
    if (!c || c.length > 4) return;
    var col = hex(r[1]), ink = hex(r[2]);
    if (col) out[c] = { colour: col, ink: ink || CLUB_FALLBACK[1] };
  });
  return Object.keys(out).length ? out : null;
}

function parseKits(rows){
  if (!rows || !rows.length) return null;
  var out = {};
  for (var i = 1; i < rows.length; i++){
    var r = rows[i];
    var name = String(r[0] || '').trim();
    if (!name) continue;
    out[name] = {
      main:   hex(r[2]) || KIT_FALLBACK.main,
      second: hex(r[3]) || KIT_FALLBACK.second,
      text:   hex(r[4]) || KIT_FALLBACK.text,
      fourth: hex(r[5]) || KIT_FALLBACK.fourth,
      kit:    String(r[6] || '').trim()
    };
  }
  return Object.keys(out).length ? out : null;
}

var KIT_FALLBACK = { main:'#3A3A3A', second:'#EFEFEF', text:'#FFFFFF', fourth:'#111111' };

function hex(v){
  var t = String(v == null ? '' : v).trim().replace(/^#/,'').toUpperCase();
  if (/^[0-9A-F]{3}$/.test(t)) t = t[0]+t[0]+t[1]+t[1]+t[2]+t[2];
  return /^[0-9A-F]{6}$/.test(t) ? '#' + t : '';
}

/* One manager's colours. The sheet wins; CONFIG.managers is only what
   the site falls back to if the sheet cannot be read at all.

   `body`, `accent` and `type` are the names the older pages use, and
   are kept as aliases so nothing had to be rewritten to take the new
   colours.                                                          */
function kitFor(name){
  var k = (DATA.kits && DATA.kits[name]) || CONFIG.managers[name] || KIT_FALLBACK;
  return {
    main:   k.main   || k.body   || KIT_FALLBACK.main,
    second: k.second || k.accent || KIT_FALLBACK.second,
    text:   k.text   || k.type   || KIT_FALLBACK.text,
    fourth: k.fourth || KIT_FALLBACK.fourth,
    kit:    k.kit || '',
    /* aliases for the pages written before the kits sheet existed */
    body:   k.main   || k.body   || KIT_FALLBACK.main,
    accent: k.second || k.accent || KIT_FALLBACK.second,
    type:   k.text   || k.type   || KIT_FALLBACK.text
  };
}

function parseKO(rows){
  var out = [], champion = '';
  rows.forEach(function(r){
    var f0 = r[0] ? String(r[0]).trim() : '';
    if (!f0) return;
    var low = f0.toLowerCase();
    if (low.indexOf('champion') >= 0) { champion = r[1] ? String(r[1]).trim() : ''; return; }
    if (!r[1] || !r[4]) return;
    out.push({ label:f0, home:String(r[1]).trim(), hs:r[2], as:r[3], away:String(r[4]).trim() });
  });
  return { ties: out, champion: champion };
}

/* H2H form grid: row0 = Team | GW1 | GW2 ... ; rows = team name + W/D/L */
function parseH2HForm(rows){
  if (!rows || rows.length < 2) return { gws: [], byName: {} };
  var gws = rows[0].slice(1).map(function(s){ return String(s).trim(); }).filter(Boolean);
  var byName = {};
  rows.slice(1).forEach(function(r){
    var nm = r[0] ? String(r[0]).trim() : '';
    if (!nm || nm === 'Team' || nm.indexOf('GW') === 0) return;
    var vals = [];
    for (var i = 1; i <= gws.length; i++){
      vals.push(r[i] ? String(r[i]).trim() : '');
    }
    byName[nm] = vals;
  });
  return { gws: gws, byName: byName };
}

  var out = CONFIG.leagues[0];

/* Point the shared DATA.table / DATA.gw at one league. Everything that
   already existed reads those two, so switching league is a matter of
   repointing them rather than reworking every render function.      */
function useLeague(key){
  LEAGUE = leagueByKey(key);
  var d = DATA.byLeague[key] || {};

  DATA.table   = d.table   || null;
  DATA.gw      = d.gw      || null;
  DATA.squads  = d.squads  || null;
  DATA.h2h     = d.h2h     || null;
  DATA.h2hKO   = d.h2hKO   || null;
  DATA.h2hForm = d.h2hForm || null;
  DATA.cup     = d.cup     || null;
  DATA.cupKO   = d.cupKO   || null;

  /* Every one of those pages is drawn from league data, so a page
     already drawn for the other league is now wrong. Marking them
     unloaded makes each redraw the next time it is opened, and the
     one on screen is redrawn straight away.

     Without this, switching league left whichever page you were on
     showing the previous league's numbers under the new league's
     name - wrong, and wrong in a way that looks fine.               */
  loaded.league = false;
  loaded.h2h    = false;
  loaded.cup    = false;
  loaded.managers = false;

  sqTeam = null;

  if (typeof route !== 'undefined' && bootDone) {
    buildNav();
    buildNotices();
    buildLeagueBar();
    redrawCurrent();
  }
}

var bootDone = false;

/* Redraw whichever page is showing, without touching the others. */
function redrawCurrent(){
  if (route === 'league')      renderLeague();
  else if (route === 'h2h')    renderH2H();
  else if (route === 'cup')    renderCup();
  else if (route === 'managers') { MGR.name = null; RECORD_OPEN = null; renderManagers(); }

}

function go(key){
  if (key !== 'portal') liveStop();
  route = key;
  buildNav();
  var known = ['home','league','h2h','cup','sliga','super','managers','players',
               'portal','honours'].indexOf(key) >= 0;

  else if (key === 'players'){ document.getElementById('p-players').classList.add('on'); renderPlayers(); }

  }
  else if (key === 'sliga'){ document.getElementById('p-sliga').classList.add('on'); renderSuperLiga(); }
  else if (key === 'super'){ document.getElementById('p-super').classList.add('on'); renderSupercopa(); }

    box.style.margin = '28px 24px';

    s.appendChild(box);

}

document.getElementById('nav').addEventListener('click', function(e){

/* =====================================================================
   BOOT - load core sheets then render
   ===================================================================== */
function boot(){
  /* Every competition sheet beyond the league tables is still to be
     built. fetchSheet rejects for a gid that is not set, the catch
     turns that into null, and each page already handles null by
     showing its own "not yet available" state. So this loads what
     exists today and grows as sheets appear.                        */
  var jobs = [];

  CONFIG.leagues.forEach(function(lg){
    jobs.push(
      fetchSheet(lg,'leagueTable').then(parseLeagueTable).catch(function(){ return null; })
        .then(function(t){
          if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
          DATA.byLeague[lg.key].table = t;
        })
    );
    jobs.push(
      fetchSheet(lg,'gwScores').then(parseGwScores).catch(function(){ return null; })
        .then(function(g){
          if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
          DATA.byLeague[lg.key].gw = g;
        })
    );
  });

  /* colours first - every page reads them, and a page that renders
     before they arrive would show the fallback greys and then flicker */
  jobs.push(fetchSheet(SHARED,'kits').then(function(rows){
      DATA.clubs = parseClubs(rows);
      return parseKits(rows);
    }).catch(function(){ return null; })
    .then(function(k){ DATA.kits = k; }));
  jobs.push(fetchSheet(SHARED,'text').then(parseText).catch(function(){ return null; })
    .then(function(t){ DATA.text = t; }));
  jobs.push(fetchSheet(SHARED,'register').then(parseRegister).catch(function(){ return []; })
    .then(function(r){ DATA.register = r; }));
  jobs.push(fetchSheet(SHARED,'players2526').then(parsePlayerStats).catch(function(){ return null; })
    .then(function(x){ DATA.prior = x; }));
  /* the full stats for this season, straight off the raw layer */
  jobs.push(fetchSheet(SHARED,'rawPlayers').then(parsePlayerStats).catch(function(){ return null; })
    .then(function(x){ DATA.stats = x; }));

  /* one sheet holds every competition's fixtures, which is what makes
     a combined record across all of them possible */
  jobs.push(fetchSheet(SHARED,'fixtures').then(parseFixtures).catch(function(){ return []; })
    .then(function(f){ DATA.fixtures = f; }));

  /* what every table looked like after every gameweek, worked out by
     the sheet so the standings rules live in one place only */
  jobs.push(fetchSheet(SHARED,'positions').then(parsePositions).catch(function(){ return null; })
    .then(function(p){ DATA.positions = p; }));

  jobs.push(fetchSheet(SHARED,'motm').then(parseMotm).catch(function(){ return []; })
    .then(function(m){ DATA.motm = m; }));
  jobs.push(fetchSheet(SHARED,'champions').then(parseChampions).catch(function(){ return []; })
    .then(function(c){ DATA.champions = c; }));
  jobs.push(fetchSheet(SHARED,'historic').then(parseHistoric).catch(function(){ return []; })
    .then(function(h){ DATA.historic = h; }));

  jobs.push(fetchSheet(SHARED,'superliga').then(parseCupGroups).catch(function(){ return null; })
    .then(function(x){ DATA.superliga = x; }));
  jobs.push(fetchSheet(SHARED,'apertura').then(parseCupGroups).catch(function(){ return null; })
    .then(function(x){ DATA.apertura = x; }));
  jobs.push(fetchSheet(SHARED,'clausura').then(parseCupGroups).catch(function(){ return null; })
    .then(function(x){ DATA.clausura = x; }));
  jobs.push(fetchSheet(SHARED,'aperturaKO').then(parseKO).catch(function(){ return null; })
    .then(function(x){ DATA.aperturaKO = x; }));
  jobs.push(fetchSheet(SHARED,'clausuraKO').then(parseKO).catch(function(){ return null; })
    .then(function(x){ DATA.clausuraKO = x; }));

  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'squads').then(parseSquads).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].squads = x;
      }));
  });

  var L1 = CONFIG.leagues[0];
  jobs.push(fetchSheet(L1,'transfers').then(parseTransfers).catch(function(){ return null; })
    .then(function(p){ DATA.players = p; }));
  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'h2h').then(parseH2H).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].h2h = x;
        if (lg.key === 'L1') DATA.h2h = x;
      }));
  });
  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'cupGroups').then(parseCupGroups).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].cup = x;
        if (lg.key === 'L1') DATA.cup = x;
      }));
  });
  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'h2hKO').then(parseKO).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].h2hKO = x;
        if (lg.key === 'L1') DATA.h2hKO = x;
      }));
  });
  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'cupKO').then(parseKO).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].cupKO = x;
        if (lg.key === 'L1') DATA.cupKO = x;
      }));
  });
  CONFIG.leagues.forEach(function(lg){
    jobs.push(fetchSheet(lg,'h2hForm').then(parseH2HForm).catch(function(){ return null; })
      .then(function(x){
        if (!DATA.byLeague[lg.key]) DATA.byLeague[lg.key] = {};
        DATA.byLeague[lg.key].h2hForm = x;
        if (lg.key === 'L1') DATA.h2hForm = x;
      }));
  });

  Promise.all(jobs).then(function(){
    /* the Transfer Player List carries bonus and the player code, so
       photos and bonus points come from the one sheet now           */
    PlayerPhotos.build(DATA.players);
    if (DATA.players) DATA.players.forEach(function(p){ p.bonus = p.bonus || 0; });

    DATA.scores = mergedScores();
    fillPlayerStats_();
    bootDone = false;
    useLeague(CONFIG.leagues[0].key);
    bootDone = true;
    buildNav();
    buildNotices();
    buildLeagueBar();
    renderHome();
    buildSidePanels();
  });
}

/* =====================================================================
   HOME

   The page most people open and never leave, so it has to be worth
   opening on a Tuesday when nothing has happened.

   Three things it now does that it did not:

     - it tells the truth before the season starts. It used to say
       "Adam S leads the way on 0 points, 0 clear" in August, which is
       not a fact, it is a template with nothing in it.

     - the competition blocks say how far each competition has
       actually got. Only the finished one says champion.

     - a tracker cycles this gameweek's fixtures through whichever
       competitions are playing, in their own colours.

   Every line of wording goes through txt(), so it can be rewritten in
   USER_TEXT without touching this file.
   ===================================================================== */

var HOME_TRACK = 0;
var HOME_TIMER = null;

function renderHome(){
  var host = document.getElementById('p-home');
  if (loaded.home) return;

  if (!DATA.table || !DATA.table.length) {
    clear(host);
    host.appendChild(el('div','err', DATA.table
      ? txt('empty.table', 'The league table is empty. Rebuild it from the sheet, or wait '
          + 'for the first gameweek if the season has not started.')
      : txt('error.sheet', 'Could not load the league table sheet. Check it is still '
          + 'published to the web.')));
    return;
  }
  loaded.home = true;
  paintHome(host);
}

function paintHome(host){
  clear(host);
  if (HOME_TIMER) { clearInterval(HOME_TIMER); HOME_TIMER = null; }

  var played = DATA.gw ? DATA.gw.played : 0;

  host.appendChild(homeHero_(played));
  host.appendChild(homeTiles_(played));

  var pad = el('div');
  pad.style.cssText = 'padding:20px 24px 34px';
  host.appendChild(pad);

  var track = homeTracker_();
  if (track) pad.appendChild(track);

  /* the two small panels sit above the competitions, not below them -
     they are the warm bit and they belong near the top */
  var lower = el('div');
  lower.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));'
    + 'gap:10px;margin-bottom:22px';
  var motm = homeMotm_();
  if (motm) lower.appendChild(motm);
  var last = homeLastGw_(played);
  if (last) lower.appendChild(last);
  if (lower.children.length) pad.appendChild(lower);

  pad.appendChild(homeHeading_('Competitions', 'where each one stands'));
  pad.appendChild(homeComps_(played));
}

function homeHeading_(title, sub){
  var h = el('div');
  h.style.cssText = 'display:flex;align-items:baseline;gap:10px;margin:0 0 11px;flex-wrap:wrap';
  h.appendChild(cell_(title,
    'font-size:17px;font-weight:900;color:#0C2340;letter-spacing:-.3px'));
  if (sub) h.appendChild(cell_(sub, 'font-size:11px;color:#8a939c'));
  return h;
}

/* ---- HERO ----
   An aspect ratio rather than a fixed height, so the picture scales
   with the window instead of being cropped to whatever 250px happens
   to be at that width. The scrim is a gradient, clear at the top and
   dark where the words are, rather than a flat wash over the whole
   image - which was making the photograph muddy in order to make the
   text readable. */
function homeHero_(played){
  var hero = el('div','hero');

  fitImage_(hero, CONFIG.img.hero, function(){
    var slot = el('div','hero-slot');
    slot.appendChild(el('div', null, 'HERO IMAGE SLOT'));
    hero.insertBefore(slot, hero.firstChild);
  });

  var scrim = el('div','hero-scrim');
  hero.appendChild(scrim);

  var copy = el('div','hero-copy');
  var body = el('div');
  body.style.cssText = 'display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap';

  var text = el('div');
  text.style.cssText = 'flex:1;min-width:200px';

  if (!played){
    /* nothing has been played, so there is no leader to name */
    text.appendChild(el('div','hero-kicker',
      txt('home.pre.kicker', 'DRAFT NIGHT')));
    text.appendChild(el('div','hero-title',
      txt('home.pre.title', 'The season starts here')));
    text.appendChild(el('div','hero-sub',
      txt('home.pre.sub', (DATA.players || []).length + ' players in the pool. '
        + (CONFIG.squad ? '\u00a3' + CONFIG.squad.budget + 'm each.' : ''))));
  } else {
    var t = DATA.table[0];
    var margin = DATA.table.length > 1 ? (t.points - DATA.table[1].points) : 0;
    var complete = played >= CONFIG.totalGameweeks;

    text.appendChild(el('div','hero-kicker', complete
      ? txt('home.hero.champkicker', 'CHAMPIONS') + '  \u00b7  ' + CONFIG.season
      : txt('home.hero.kicker', 'GAMEWEEK') + ' ' + played + '  \u00b7  ' + LEAGUE.name.toUpperCase()));
    text.appendChild(el('div','hero-title', t.name + ' '
      + (complete ? txt('home.hero.champion', 'takes the title')
                  : txt('home.hero.leading', 'leads the way'))));
    text.appendChild(el('div','hero-sub',
      t.points + ' points, ' + (margin ? margin + ' clear of ' + DATA.table[1].name
        : 'level at the top') + ' after ' + played + ' gameweek'
        + (played === 1 ? '' : 's') + '.'));
  }

  /* 'hero-btn' has no styles, so the button rendered as a line of
     plain text. The class is 'hero-cta', and the text keys are
     .cta to match USER_TEXT. */
  var btn = el('a','hero-cta', played
    ? txt('home.hero.cta', 'View full standings')
    : txt('home.pre.cta', 'Open the transfer portal'));
  btn.addEventListener('click', function(){ go(played ? 'league' : 'portal'); });
  text.appendChild(btn);
  body.appendChild(text);

  /* the leader's face, once there is one */
  if (played){
    var kit = kitFor(DATA.table[0].name);
    var av = el('div');
    av.style.cssText = 'width:74px;height:74px;border-radius:50%;overflow:hidden;flex-shrink:0;'
      + 'background:' + kit.main + ';color:' + kit.text + ';display:flex;align-items:center;'
      + 'justify-content:center;font-size:20px;font-weight:900;'
      + 'border:3px solid rgba(255,255,255,.35)';
    av.appendChild(imgTry(CONFIG.img.manager(DATA.table[0].name), function(){
      av.textContent = DATA.table[0].name.substring(0,2).toUpperCase();
    }));
    var ai = av.firstChild;
    if (ai && ai.style) ai.style.cssText = 'width:100%;height:100%;object-fit:cover';
    body.appendChild(av);
  }

  copy.appendChild(body);
  hero.appendChild(copy);
  return hero;
}

/* ---- TILES ----
   Four zeros and "BEST GW -" is not a summary of anything. Before the
   season starts these carry the numbers that do exist. */
function homeTiles_(played){
  /* 'stats' had no styles at all, so the bar rendered as four
     stacked lines of unstyled text. The class is 'tiles'. */
  var bar = el('div','tiles');
  var vals;

  if (!played){
    var signed = (DATA.register || []).filter(function(r){ return r.action === 'SIGN'; }).length;
    vals = [
      [String(draftManagers_().length), 'MANAGERS'],
      [String((DATA.players || []).length), 'PLAYERS IN THE POOL'],
      [CONFIG.squad ? '\u00a3' + CONFIG.squad.budget + 'm' : '\u2013', 'EACH TO SPEND'],
      [String(signed), signed ? 'SIGNED SO FAR' : 'NOTHING SIGNED YET']
    ];
  } else {
    var total = 0, best = 0, bestWho = '';
    (DATA.table || []).forEach(function(t){ total += num(t.points); });
    Object.keys(DATA.scores || {}).forEach(function(n){
      Object.keys(DATA.scores[n]).forEach(function(g){
        var v = num(DATA.scores[n][g]);
        if (v > best) { best = v; bestWho = n; }
      });
    });
    var ave = DATA.table.length ? Math.round(total / DATA.table.length / played * 10) / 10 : 0;
    vals = [
      [String(played), 'GAMEWEEKS PLAYED'],
      [total.toLocaleString(), 'POINTS SCORED'],
      [best ? String(best) : '\u2013', best ? 'BEST GW \u00b7 ' + bestWho.toUpperCase() : 'BEST GW'],
      [String(ave), 'LEAGUE AVERAGE']
    ];
  }

  vals.forEach(function(v){
    var t = el('div','tile');
    t.appendChild(el('div','tv', v[0]));
    t.appendChild(el('div','tl', v[1]));
    bar.appendChild(t);
  });
  return bar;
}

function compRoute_(key){
  return { league:'league', h2h:'h2h', cup:'cup',
           superliga:'sliga', supercopa:'super', copa:'super' }[key] || 'home';
}

/* How far a competition has actually got, in its own words. */
function compState_(c, played){
  function tableTop(rows){
    if (!rows || !rows.length) return null;
    return rows[0];
  }

  if (c.key === 'league'){
    if (!played) return { label: txt('label.notstarted','NOT STARTED'), sub:'starts GW1' };
    var t = DATA.table[0];
    var m = DATA.table.length > 1 ? t.points - DATA.table[1].points : 0;
    return { label: played >= CONFIG.totalGameweeks ? 'CHAMPION' : 'LEADER',
             who: t.name, sub: t.points + ' pts  \u00b7  ' + (m ? m + ' clear' : 'level'),
             done: played >= CONFIG.totalGameweeks };
  }

  if (c.key === 'h2h'){
    var ko = koActive(DATA.h2hKO);
    var top = tableTop(DATA.h2h && DATA.h2h.table);
    if (!top) return { label:'NOT STARTED', sub:'starts GW1' };
    if (ko){
      var w = winnerOf(DATA.h2hKO, DATA.h2h.table);
      if (w && w.name && played >= CONFIG.totalGameweeks){
        return { label:'CHAMPION', who:w.name, sub:'', done:true };
      }
      return { label:'KNOCKOUT', sub:'semi-finals and final to come' };
    }
    return { label:'1ST OF ' + DATA.h2h.table.length, who:top.name,
             sub:(top.w||0) + '-' + (top.d||0) + '-' + (top.l||0) + '  \u00b7  ' + top.pts + ' pts' };
  }

  if (c.key === 'cup'){
    var g = DATA.cup;
    var any = g && ((g.a && g.a.length) || (g.b && g.b.length));
    if (!any) return { label:'NOT STARTED', sub: c.meta.split(' - ')[0] };
    if (koActive(DATA.cupKO)) return { label:'KNOCKOUT', sub:'the final is GW38' };
    var lead = tableTop(g.a) || tableTop(g.b);
    return { label:'GROUP STAGE', who: lead ? lead.name : '',
             sub: lead ? 'top of group A' : '' };
  }

  if (c.key === 'superliga'){
    var sl = superLigaTable_();
    if (!sl.length) return { label:'NOT STARTED', sub:'all 22 \u00b7 GW1-38' };
    return { label: played >= CONFIG.totalGameweeks ? 'CHAMPION' : 'LEADER',
             who: sl[0].name,
             sub: sl[0].pts + ' pts  \u00b7  played ' + (sl[0].pld || sl[0].played || 0),
             done: played >= CONFIG.totalGameweeks };
  }

  if (c.key === 'supercopa'){
    var ap = DATA.apertura, cl = DATA.clausura;
    var half = (cl && cl.groups && Object.keys(cl.groups).length) ? cl : ap;
    if (!half || !half.groups || !Object.keys(half.groups).length){
      return { label:'NOT STARTED', sub:'Apertura starts GW1' };
    }
    var name = half === cl ? 'Clausura' : 'Apertura';
    var ties = knockoutTies_('Supercopa ' + name);
    if (ties.length){
      var live = ties.filter(function(t){ return t.legs[1]; });
      return { label:(live[live.length-1].stage || 'KNOCKOUT').toUpperCase(),
               sub: name + '  \u00b7  ' + live.length + ' ties' };
    }
    return { label:'GROUP STAGE', sub: name + '  \u00b7  four groups' };
  }

  if (c.key === 'copa'){
    var ct = knockoutTies_('Copa del Campeones');
    if (!ct.length) return { label:'TBC', sub:'decided at GW36' };
    var f = ct[0].legs[1];
    return { label:'FINAL', sub: f.home + ' v ' + f.away };
  }

  return { label:'\u2013', sub:'' };
}

/* ---- TRACKER ----
   This gameweek, one competition at a time, in that competition's
   colours. Only competitions with a fixture this week appear, so it
   never offers an empty panel. */
function homeTracker_(){
  var gw = DATA.gw ? DATA.gw.played : 0;
  if (!gw) return null;

  var byComp = {}, order = [];
  (DATA.fixtures || []).forEach(function(f){
    if (f.gw !== gw) return;
    if (!DATA.scores[f.home] || !DATA.scores[f.away]) return;   /* placeholders */
    if (!byComp[f.comp]) { byComp[f.comp] = []; order.push(f.comp); }
    byComp[f.comp].push(f);
  });
  if (!order.length) return null;

  var wrap = el('div');
  wrap.style.cssText = 'border-radius:4px;overflow:hidden;margin-bottom:20px';

  function draw(){
    clear(wrap);
    if (HOME_TRACK >= order.length) HOME_TRACK = 0;
    var comp = order[HOME_TRACK];
    var col = compColourFor(comp);
    var list = byComp[comp].slice(0, 6);

    var head = el('div');
    head.style.cssText = 'background:' + col.colour + ';color:#fff;padding:11px 16px;'
      + 'display:flex;align-items:center;gap:11px;flex-wrap:wrap';
    head.appendChild(cell_(comp.toUpperCase(),
      'font-size:11px;font-weight:900;letter-spacing:1.4px'));
    head.appendChild(cell_('GAMEWEEK ' + gw,
      'font-size:10px;font-weight:700;opacity:.75'));

    var dots = el('span');
    dots.style.cssText = 'margin-left:auto;display:flex;gap:4px';
    order.forEach(function(_, k){
      var d = el('span');
      d.style.cssText = 'width:16px;height:3px;cursor:pointer;background:'
        + (k === HOME_TRACK ? '#fff' : 'rgba(255,255,255,.35)');
      d.addEventListener('click', function(){
        HOME_TRACK = k;
        if (HOME_TIMER) { clearInterval(HOME_TIMER); HOME_TIMER = null; }
        draw();
      });
      dots.appendChild(d);
    });
    head.appendChild(dots);
    wrap.appendChild(head);

    var body = el('div');
    body.style.cssText = 'background:#fff;border:0.5px solid #e3e8ee;border-top:none;'
      + 'display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))';
    list.forEach(function(f, k){
      var hs = DATA.scores[f.home] && DATA.scores[f.home][gw];
      var as = DATA.scores[f.away] && DATA.scores[f.away][gw];
      var row = scoreRow_(f.home, hs, f.away, as, col.colour, { tight: true });
      row.style.cssText += ';border-left:' + (k ? '0.5px solid #e3e8ee' : 'none');
      body.appendChild(row);
    });
    wrap.appendChild(body);
  }

  draw();
  if (order.length > 1){
    HOME_TIMER = setInterval(function(){
      HOME_TRACK = (HOME_TRACK + 1) % order.length;
      draw();
    }, 5000);
  }
  return wrap;
}

/* ---- LAST GAMEWEEK ----
   Three numbers from data already loaded, and the reason to look at
   the page on a Tuesday. */
function homeLastGw_(gw){
  if (!gw) return null;

  var high = { v:-1 }, close = { v:1e9 }, big = { v:-1 };
  Object.keys(DATA.scores || {}).forEach(function(n){
    var v = DATA.scores[n][gw];
    if (v === undefined) return;
    if (num(v) > high.v) high = { v:num(v), n:n };
  });
  (DATA.fixtures || []).forEach(function(f){
    if (f.gw !== gw) return;
    var h = DATA.scores[f.home] && DATA.scores[f.home][gw];
    var a = DATA.scores[f.away] && DATA.scores[f.away][gw];
    if (h === undefined || a === undefined) return;
    var d = Math.abs(num(h) - num(a));
    if (d < close.v) close = { v:d, t:f.home + ' v ' + f.away };
    if (d > big.v) big = { v:d, t:(num(h) > num(a) ? f.home + ' v ' + f.away
                                                   : f.away + ' v ' + f.home) };
  });
  if (high.v < 0) return null;

  var card = el('div');
  card.style.cssText = 'border:0.5px solid #e3e8ee;border-radius:4px;overflow:hidden';
  var head = el('div', null, 'GAMEWEEK ' + gw);
  head.style.cssText = 'background:#f7f9fb;padding:9px 14px;font-size:9px;font-weight:900;'
    + 'letter-spacing:1.4px;color:#8a939c;border-bottom:0.5px solid #e3e8ee';
  card.appendChild(head);

  [[String(high.v), 'HIGHEST', high.n, '#00A651'],
   [close.v < 1e9 ? String(close.v) : '\u2013', 'CLOSEST', close.t || '', '#0091DA'],
   [big.v >= 0 ? String(big.v) : '\u2013', 'BIGGEST WIN', big.t || '', '#E90052']]
   .forEach(function(x, k){
    var row = el('div');
    row.style.cssText = 'display:flex;align-items:center;gap:11px;padding:10px 14px'
      + (k ? ';border-top:0.5px solid #f2f4f7' : '');
    var bar = el('span');
    bar.style.cssText = 'width:3px;height:26px;background:' + x[3] + ';flex-shrink:0';
    row.appendChild(bar);
    row.appendChild(cell_(x[0],
      'font-size:19px;font-weight:900;color:#0C2340;letter-spacing:-.5px;width:38px'));
    var t = el('span');
    t.style.cssText = 'flex:1;min-width:0';
    t.appendChild(cell_(x[1],
      'display:block;font-size:8px;font-weight:900;letter-spacing:1.1px;color:#8a939c'));
    t.appendChild(cell_(x[2],
      'display:block;font-size:12px;font-weight:700;color:#0C2340;margin-top:1px;'
      + 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis'));
    row.appendChild(t);
    card.appendChild(row);
  });
  return card;
}


function winnerOf(ko, table){
  if (ko && ko.champion && ko.champion !== 'TBD') return { name: ko.champion, note: 'Champion' };
  if (ko && ko.ties && ko.ties.length){
    var fin = null;
    ko.ties.forEach(function(t){ if (String(t.label).toLowerCase().indexOf('final') >= 0 && String(t.label).toLowerCase().indexOf('semi') < 0) fin = t; });
    if (!fin) fin = ko.ties[ko.ties.length - 1];
    if (fin && fin.hs !== '' && fin.as !== ''){
      var hw = num(fin.hs) > num(fin.as);
      return { name: hw ? fin.home : fin.away, note: 'Beat ' + (hw ? fin.away : fin.home) + ' ' + fin.hs + '-' + fin.as };
    }
  }
  if (table && table.length) return { name: table[0].name, note: table[0].pts + ' pts' };
  return { name: '', note: '' };
}

/* =====================================================================
   SIDE PANEL - rotates through competitions
   ===================================================================== */
var panels = [], panelIdx = 0, panelTimer = null;

/* a competition counts as being at the knockout stage once its KO sheet
   holds at least one tie with two real teams in it */
function koActive(ko){
  if (!ko || !ko.ties || !ko.ties.length) return false;
  return ko.ties.some(function(t){
    return t.home && t.away && t.home !== 'TBD' && t.away !== 'TBD';
  });
}

/* Which gameweek a knockout stage is played in, taken from the
   Fixtures sheet rather than typed into the heading - so a schedule
   change moves the label without anyone remembering to. */
function koGwFor_(stageKey){
  if (!stageKey) return null;
  var comp = LEAGUE.h2hName ? LEAGUE.h2hName.replace(' Head to Head', ' H2H') : null;
  var want = { playoff:'Play-off', quarter:'Quarter-final', semi:'Semi-final', final:'Final' }[stageKey];
  if (!want) return null;

  var found = null;
  (DATA.fixtures || []).forEach(function(f){
    if (found) return;
    if (f.stage !== want) return;
    if (comp && f.comp.indexOf(LEAGUE.key === 'L1' ? 'FFS' : 'Audit') !== 0) return;
    if (f.comp.indexOf('H2H') < 0) return;
    found = f.gw;
  });
  return found;
}

function renderKOList(host, ko, colour){
  var ties = ko.ties.filter(function(t){
    return t.home && t.away && t.home !== 'TBD' && t.away !== 'TBD';
  }).slice(-4);

  ties.forEach(function(t){
    var lab = String(t.label).split('-')[0].trim();
    var head = el('div', null, lab.toUpperCase());
    head.style.cssText = 'font-size:9px;font-weight:800;letter-spacing:1px;color:#8a939c;margin:7px 0 3px';
    host.appendChild(head);

    var played = t.hs !== '' && t.hs !== undefined && t.as !== '' && t.as !== undefined;
    var hw = played && num(t.hs) > num(t.as);
    var aw = played && num(t.as) > num(t.hs);

    var box = el('div','sp-fx');
    [[t.home, t.hs, hw],[t.away, t.as, aw]].forEach(function(side){
      var line = el('div');
      var nm = el('span', null, side[0]);
      nm.style.cssText = 'font-weight:' + (side[2] ? '700' : '500') + ';color:' + (side[2] ? 'var(--ink)' : 'var(--ink2)')
        + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px';
      var sc = el('span', null, played ? String(side[1]) : '-');
      sc.style.cssText = 'font-weight:800;color:' + (side[2] ? colour : 'var(--ink3)');
      line.appendChild(nm); line.appendChild(sc);
      box.appendChild(line);
    });
    host.appendChild(box);
  });

  if (ko.champion && ko.champion !== 'TBD'){
    var win = el('div');
    win.style.cssText = 'margin-top:9px;padding:8px 9px;background:#f7f9fb;border-left:3px solid ' + colour;
    var l = el('div', null, 'WINNER');
    l.style.cssText = 'font-size:8px;font-weight:800;letter-spacing:1.1px;color:var(--ink3)';
    var v = el('div', null, ko.champion);
    v.style.cssText = 'font-size:14px;font-weight:900;color:var(--ink);margin-top:1px';
    win.appendChild(l); win.appendChild(v);
    host.appendChild(win);
  }
}

function buildSidePanels(){
  panels = [];

  if (DATA.table){
    panels.push({ title:'LEAGUE TABLE', colour:'#0091DA', render:function(host){
      DATA.table.slice(0,7).forEach(function(r,i){
        var row = el('div','sp-row');
        var mk = i===0?'var(--gold)':i===1?'var(--silver)':i===2?'var(--bronze)':'transparent';
        var bar = el('span'); bar.style.cssText = 'width:2px;height:15px;background:'+mk;
        row.appendChild(bar);
        row.appendChild(el('span','p', String(i+1)));
        row.appendChild(el('span','n', r.name));
        row.appendChild(el('span','v', String(r.points)));
        host.appendChild(row);
      });
    }});
  }

  if (DATA.h2h && DATA.h2h.table.length){
    var h2hKnockout = koActive(DATA.h2hKO);
    panels.push({
      title: h2hKnockout ? 'HEAD TO HEAD - KO' : 'HEAD TO HEAD',
      colour: '#003399',
      render: function(host){
        if (h2hKnockout) { renderKOList(host, DATA.h2hKO, '#003399'); return; }
        DATA.h2h.table.slice(0,7).forEach(function(r,i){
          var row = el('div','sp-row');
          var mk = i<4 ? '#003399' : 'transparent';
          var bar = el('span'); bar.style.cssText = 'width:2px;height:15px;background:'+mk;
          row.appendChild(bar);
          row.appendChild(el('span','p', String(i+1)));
          row.appendChild(el('span','n', r.name));
          row.appendChild(el('span','v', String(r.pts)));
          host.appendChild(row);
        });
      }
    });
  }

  if (DATA.cup && (DATA.cup.a.length || DATA.cup.b.length)){
    var cupKnockout = koActive(DATA.cupKO);
    panels.push({
      title: (LEAGUE.cupName || 'CUP').toUpperCase() + (cupKnockout ? ' - KO' : ''),
      colour: '#CC0000',
      render: function(host){

var NOTICE_HIDDEN = {};

function buildNotices(){
  var host = document.getElementById('notices');
  if (!host) return;
  clear(host);

  var list = (DATA.text && DATA.text.notices) || [];
  var today = new Date().toISOString().slice(0, 10);

  var live = list.filter(function(n, i){
    if (!n.on || !n.msg) return false;
    if (NOTICE_HIDDEN[i]) return false;
    if (n.from && today < n.from) return false;
    if (n.until && today > n.until) return false;
    return true;
  });

  live.forEach(function(n, k){
    var i = list.indexOf(n);
    var style = ['info','warn','good'].indexOf(n.style) >= 0 ? n.style : 'info';
    var row = el('div', 'notice ' + style + (k === live.length - 1 ? ' last' : ''));

    var ic = el('span', 'ic', style === 'warn' ? '\u26a0' : style === 'good' ? '\u2605' : '\u2139');
    row.appendChild(ic);
    row.appendChild(cell_(n.msg, 'flex:1'));

    var x = el('span', 'x', '\u2715');
    x.addEventListener('click', function(){
      NOTICE_HIDDEN[i] = true;
      buildNotices();

/* rebuild the table as it stood after a given gameweek */
function tableAt(gw){
  var out = [];
  DATA.table.forEach(function(t){
    var series = DATA.gw.byName[t.name];
    if (!series) {
      out.push({ name:t.name, points:t.points, low:'-', high:t.high, ave:t.ave, form:[] });
      return;
    }
    var slice = series.slice(0, gw);
    var total = 0, low = Infinity, high = 0;
    slice.forEach(function(raw){
      var v = num(raw);
      total += v; if (v > 0 && v < low) low = v; if (v > high) high = v;
    });
    out.push({
      name: t.name,
      points: total,
      low: low === Infinity ? '-' : low,
      high: high,
      ave: gw ? (total / gw).toFixed(1) : '0.0',
      form: slice.slice(-5)
    });
  });
  out.sort(function(a,b){ return b.points - a.points; });
  return out;
}

function streaks(arr){
  var bw=0,cw=0,bu=0,cu=0,bl=0,cl=0;
  arr.forEach(function(v){
    if (v !== 'W' && v !== 'D' && v !== 'L') return;
    cw = v === 'W' ? cw+1 : 0; if (cw > bw) bw = cw;
    cu = v === 'L' ? 0 : cu+1;  if (cu > bu) bu = cu;
    cl = v === 'L' ? cl+1 : 0;  if (cl > bl) bl = cl;
  });
  return [bw, bu, bl];
}

  });

/* ---- the record: every meeting between two managers ---- */
function buildRecord(host){
  clear(host);
  var pad = el('div','h2h-pad');
  var names = DATA.h2h.table.map(function(t){ return t.name; });

  var pick = el('div','rec-pick');
  function side(id, ring){
    var d = el('div','side');
    var av = el('div');
    av.style.cssText = 'width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid '
      + ring + ';display:flex;align-items:center;justify-content:center;margin:0 auto 8px;color:#fff;font-size:12px;font-weight:800;overflow:hidden';
    d.appendChild(av);
    var sel = document.createElement('select');
    sel.id = id;
    names.forEach(function(n){
      var o = document.createElement('option'); o.textContent = n; sel.appendChild(o);
    });
    d.appendChild(sel);
    d.avatar = av;
    return d;
  }
  var sA = side('recA', H2H_CY), sB = side('recB', H2H_PK);
  pick.appendChild(sA);
  pick.appendChild(el('div','rec-vs','VS'));
  pick.appendChild(sB);
  pad.appendChild(pick);

  var bar = el('div','rec-bar'); pad.appendChild(bar);
  var lbl = el('div','rec-lbl'); pad.appendChild(lbl);
  var stats = el('div','rec-stats'); pad.appendChild(stats);
  var mtHead = el('div', null, 'ALL MEETINGS');
  mtHead.style.cssText = 'font-size:8px;font-weight:900;letter-spacing:1.4px;color:' + H2H_CY + ';margin-bottom:8px';
  pad.appendChild(mtHead);
  var mts = el('div'); pad.appendChild(mts);
  host.appendChild(pad);

  sA.querySelector('select').value = names[0];
  sB.querySelector('select').value = names[1] || names[0];

  function avatar(host2, name){
    clear(host2);
    var im = imgTry(CONFIG.img.manager(name), function(){
      host2.textContent = name.substring(0,2);
    });
    im.style.cssText = 'width:100%;height:100%;object-fit:cover';
    host2.appendChild(im);
  }

  function paint(){
    var a = sA.querySelector('select').value, b = sB.querySelector('select').value;
    avatar(sA.avatar, a); avatar(sB.avatar, b);
    clear(bar); clear(lbl); clear(stats); clear(mts);

    if (a === b){
      var msg = el('div', null, 'Pick two different managers');
      msg.style.cssText = 'padding:24px;text-align:center;color:rgba(255,255,255,.4);font-size:12px';
      mts.appendChild(msg);
      return;
    }

    var ms = DATA.h2h.fixtures.filter(function(f){
      return (f.home === a && f.away === b) || (f.home === b && f.away === a);
    });

    var w=0,d=0,l=0,fa=0,fb=0,bigM=0,bigTxt='-';
    ms.forEach(function(f){
      var sa = f.home === a ? num(f.hs) : num(f.as);
      var sb = f.home === a ? num(f.as) : num(f.hs);
      fa += sa; fb += sb;
      if (sa > sb) w++; else if (sb > sa) l++; else d++;
      if (Math.abs(sa-sb) > bigM){ bigM = Math.abs(sa-sb); bigTxt = bigM + ' pts'; }
    });
    var tot = Math.max(1, w+d+l);

    [[w, H2H_CY], [d, '#FFFFFF'], [l, H2H_PK]].forEach(function(c){
      var seg = el('div', null, c[0] ? String(c[0]) : '');
      seg.style.width = (c[0]/tot*100) + '%';
      seg.style.background = c[1];
      bar.appendChild(seg);
    });
    lbl.appendChild(el('span', null, a.toUpperCase() + ' WINS'));
    lbl.appendChild(el('span', null, 'DRAWS'));
    lbl.appendChild(el('span', null, b.toUpperCase() + ' WINS'));

    var lead = w > l ? a : l > w ? b : 'Level';
    [[fa + '-' + fb, 'AGGREGATE POINTS', '#fff'], [lead, 'LEADS THE SERIES', H2H_CY], [bigTxt, 'BIGGEST MARGIN', H2H_PK]]
      .forEach(function(c){
        var d2 = el('div');
        var bb = el('b', null, String(c[0])); bb.style.color = c[2];
        d2.appendChild(bb); d2.appendChild(el('span', null, c[1]));
        stats.appendChild(d2);
      });

    if (!ms.length){
      var none = el('div', null, 'No meetings found');
      none.style.cssText = 'padding:18px;text-align:center;color:rgba(255,255,255,.4);font-size:12px';
      mts.appendChild(none);
      return;
    }

    ms.forEach(function(f, i){
      var sa = f.home === a ? f.hs : f.as;
      var sb = f.home === a ? f.as : f.hs;
      var row = el('div','rec-m');
      row.style.background = i % 2 ? '#16205F' : '#0F1749';
      var g = el('span', null, 'GW' + f.gw);
      g.style.cssText = 'width:40px;font-size:10px;font-weight:800;color:rgba(255,255,255,.5)';
      row.appendChild(g);
      var n1 = el('span', null, a.toUpperCase());
      n1.style.cssText = 'flex:1;text-align:right;font-size:12px;font-weight:' + (num(sa)>num(sb)?'800':'600')
        + ';color:' + (num(sa)>num(sb)?'#fff':'rgba(255,255,255,.6)');
      row.appendChild(n1);
      var v1 = el('span', null, String(sa));
      v1.style.cssText = 'min-width:26px;text-align:center;font-size:15px;font-weight:900;color:' + (num(sa)>num(sb)?H2H_CY:'rgba(255,255,255,.5)');
      row.appendChild(v1);
      var dash = el('span', null, '-'); dash.style.cssText = 'font-size:10px;color:rgba(255,255,255,.3)';
      row.appendChild(dash);
      var v2 = el('span', null, String(sb));
      v2.style.cssText = 'min-width:26px;text-align:center;font-size:15px;font-weight:900;color:' + (num(sb)>num(sa)?H2H_PK:'rgba(255,255,255,.5)');
      row.appendChild(v2);
      var n2 = el('span', null, b.toUpperCase());
      n2.style.cssText = 'flex:1;font-size:12px;font-weight:' + (num(sb)>num(sa)?'800':'600')
        + ';color:' + (num(sb)>num(sa)?'#fff':'rgba(255,255,255,.6)');
      row.appendChild(n2);
      mts.appendChild(row);
    });
  }

  sA.querySelector('select').addEventListener('change', paint);
  sB.querySelector('select').addEventListener('change', paint);
  paint();
}

/* ---- knockout ---- */
function buildKnockout(host){
  clear(host);
  var pad = el('div','h2h-pad');

  if (!DATA.h2hKO || !DATA.h2hKO.ties.length){
    var none = el('div', null, 'Knockout fixtures not yet available.');
    none.style.cssText = 'padding:26px;color:rgba(255,255,255,.45);font-size:12px;font-style:italic';
    pad.appendChild(none);
    host.appendChild(pad);
    return;
  }

  /* Stages are read from the sheet's own labels, not guessed at.

     This had two buckets - anything containing "semi" and everything
     else - so the FFS play-offs were filed under SEMI-FINALS and the
     semis and the final both piled into FINAL. Every heading was one
     stage out, and it looked deliberate.

     The Audit league has no play-off round, which is why the bug only
     showed on FFS: with two stages the two buckets happened to line
     up.                                                             */
  var STAGES = [
    { key:'playoff', label:'PLAY-OFF',    test:function(l){ return l.indexOf('play') >= 0 || l.indexOf('po') === 0; } },
    { key:'quarter', label:'QUARTER-FINALS', test:function(l){ return l.indexOf('quarter') >= 0 || l.indexOf('qf') === 0; } },
    { key:'semi',    label:'SEMI-FINALS', test:function(l){ return l.indexOf('semi') >= 0 || l.indexOf('sf') === 0; } },
    { key:'final',   label:'FINAL',       test:function(l){ return l.indexOf('final') >= 0 || l.indexOf('f') === 0; } }
  ];

  var groups = {}, gws = {};
  DATA.h2hKO.ties.forEach(function(t){
    var low = String(t.label).toLowerCase();
    var hit = null;
    for (var i = 0; i < STAGES.length; i++){
      if (STAGES[i].test(low)) { hit = STAGES[i]; break; }
    }
    var key = hit ? hit.key : 'other';
    if (!groups[key]) { groups[key] = []; gws[key] = koGwFor_(hit ? hit.key : null); }
    groups[key].push(t);
  });

  STAGES.concat([{ key:'other', label:'OTHER' }]).forEach(function(st){
    var list = groups[st.key];
    if (!list || !list.length) return;
    var gw = gws[st.key];
    var h = el('div', null, st.label + (gw ? '  -  GW' + gw : ''));
    h.style.cssText = 'font-size:9px;font-weight:900;letter-spacing:2px;'
      + 'color:rgba(255,255,255,.9);margin:8px 0 9px';
    pad.appendChild(h);
    list.forEach(function(t){
      var r = scoreRow(t.home, t.hs, t.away, t.as, H2H_CY);
      r.style.marginBottom = '9px';
      pad.appendChild(r);
    });
  });

  var win = winnerOf(DATA.h2hKO, DATA.h2h.table);
  if (win.name){
    var c = el('div','champ');
    var strip = el('div','strip');
    var s1 = el('span'); s1.style.cssText = 'flex:1;background:' + H2H_CY;
    var s2 = el('span'); s2.style.cssText = 'flex:1;background:' + H2H_PK;
    strip.appendChild(s1); strip.appendChild(s2);
    c.appendChild(strip);

    var p = el('div','panel');
    var av = el('div','av');
    var im = imgTry(CONFIG.img.manager(win.name), function(){
      av.textContent = win.name.substring(0,2);
    });
    av.appendChild(im);
    p.appendChild(av);

    var m = el('div'); m.style.flex = '1';
    m.appendChild(el('div','lbl','HEAD TO HEAD CHAMPION'));
    m.appendChild(el('div','nm', win.name.toUpperCase()));
    p.appendChild(m);

    var tro = el('div','tro');
    var tim = document.createElement('img');
    tim = imgTry(CONFIG.img.trophy('h2h'), null);
    tim.addEventListener('error', function(){
      if (tim.parentNode) tim.parentNode.removeChild(tim);
      tro.textContent = 'TROPHY';
    });
    tro.appendChild(tim);
    p.appendChild(tro);

    var right = el('div');
    right.style.textAlign = 'right';
    var note = el('div', null, win.note || '');
    note.style.cssText = 'font-size:11px;font-weight:800;letter-spacing:.6px;color:#5C646E';
    right.appendChild(note);
    p.appendChild(right);

    c.appendChild(p);
    pad.appendChild(c);
  }

  host.appendChild(pad);
}

var cupRound = 0;

  var host = document.getElementById('p-cup');

function cupBar(home, hs, away, as){
  var played = hs !== '' && hs !== undefined && as !== '' && as !== undefined;
  var hw = played && num(hs) > num(as);
  var row = el('div','cup-bar');
  var n1 = el('span','nm', String(home).toUpperCase());
  n1.style.textAlign='right'; n1.style.color = hw||!played ? '#2A2A2A' : '#9AA0A7';
  row.appendChild(n1);
  var s1 = el('span','sc', played ? String(hs) : '');
  s1.style.color = hw ? '#2A2A2A' : '#9AA0A7';
  row.appendChild(s1);
  row.appendChild(el('span','v','V'));
  var s2 = el('span','sc', played ? String(as) : '');
  s2.style.color = !hw && played ? '#2A2A2A' : '#9AA0A7';
  row.appendChild(s2);
  var n2 = el('span','nm', String(away).toUpperCase());
  n2.style.color = !hw||!played ? '#2A2A2A' : '#9AA0A7';
  row.appendChild(n2);
  return row;
}

function cupFixtures(host){

  });

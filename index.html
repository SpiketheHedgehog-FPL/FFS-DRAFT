    l.style.cssText='font-size:8px;font-weight:900;letter-spacing:2.2px;color:#5C646E';
    var nm = el('div', null, win.name.toUpperCase());
    nm.style.cssText='font-size:27px;font-weight:900;color:#22262B;letter-spacing:-.9px;line-height:1.05;margin-top:1px';
    m.appendChild(l); m.appendChild(nm);
    pnl.appendChild(m);
    var tro = el('div');
    tro.style.cssText='width:56px;height:56px;border:1px dashed #8A929C;display:flex;align-items:center;justify-content:center;'
      + 'flex-shrink:0;font-size:6px;font-weight:800;letter-spacing:.7px;color:#5C646E;overflow:hidden';
    var tim = document.createElement('img');
    tim = imgTry(CONFIG.img.trophy('cup'), null);
    tim.style.cssText='width:100%;height:100%;object-fit:contain';
    tim.addEventListener('error', function(){ if(tim.parentNode) tim.parentNode.removeChild(tim); tro.textContent='TROPHY'; });
    tro.appendChild(tim);
    pnl.appendChild(tro);
    var r = el('div'); r.style.textAlign='right';
    var nt = el('div', null, win.note || '');
    nt.style.cssText='font-size:11px;font-weight:800;letter-spacing:.6px;color:#5C646E';
    r.appendChild(nt); pnl.appendChild(r);
    c.appendChild(pnl);
    host.appendChild(c);
  }
}

/* =====================================================================
   SQUADS
   ===================================================================== */
var MGR = { name: null, view: 'squad' };

/* =====================================================================
   MANAGERS

   One page per manager, in their own kit: who they have, who they play
   next, everything they have played, and their record against every
   other manager whichever competition the meetings happened in.

   The kit does the work. The header block is their Main with their
   Text on it, the competitions panel is their Second with their 4th,
   and the trim beneath inverts the two so it reads as kit trim rather
   than a divider. Everything below stays white, because a fifteen row
   table needs somewhere calm to sit.
   ===================================================================== */

var MGR_VIEWS = [['squad','Squad'],['next','Next up'],['fix','Fixtures'],
                 ['res','Results'],['rec','Record']];

function renderManagers(){
  var host = document.getElementById('p-managers');
  if (loaded.managers) return;
  loaded.managers = true;
  paintManagers(host);
}

function paintManagers(host){
  clear(host);

  var data = (DATA.byLeague[LEAGUE.key] || {}).squads;
  var names = data && data.summary.length
    ? data.summary.map(function(m){ return m.name; })
    : ((DATA.table || []).map(function(t){ return t.name; }));

  if (!names.length){
    var note = el('div','note');
    note.style.margin = '28px 24px';
    note.textContent = 'No managers yet. They appear once the raw pull has run.';
    host.appendChild(note);
    return;
  }

  if (!MGR.name || names.indexOf(MGR.name) < 0) MGR.name = names[0];
  var kit = kitFor(MGR.name);
  var sum = data && data.byManager[MGR.name] ? data.byManager[MGR.name].summary : null;

  host.appendChild(mgrPicker(names, host));
  host.appendChild(mgrHeader(kit, sum));
  host.appendChild(mgrTabs(kit, host));
  host.appendChild(mgrTiles(kit, sum));

  var body = el('div');
  body.style.cssText = 'padding:2px 24px 36px';
  host.appendChild(body);

  if (MGR.view === 'squad')      mgrSquad(body, data);
  else if (MGR.view === 'next')  mgrNext(body);
  else if (MGR.view === 'fix')   mgrList(body, false);
  else if (MGR.view === 'res')   mgrList(body, true);
  else                           mgrRecord(body);
}

/* ---- the picker: a row of names, not a dropdown ---- */
function mgrPicker(names, host){
  var bar = el('div');
  bar.style.cssText = 'display:flex;align-items:center;gap:6px;flex-wrap:wrap;'
    + 'padding:14px 24px 10px';

  var lbl = el('span', null, 'MANAGER');
  lbl.style.cssText = 'font-size:9px;font-weight:700;letter-spacing:1.2px;'
    + 'color:#8a939c;margin-right:2px';
  bar.appendChild(lbl);

  names.forEach(function(n){
    var k = kitFor(n);
    var on = n === MGR.name;
    var b = el('button', null, n);
    b.style.cssText = 'font:inherit;font-size:12px;font-weight:' + (on ? '800' : '600')
      + ';cursor:pointer;padding:6px 11px;border-radius:3px;border:1px solid '
      + (on ? 'transparent' : '#dbe2e9') + ';'
      + (on ? 'background:' + k.main + ';color:' + k.text : 'background:#fff;color:#5a6570');
    b.addEventListener('click', function(){
      if (n === MGR.name) return;
      MGR.name = n;
      paintManagers(host);
    });
    bar.appendChild(b);
  });
  return bar;
}

/* ---- kit header, competitions panel, inverted trim ---- */
function mgrHeader(kit, sum){
  var wrap = el('div');
  wrap.style.cssText = 'margin:0 24px';

  var top = el('div');
  top.style.cssText = 'display:flex;flex-wrap:wrap';

  var left = el('div');
  left.style.cssText = 'flex:1;min-width:260px;background:' + kit.main + ';color:' + kit.text
    + ';padding:18px 20px;display:flex;align-items:center;gap:14px';

  var av = el('div');
  av.style.cssText = 'width:60px;height:60px;border-radius:50%;overflow:hidden;flex-shrink:0;'
    + 'background:rgba(255,255,255,.3);border:2px solid ' + kit.second
    + ';display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800';
  av.appendChild(imgTry(CONFIG.img.manager(MGR.name), function(){
    av.textContent = MGR.name.substring(0,2).toUpperCase();
  }));
  var im = av.firstChild;
  if (im && im.style) im.style.cssText = 'width:100%;height:100%;object-fit:cover';
  left.appendChild(av);

  var who = el('div');
  who.style.minWidth = '0';
  var nm = el('div', null, MGR.name);
  nm.style.cssText = 'font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.05';
  who.appendChild(nm);
  if (sum && sum.real){
    var rl = el('div', null, sum.real + (kit.kit ? '  \u00b7  ' + kit.kit : ''));
    rl.style.cssText = 'font-size:12px;font-weight:600;opacity:.82;margin-top:2px';
    who.appendChild(rl);
  }
  left.appendChild(who);
  top.appendChild(left);

  var right = el('div');
  right.style.cssText = 'width:236px;flex-shrink:0;background:' + kit.second + ';color:'
    + kit.fourth + ';padding:15px 16px';
  var ch = el('div', null, 'COMPETITIONS');
  ch.style.cssText = 'font-size:9px;font-weight:700;letter-spacing:1.2px;opacity:.72;margin-bottom:9px';
  right.appendChild(ch);

  var grid = el('div');
  grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:8px 10px';
  mgrCompStandings().forEach(function(c){
    var d = el('div');
    d.style.cssText = 'border-left:2px solid ' + kit.fourth + ';padding-left:8px;opacity:.95';
    var t = el('div', null, c[0]);
    t.style.cssText = 'font-size:9px;font-weight:600;opacity:.75;white-space:nowrap;'
      + 'overflow:hidden;text-overflow:ellipsis';
    var v = el('div', null, c[1]);
    v.style.cssText = 'font-size:15px;font-weight:800;letter-spacing:-.3px;margin-top:1px';
    d.appendChild(t); d.appendChild(v);
    grid.appendChild(d);
  });
  right.appendChild(grid);
  top.appendChild(right);
  wrap.appendChild(top);

  /* the trim inverts the header above it */
  var trim = el('div');
  trim.style.cssText = 'display:flex;height:5px';
  var t1 = el('span'); t1.style.cssText = 'flex:1;background:' + kit.second;
  var t2 = el('span'); t2.style.cssText = 'width:236px;background:' + kit.main;
  trim.appendChild(t1); trim.appendChild(t2);
  wrap.appendChild(trim);

  return wrap;
}

/* Where they stand in each competition. The Copa is a status, not a
   position - nobody has a fixture in it until two managers do.     */
function mgrCompStandings(){
  var out = [];
  var lt = (DATA.table || []).filter(function(t){ return t.name === MGR.name; })[0];
  out.push(['Overall league', lt ? ordinal(lt.pos) : '\u2013']);

  var h = DATA.h2h && DATA.h2h.table
    ? DATA.h2h.table.filter(function(t){ return t.name === MGR.name; })[0] : null;
  out.push(['Head to Head', h ? ordinal(h.pos) : '\u2013']);

  var cupPos = null;
  if (DATA.cup){
    ['a','b'].forEach(function(g){
      (DATA.cup[g] || []).forEach(function(t, i){
        if (t.name === MGR.name) cupPos = ordinal(i+1) + ' ' + g.toUpperCase();
      });
    });
  }
  out.push([LEAGUE.cupName || 'Cup', cupPos || '\u2013']);

  var sl = DATA.superliga && DATA.superliga.groups
    ? flatFind(DATA.superliga, MGR.name) : null;
  out.push(['SuperLiga', sl ? ordinal(sl.pos) : '\u2013']);

  return out;
}

function flatFind(g, name){
  var hit = null;
  Object.keys(g.groups || {}).forEach(function(k){
    (g.groups[k] || []).forEach(function(t, i){
      if (t.name === name && !hit) hit = { pos: i+1, group: k };
    });
  });
  return hit;
}

/* ---- sub-tabs ---- */
function mgrTabs(kit, host){
  var bar = el('div');
  bar.style.cssText = 'margin:0 24px;display:flex;gap:2px;overflow-x:auto;'
    + 'border-bottom:1px solid #e3e8ee;background:#fff';
  MGR_VIEWS.forEach(function(v){
    var on = MGR.view === v[0];
    var b = el('button', null, v[1]);
    b.style.cssText = 'font:inherit;font-size:12px;font-weight:' + (on ? '800' : '600')
      + ';cursor:pointer;background:none;border:none;white-space:nowrap;padding:12px 14px;'
      + 'color:' + (on ? kit.second : '#5a6570') + ';'
      + 'border-bottom:3px solid ' + (on ? kit.second : 'transparent');
    b.addEventListener('click', function(){
      if (MGR.view === v[0]) return;
      MGR.view = v[0];
      paintManagers(host);
    });
    bar.appendChild(b);
  });
  return bar;
}

/* ---- five tiles, alternating main and second ---- */
function mgrTiles(kit, sum){
  var fx = managerFixtures(MGR.name).filter(function(f){ return f.played; });
  var best = 0, total = 0;
  var sc = DATA.scores[MGR.name] || {};
  var weeks = Object.keys(sc);
  weeks.forEach(function(g){ var v = num(sc[g]); total += v; if (v > best) best = v; });
  var avg = weeks.length ? Math.round(total / weeks.length) : 0;
  var spend = sum && sum.spent !== null && sum.spent !== undefined ? sum.spent : null;

  var vals = [
    [String(total), 'POINTS'],
    [String(best), 'BEST GW'],
    [String(avg), 'AVERAGE'],
    [spend === null ? '\u2013' : spend.toFixed(1) + 'm', 'SPEND'],
    [spend ? (total / spend).toFixed(1) : '\u2013', 'PTS PER \u00a3M']
  ];

  var g = el('div');
  g.style.cssText = 'margin:14px 24px 10px;display:grid;'
    + 'grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px';
  vals.forEach(function(v, i){
    var odd = i % 2 === 1;
    var d = el('div');
    d.style.cssText = 'padding:11px 12px;background:' + (odd ? kit.second : kit.main)
      + ';color:' + (odd ? kit.fourth : kit.text);
    var b = el('div', null, v[0]);
    b.style.cssText = 'font-size:19px;font-weight:800;letter-spacing:-.6px';
    var l = el('div', null, v[1]);
    l.style.cssText = 'font-size:9px;font-weight:700;letter-spacing:1px;opacity:.78;margin-top:3px';
    d.appendChild(b); d.appendChild(l);
    g.appendChild(d);
  });
  return g;
}

/* ---- SQUAD ----
   Column headers, the last five, and a bar per gameweek across the
   season. The two graphics need week by week detail, which the Squads
   sheet now carries in its last two columns.

   Three states, never confused: a week the player was not owned draws
   nothing, a week on the bench draws faded, a week in the eleven draws
   solid. A form graphic that muddles those tells a lie about the
   player.                                                            */

function mgrSquad(host, data){
  var mine = data && data.byManager[MGR.name];
  if (!mine || !mine.players.length){
    host.appendChild(note_('No squad yet. It appears once the draft has happened, '
      + 'or once FPL starts reporting ownership.'));
    return;
  }

  var kit = kitFor(MGR.name);
  var hasFees = mine.players.some(function(p){ return p.fee !== null; });
  var limits = { GK:2, DEF:5, MID:5, FWD:3 };
  var best = mine.players.map(function(p){ return p.xiPts; })
    .sort(function(a,b){ return b - a; });

  host.appendChild(squadHead(hasFees));

  ['GK','DEF','MID','FWD'].forEach(function(pos){
    var group = mine.players.filter(function(p){ return p.pos === pos; });
    if (!group.length) return;

    var head = el('div');
    head.style.cssText = 'display:flex;align-items:center;gap:8px;margin:14px 0 4px';
    head.appendChild(cell_(pos,
      'font-size:10px;font-weight:800;letter-spacing:1.3px;color:' + kit.second));
    head.appendChild(cell_(group.length + ' of ' + (limits[pos] || group.length),
      'font-size:10px;font-weight:600;color:#8a939c'));
    var ln = el('span'); ln.style.cssText = 'flex:1;height:1px;background:#e8ecf0';
    head.appendChild(ln);
    host.appendChild(head);

    group.forEach(function(p){
      host.appendChild(squadRow(p, hasFees, kit, best));
    });
  });
}

function squadHead(hasFees){
  var h = el('div');
  h.style.cssText = 'display:flex;align-items:center;gap:9px;padding:10px 0 6px;'
    + 'border-bottom:0.5px solid #dbe2e9;font-size:9px;font-weight:700;'
    + 'letter-spacing:.8px;color:#8a939c';
  var cols = [['','width:26px'],['PLAYER','flex:1;min-width:70px'],['CLUB','width:38px']];
  if (hasFees) cols.push(['FEE','width:44px;text-align:right']);
  cols = cols.concat([
    ['LAST 5','width:96px;text-align:center'],
    ['SEASON','width:132px;text-align:center'],
    ['XI','width:32px;text-align:right'],
    ['PPG','width:32px;text-align:right'],
    ['SCORED','width:38px;text-align:right'],
    ['TEAM','width:40px;text-align:right'],
    ['','width:4px']
  ]);
  cols.forEach(function(c){ h.appendChild(cell_(c[0], c[1])); });
  return h;
}

function squadRow(p, hasFees, kit, best){
  var row = el('div');
  row.style.cssText = 'display:flex;align-items:center;gap:9px;padding:7px 0;'
    + 'border-bottom:0.5px solid #f2f4f7' + (p.starts ? '' : ';opacity:.6');

  var ph = playerPhoto(null, p.name, 26);
  ph.style.flexShrink = '0';
  row.appendChild(ph);
  clickable_(row, null, p.name);

  row.appendChild(cell_(p.name,
    'flex:1;min-width:70px;font-size:12px;font-weight:700;color:#0C2340;'
    + 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis'));
  row.appendChild(cell_(p.club, 'width:38px;font-size:10px;font-weight:600;color:#8a939c'));
  if (hasFees) row.appendChild(cell_(p.fee === null ? '' : p.fee.toFixed(1) + 'm',
    'width:44px;font-size:10px;color:#8a939c;text-align:right'));

  row.appendChild(lastFive(p));
  row.appendChild(seasonStrip(p, kit));

  var pct = p.gwPts && p.gwPts.length
    ? Math.round(p.starts / Math.max(1, weeksOwned(p)) * 100) : 0;
  row.appendChild(cell_(pct + '%',
    'width:32px;text-align:right;font-size:10px;font-weight:600;color:'
    + (pct < 40 ? '#c0392b' : '#8a939c')));
  row.appendChild(cell_(p.starts ? p.ppg.toFixed(1) : '\u2013',
    'width:32px;text-align:right;font-size:10px;color:#8a939c'));
  row.appendChild(cell_(String(p.totalPts),
    'width:38px;text-align:right;font-size:11px;color:#a3adb7'));
  row.appendChild(cell_(String(p.xiPts),
    'width:40px;text-align:right;font-size:14px;font-weight:800;color:#0C2340'));

  /* a medal rule on the right edge for the squad's top three */
  var medal = p.xiPts === best[0] ? '#D4AF37'
            : p.xiPts === best[1] ? '#9CA3AF'
            : p.xiPts === best[2] ? '#B45309' : 'transparent';
  var m = el('span');
  m.style.cssText = 'width:4px;height:18px;background:' + medal;
  row.appendChild(m);
  return row;
}

function weeksOwned(p){
  var n = 0;
  (p.gwPts || []).forEach(function(v){ if (String(v).trim() !== '') n++; });
  return n;
}

/* The five most recent weeks the player was actually owned. */
function lastFive(p){
  var wrap = el('span');
  wrap.style.cssText = 'width:96px;text-align:center;white-space:nowrap';

  var owned = [];
  (p.gwPts || []).forEach(function(v, i){
    if (String(v).trim() === '') return;
    owned.push({ v: num(v), started: (p.gwXI || '')[i] === '1' });
  });
  var five = owned.slice(-5);

  if (!five.length){ wrap.textContent = '\u2013'; wrap.style.color = '#c3ced8'; return wrap; }

  five.forEach(function(w){
    var bg = w.v >= 10 ? '#FBF0D5' : w.v >= 5 ? '#E8F3E0' : w.v > 0 ? '#f2f4f7' : '#f8f9fb';
    var fg = w.v >= 10 ? '#7a5c05' : w.v >= 5 ? '#2d5c12' : w.v > 0 ? '#5a6570' : '#c3ced8';
    var b = el('span', null, String(w.v));
    b.style.cssText = 'display:inline-block;width:17px;text-align:center;font-size:10px;'
      + 'font-weight:700;padding:3px 0;margin-right:2px;background:' + bg + ';color:' + fg
      + (w.started ? '' : ';opacity:.45');
    wrap.appendChild(b);
  });
  return wrap;
}

/* One bar a gameweek. Height is the score, solid if they started,
   faded if they were on the bench, nothing at all if not owned. */
function seasonStrip(p, kit){
  var wrap = el('span');
  wrap.style.cssText = 'width:132px;text-align:center;line-height:0;white-space:nowrap';

  var any = false;
  (p.gwPts || []).forEach(function(v, i){
    var owned = String(v).trim() !== '';
    var val = owned ? num(v) : 0;
    var started = (p.gwXI || '')[i] === '1';
    if (owned) any = true;

    var b = el('span');
    var h = owned ? Math.max(2, Math.min(20, val * 1.6)) : 2;
    var col = !owned ? '#eef1f4'
            : val >= 10 ? '#D4AF37'
            : val >= 5 ? '#4C9C2C'
            : val > 0 ? '#b8c4ce' : '#e4e9ee';
    b.style.cssText = 'display:inline-block;width:2px;vertical-align:bottom;margin-right:1px;'
      + 'height:' + h + 'px;background:' + col
      + ';opacity:' + (!owned ? .35 : started ? 1 : .3);
    wrap.appendChild(b);
  });

  if (!any){ clear(wrap); wrap.textContent = '\u2013'; wrap.style.color = '#c3ced8'; }
  return wrap;
}

/* ---- NEXT UP ---- */
function mgrNext(host){
  var fx = managerFixtures(MGR.name).filter(function(f){ return !f.played && f.oppReal; });

  /* the soonest fixture in each competition */
  var seen = {}, next = [];
  fx.forEach(function(f){
    if (seen[f.comp]) return;
    seen[f.comp] = true;
    next.push(f);
  });

  if (!next.length){
    host.appendChild(note_('No fixtures to come. Either the season has finished, '
      + 'or the fixtures have not been generated yet.'));
    return;
  }

  next.forEach(function(f){
    var oc = opponentColour(MGR.name, f.opp);
    var rec = recordAgainst(f.opp, f.comp);
    var mePos = positionIn(f.comp, MGR.name);
    var opPos = positionIn(f.comp, f.opp);

    var card = el('div');
    card.style.cssText = 'display:flex;background:' + oc.bg + ';color:' + oc.fg
      + ';margin-bottom:8px;border-radius:3px;overflow:hidden;min-height:92px';

    var pic = el('div');
    pic.style.cssText = 'width:96px;flex-shrink:0;background:rgba(255,255,255,.12);'
      + 'display:flex;align-items:flex-end;justify-content:center';
    var av = el('div');
    av.style.cssText = 'width:62px;height:62px;border-radius:50%;overflow:hidden;'
      + 'background:rgba(255,255,255,.22);margin-bottom:8px;display:flex;'
      + 'align-items:center;justify-content:center;font-size:16px;font-weight:800';
    av.appendChild(imgTry(CONFIG.img.manager(f.opp), function(){
      av.textContent = f.opp.substring(0,2).toUpperCase();
    }));
    var oi = av.firstChild;
    if (oi && oi.style) oi.style.cssText = 'width:100%;height:100%;object-fit:cover';
    pic.appendChild(av);
    card.appendChild(pic);

    var body = el('div');
    body.style.cssText = 'flex:1;padding:13px 18px;min-width:0';

    var top = el('div');
    top.style.cssText = 'display:flex;align-items:baseline;gap:9px;flex-wrap:wrap';
    top.appendChild(cell_(f.comp.toUpperCase(),
      'font-size:10px;font-weight:800;letter-spacing:1.3px;opacity:.9'));
    if (f.stage) top.appendChild(cell_(f.stage,
      'font-size:10px;font-weight:600;opacity:.7'));
    top.appendChild(cell_('GW' + f.gw + '  \u00b7  ' + (f.home ? 'Home' : 'Away'),
      'font-size:10px;font-weight:700;opacity:.7;margin-left:auto'));
    body.appendChild(top);

    body.appendChild(cell_('v ' + f.opp,
      'font-size:26px;font-weight:800;letter-spacing:-.7px;line-height:1.1;margin:5px 0 8px'));

    var foot = el('div');
    foot.style.cssText = 'display:flex;gap:22px;font-size:11px;flex-wrap:wrap';
    foot.appendChild(cell_(MGR.name + '   ' + (mePos ? ordinal(mePos.pos) : '\u2013')
      + '   ' + (mePos ? mePos.w + '-' + mePos.d + '-' + mePos.l : ''), 'opacity:.85'));
    foot.appendChild(cell_(f.opp + '   ' + (opPos ? ordinal(opPos.pos) : '\u2013')
      + '   ' + (opPos ? opPos.w + '-' + opPos.d + '-' + opPos.l : ''), 'opacity:.85'));
    if (rec.p) foot.appendChild(cell_('Record ' + rec.w + '-' + rec.d + '-' + rec.l,
      'opacity:.7;margin-left:auto'));
    body.appendChild(foot);

    card.appendChild(body);
    host.appendChild(card);
  });
}

function recordAgainst(opp, comp){
  var r = { p:0, w:0, d:0, l:0 };
  managerFixtures(MGR.name).forEach(function(f){
    if (f.opp !== opp || !f.played) return;
    if (comp && f.comp !== comp) return;
    r.p++;
    if (f.result === 'W') r.w++; else if (f.result === 'L') r.l++; else r.d++;
  });
  return r;
}

/* ---- FIXTURES and RESULTS ----
   Grouped by competition, because a flat list of ninety fixtures in
   gameweek order is a wall. Each group carries where the manager
   stands in it, and each row carries where they stood after that
   fixture - so you can watch someone climb.

   The running position is read from the Positions sheet, not worked
   out here. The standings rules live in the workbook and there is no
   second copy of them on this side to drift.                        */
/* superseded by compColourFor, which reads CONFIG.comps - kept as a
   name so nothing that referenced it breaks */
function compAccent(name){ return compColourFor(name).colour; }
var RESULT_COLOUR = { W:'#1D9E75', D:'#EF9F27', L:'#E24B4A' };

function mgrList(host, played){
  var fx = managerFixtures(MGR.name).filter(function(f){
    return f.oppReal && (played ? f.played : !f.played);
  });

  if (!fx.length){
    host.appendChild(note_(played ? 'Nothing played yet.' : 'No fixtures to come.'));
    return;
  }

  var order = [], byComp = {};
  fx.forEach(function(f){
    if (!byComp[f.comp]) { byComp[f.comp] = []; order.push(f.comp); }
    byComp[f.comp].push(f);
  });

  order.forEach(function(comp){
    var accent = compAccent(comp);
    var mine = byComp[comp];
    var now = positionAt(comp, MGR.name);

    var head = el('div');
    head.style.cssText = 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;'
      + 'padding:0 0 7px;margin-top:22px;border-bottom:2px solid ' + accent;
    head.appendChild(cell_(comp.toUpperCase(),
      'font-size:11px;font-weight:800;letter-spacing:1.4px;color:' + accent));
    if (now){
      head.appendChild(cell_(ordinal(now.pos) + (now.group ? '  \u00b7  Group ' + now.group : ''),
        'font-size:11px;font-weight:700;color:#0C2340'));
      head.appendChild(cell_(now.w + '-' + now.d + '-' + now.l,
        'font-size:11px;color:#8a939c'));
    }
    head.appendChild(cell_(mine.length + (played ? ' played' : ' to come'),
      'margin-left:auto;font-size:11px;color:#8a939c'));
    host.appendChild(head);

    var cols = el('div');
    cols.style.cssText = 'display:flex;gap:8px;padding:7px 0 5px;font-size:9px;'
      + 'font-weight:700;letter-spacing:.8px;color:#8a939c';
    [['GW','width:40px'],['ROUND','width:96px'],['OPPONENT','flex:1'],['H/A','width:26px'],
     [played ? '' : '', 'width:26px'],
     [played ? 'SCORE' : '', 'width:66px;text-align:right'],
     [played ? 'POS' : '', 'width:40px;text-align:right'],
     [played ? 'RECORD' : '', 'width:52px;text-align:right']]
      .forEach(function(c){ cols.appendChild(cell_(c[0], c[1])); });
    host.appendChild(cols);

    mine.forEach(function(f){
      var after = f.played ? positionAt(comp, MGR.name, f.gw) : null;
      var row = el('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:center;padding:7px 0;'
        + 'border-top:0.5px solid #f2f4f7';

      row.appendChild(cell_('GW' + f.gw, 'width:40px;font-size:11px;color:#8a939c'));
      row.appendChild(cell_(f.stage || '', 'width:96px;font-size:11px;color:#8a939c'));
      row.appendChild(cell_(f.opp, 'flex:1;font-size:13px;font-weight:700;color:#0C2340'));
      row.appendChild(cell_(f.home ? 'H' : 'A', 'width:26px;font-size:11px;color:#8a939c'));

      var mk = el('span');
      mk.style.cssText = 'width:26px';
      if (f.played){
        var b = el('span', null, f.result);
        b.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;'
          + 'width:22px;height:22px;border-radius:2px;font-size:12px;font-weight:800;'
          + 'color:#fff;background:' + RESULT_COLOUR[f.result];
        mk.appendChild(b);
      }
      row.appendChild(mk);

      row.appendChild(cell_(f.played ? f.mine + ' - ' + f.theirs : '',
        'width:66px;text-align:right;font-size:13px;font-weight:700;color:#0C2340'));
      row.appendChild(cell_(after ? ordinal(after.pos) : '',
        'width:40px;text-align:right;font-size:11px;color:#5a6570'));
      row.appendChild(cell_(after ? after.w + '-' + after.d + '-' + after.l : '',
        'width:52px;text-align:right;font-size:11px;color:#8a939c'));
      host.appendChild(row);
    });
  });
}

/* ---- RECORD ---- */
var RECORD_OPEN = null;

function mgrRecord(host){
  var rec = managerRecord(MGR.name);
  if (!rec.length){
    host.appendChild(note_('No meetings yet. The record fills in as fixtures are played.'));
    return;
  }

  var head = el('div');
  head.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 0 6px;'
    + 'border-bottom:0.5px solid #e3e8ee;font-size:9px;font-weight:700;'
    + 'letter-spacing:.9px;color:#8a939c';
  [['','width:3px'],['','width:26px'],['OPPONENT','flex:1'],
   ['P','width:26px;text-align:right'],['W','width:24px;text-align:right'],
   ['D','width:24px;text-align:right'],['L','width:24px;text-align:right'],
   ['FOR','width:42px;text-align:right'],['AGST','width:42px;text-align:right'],
   ['DIFF','width:40px;text-align:right']].forEach(function(c){
    head.appendChild(cell_(c[0], c[1]));
  });
  host.appendChild(head);

  rec.forEach(function(r){
    var oc = opponentColour(MGR.name, r.opp);
    var diff = r.f - r.a;

    var row = el('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 0;'
      + 'border-bottom:0.5px solid #f2f4f7;cursor:pointer';

    var bar = el('span');
    bar.style.cssText = 'width:3px;height:22px;background:' + oc.bg;
    row.appendChild(bar);

    var av = el('span');
    av.style.cssText = 'width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0;'
      + 'background:' + oc.bg + ';color:' + oc.fg + ';display:flex;align-items:center;'
      + 'justify-content:center;font-size:9px;font-weight:800';
    av.appendChild(imgTry(CONFIG.img.manager(r.opp), function(){
      av.textContent = r.opp.substring(0,2).toUpperCase();
    }));
    var ai = av.firstChild;
    if (ai && ai.style) ai.style.cssText = 'width:100%;height:100%;object-fit:cover';
    row.appendChild(av);

    row.appendChild(cell_(r.opp, 'flex:1;font-size:13px;font-weight:700;color:#0C2340'));
    row.appendChild(cell_(String(r.p), 'width:26px;text-align:right;font-size:12px;color:#5a6570'));
    row.appendChild(cell_(String(r.w), 'width:24px;text-align:right;font-size:12px;font-weight:800;color:#0C2340'));
    row.appendChild(cell_(String(r.d), 'width:24px;text-align:right;font-size:12px;color:#5a6570'));
    row.appendChild(cell_(String(r.l), 'width:24px;text-align:right;font-size:12px;color:#5a6570'));
    row.appendChild(cell_(String(r.f), 'width:42px;text-align:right;font-size:12px;color:#5a6570'));
    row.appendChild(cell_(String(r.a), 'width:42px;text-align:right;font-size:12px;color:#5a6570'));
    row.appendChild(cell_((diff > 0 ? '+' : '') + diff,
      'width:40px;text-align:right;font-size:12px;font-weight:800;color:'
      + (diff > 0 ? '#2d7a2d' : diff < 0 ? '#c0392b' : '#5a6570')));

    row.addEventListener('click', function(){ openRecord(r, oc); });
    host.appendChild(row);
  });
}

/* The card opens over the page rather than pushing the table apart.
   Inline expansion moved everything below it and lost your place;
   a popout keeps the table where it was and gives the card room to
   be read.                                                          */
function openRecord(r, oc){
  closeRecord();

  var kit = kitFor(MGR.name);

  var veil = el('div');
  veil.id = 'rec-veil';
  veil.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(12,35,64,.55);'
    + 'display:flex;align-items:center;justify-content:center;padding:18px';
  veil.addEventListener('click', function(e){ if (e.target === veil) closeRecord(); });

  var card = el('div');
  card.style.cssText = 'width:100%;max-width:520px;max-height:88vh;overflow-y:auto;'
    + 'background:#fff;border-radius:4px';

  /* header */
  var head = el('div');
  head.style.cssText = 'background:' + oc.bg + ';color:' + oc.fg
    + ';padding:15px 18px;display:flex;align-items:center;gap:12px';
  var av = el('span');
  av.style.cssText = 'width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;'
    + 'background:rgba(255,255,255,.3);display:flex;align-items:center;'
    + 'justify-content:center;font-size:13px;font-weight:800';
  av.appendChild(imgTry(CONFIG.img.manager(r.opp), function(){
    av.textContent = r.opp.substring(0,2).toUpperCase();
  }));
  var hi = av.firstChild;
  if (hi && hi.style) hi.style.cssText = 'width:100%;height:100%;object-fit:cover';
  head.appendChild(av);

  var comps = {};
  r.fx.forEach(function(f){ comps[f.comp] = true; });
  var nComp = Object.keys(comps).length;

  var t = el('span');
  t.style.cssText = 'flex:1;min-width:0';
  t.appendChild(cell_(MGR.name + ' v ' + r.opp,
    'display:block;font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1.05'));
  t.appendChild(cell_(r.p + ' MEETING' + (r.p === 1 ? '' : 'S') + '  \u00b7  ' + nComp
    + ' COMPETITION' + (nComp === 1 ? '' : 'S'),
    'display:block;font-size:10px;font-weight:700;letter-spacing:.6px;opacity:.8;margin-top:2px'));
  head.appendChild(t);

  var x = el('span');
  x.style.cssText = 'font-size:17px;opacity:.75;cursor:pointer';
  x.innerHTML = '<i class="ti ti-x"></i>';
  x.textContent = '\u2715';
  x.addEventListener('click', closeRecord);
  head.appendChild(x);
  card.appendChild(head);

  /* a dark rule, so the two colours cannot bleed into each other */
  var rule = el('div');
  rule.style.cssText = 'height:3px;background:#0C2340';
  card.appendChild(rule);

  /* the bar */
  var bar = el('div');
  bar.style.cssText = 'display:flex;height:40px';
  [[r.w, kit.main, kit.text], [r.d, '#B4B2A9', '#2C2C2A'], [r.l, oc.bg, oc.fg]]
    .forEach(function(seg){
      if (!seg[0]) return;
      var sp = el('span', null, String(seg[0]));
      sp.style.cssText = 'width:' + (seg[0] / r.p * 100) + '%;background:' + seg[1]
        + ';color:' + seg[2] + ';display:flex;align-items:center;justify-content:center;'
        + 'font-size:17px;font-weight:800';
      bar.appendChild(sp);
    });
  card.appendChild(bar);

  var lbl = el('div');
  lbl.style.cssText = 'display:flex;justify-content:space-between;padding:5px 18px 0;'
    + 'font-size:8px;font-weight:800;letter-spacing:1.1px;color:#8a939c';
  lbl.appendChild(cell_(MGR.name.toUpperCase() + ' WINS'));
  lbl.appendChild(cell_('DRAWN ' + r.d));
  lbl.appendChild(cell_(r.opp.toUpperCase() + ' WINS'
    + (oc.using === 'main' ? '' : '  \u00b7  ' + oc.using.toUpperCase())));
  card.appendChild(lbl);

  /* four figures, so the space carries something rather than padding */
  var best = 0;
  r.fx.forEach(function(f){ if (f.result === 'W' && f.mine > best) best = f.mine; });
  var diff = r.f - r.a;

  var stats = el('div');
  stats.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:1px;'
    + 'background:#e3e8ee;margin-top:13px';
  [[String(r.f),'POINTS FOR','#0C2340'],
   [String(r.a),'AGAINST','#0C2340'],
   [(diff > 0 ? '+' : '') + diff,'DIFFERENCE', diff > 0 ? '#2d7a2d' : diff < 0 ? '#C0392B' : '#0C2340'],
   [best ? String(best) : '\u2013','BEST WIN','#0C2340']].forEach(function(c){
    var d = el('div');
    d.style.cssText = 'background:#fff;padding:11px 12px';
    var b = el('div', null, c[0]);
    b.style.cssText = 'font-size:22px;font-weight:800;letter-spacing:-.7px;color:' + c[2];
    var l = el('div', null, c[1]);
    l.style.cssText = 'font-size:8px;font-weight:800;letter-spacing:1px;color:#8a939c;margin-top:2px';
    d.appendChild(b); d.appendChild(l);
    stats.appendChild(d);
  });
  card.appendChild(stats);

  /* every meeting */
  var list = el('div');
  list.style.cssText = 'border-top:1px solid #e3e8ee';
  r.fx.forEach(function(f){
    var row = el('div');
    row.style.cssText = 'display:flex;gap:9px;align-items:center;padding:8px 18px;'
      + 'border-bottom:0.5px solid #f2f4f7';
    var blk = el('span');
    blk.style.cssText = 'width:5px;height:20px;flex-shrink:0;background:'
      + (f.result === 'W' ? kit.main : f.result === 'L' ? oc.bg : '#B4B2A9');
    row.appendChild(blk);
    row.appendChild(cell_(f.comp, 'flex:1;font-size:12px;font-weight:600;color:#0C2340'));
    row.appendChild(cell_(f.stage || '', 'width:70px;font-size:10px;color:#8a939c'));
    row.appendChild(cell_('GW' + f.gw, 'width:38px;font-size:10px;color:#8a939c'));
    row.appendChild(cell_(f.mine + ' - ' + f.theirs,
      'width:66px;text-align:right;font-size:13px;font-weight:700;color:#0C2340'));
    list.appendChild(row);
  });
  card.appendChild(list);

  veil.appendChild(card);
  document.body.appendChild(veil);
  document.addEventListener('keydown', escRecord);
}

function closeRecord(){
  var v = document.getElementById('rec-veil');
  if (v && v.parentNode) v.parentNode.removeChild(v);
  document.removeEventListener('keydown', escRecord);
}

function escRecord(e){ if (e.key === 'Escape') closeRecord(); }

function cell_(text, css){
  var sp = el('span', null, text === undefined ? '' : text);
  if (css) sp.style.cssText = css;
  return sp;
}

function note_(text){
  var n = el('div','note', text);
  n.style.cssText = 'margin:24px 0;font-size:13px;color:#5a6570';
  return n;
}

/* =====================================================================
   THE GOLD COMPETITIONS
   SuperLiga and the Supercopa share a field: gold, white panels, the
   offset circles, 900-weight masthead. They are the two everyone
   plays, so they look like a pair and neither looks like the cups.
   ===================================================================== */

var GOLD      = '#D9AF2B';
var GOLD_DARK = '#8A6A0C';
var GOLD_DEEP = '#C9A227';

/* Which competition a name belongs to, so a block, a fixture row and
   a page masthead all reach for the same colour. */
function compKeyFor(name){
  var n = String(name || '').toLowerCase();
  if (n.indexOf('copa del') >= 0) return 'copa';
  if (n.indexOf('supercopa') >= 0) return 'supercopa';
  if (n.indexOf('superliga') >= 0) return 'superliga';
  if (n.indexOf('cup') >= 0) return 'cup';
  if (n.indexOf('h2h') >= 0 || n.indexOf('head to head') >= 0) return 'h2h';
  return 'league';
}
function compColourFor(name){ return CONFIG.compColour(compKeyFor(name)); }

/* The gold field, with the decorative circles behind everything. */
function goldField_(host){
  host.style.cssText = 'position:relative;background:' + GOLD + ';overflow:hidden';

  var c1 = el('div');
  c1.style.cssText = 'position:absolute;left:-90px;top:-80px;width:300px;height:300px;'
    + 'border-radius:50%;background:#E8C547;opacity:.55;pointer-events:none';
  var c2 = el('div');
  c2.style.cssText = 'position:absolute;right:-70px;bottom:-90px;width:280px;height:280px;'
    + 'border-radius:50%;background:#BE9420;opacity:.5;pointer-events:none';
  host.appendChild(c1);
  host.appendChild(c2);

  var body = el('div');
  body.style.cssText = 'position:relative';
  host.appendChild(body);
  return body;
}

function goldMast_(title, sub, rightLabel, rightValue, imgKey){
  var wrap = el('div');

  var top = el('div');
  top.style.cssText = 'padding:22px 22px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap';

  /* The border is only there so an absent logo has an outline. Once
     one loads it would frame the artwork, so it is removed rather
     than left showing round the edge of a badge.                    */
  var slot = el('div');
  slot.style.cssText = 'width:72px;height:72px;border:2px solid rgba(255,255,255,.45);'
    + 'display:flex;align-items:center;justify-content:center;flex-shrink:0';
  slot.appendChild(imgTry(CONFIG.img.comp(imgKey), function(){
    slot.textContent = 'LOGO';
    slot.style.fontSize = '8px';
    slot.style.fontWeight = '800';
    slot.style.color = '#fff';
  }));
  if (slot.firstChild && slot.firstChild.tagName === 'IMG') slot.style.border = 'none';
  var si = slot.firstChild;
  if (si && si.style) si.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain';
  top.appendChild(slot);

  var t = el('div');
  t.style.flex = '1';
  t.appendChild(cell_(title,
    'display:block;font-size:28px;font-weight:900;color:#fff;letter-spacing:-.5px;line-height:1'));
  t.appendChild(cell_(sub,
    'display:block;font-size:17px;font-weight:800;color:rgba(255,255,255,.75);'
    + 'letter-spacing:-.2px;line-height:1;margin-top:3px'));
  top.appendChild(t);

  if (rightValue){
    var r = el('div');
    r.style.cssText = 'text-align:right';
    r.appendChild(cell_(rightLabel,
      'display:block;font-size:8px;font-weight:800;letter-spacing:1.4px;color:rgba(255,255,255,.75)'));
    r.appendChild(cell_(rightValue,
      'display:block;font-size:17px;font-weight:900;color:#fff;letter-spacing:-.3px;margin-top:1px'));
    top.appendChild(r);
  }
  wrap.appendChild(top);
  return wrap;
}

function goldRule_(){
  var r = el('div');
  r.style.cssText = 'height:3px;background:#fff';
  return r;
}

function goldTabs_(views, current, onPick){
  var bar = el('div');
  bar.style.cssText = 'display:flex;gap:22px;padding:0 22px 12px;overflow-x:auto';
  views.forEach(function(v){
    var on = current === v[0];
    var b = el('button', null, v[1].toUpperCase());
    b.style.cssText = 'font:inherit;font-size:12px;font-weight:' + (on ? '900' : '800')
      + ';letter-spacing:1px;cursor:pointer;background:none;border:none;white-space:nowrap;'
      + 'padding:0 0 7px;color:' + (on ? '#fff' : 'rgba(255,255,255,.6)')
      + ';border-bottom:3px solid ' + (on ? '#fff' : 'transparent');
    b.addEventListener('click', function(){ if (!on) onPick(v[0]); });
    bar.appendChild(b);
  });
  return bar;
}

/* A white panel on the gold field. */
function goldPanel_(pad){
  var p = el('div');
  p.style.cssText = 'background:#fff;padding:' + (pad || '10px 12px 12px');
  return p;
}

/* The group or league table, gold-field styling. Options:
     qualify   how many advance, marked with a rule
     medals    gold, silver, bronze on the top three
     spoon     a red rule on the last row                          */
function goldTable_(rows, opt){
  opt = opt || {};
  var wrap = goldPanel_();

  var head = el('div');
  head.style.cssText = 'display:flex;align-items:center;gap:5px;padding:0 0 6px;'
    + 'border-bottom:1px solid ' + GOLD_DARK + ';font-size:8px;font-weight:900;'
    + 'letter-spacing:.8px;color:' + GOLD_DARK;
  var cols = [['','width:20px'],['','width:20px'],['TEAM','flex:1'],
    ['PLD','width:24px;text-align:right'],['W','width:20px;text-align:right'],
    ['D','width:18px;text-align:right'],['L','width:18px;text-align:right'],
    ['F','width:36px;text-align:right'],['A','width:36px;text-align:right'],
    ['PD','width:34px;text-align:right'],['PTS','width:24px;text-align:right']];
  cols.forEach(function(c){ head.appendChild(cell_(c[0], c[1])); });
  wrap.appendChild(head);

  rows.forEach(function(t, i){
    var pos = i + 1;
    var q = opt.qualify && pos <= opt.qualify;
    var last = opt.spoon && i === rows.length - 1;
    var mark = 'transparent';
    if (opt.medals) mark = pos === 1 ? '#D4AF37' : pos === 2 ? '#9CA3AF'
      : pos === 3 ? '#B45309' : last ? '#C0392B' : 'transparent';
    else if (q) mark = GOLD_DARK;
    else if (last) mark = '#C0392B';

    var dim = (opt.qualify && !q && !last) ? ';opacity:.45' : '';

    var row = el('div');
    row.style.cssText = 'display:flex;align-items:center;gap:5px;padding:5px 0;'
      + 'border-bottom:0.5px solid #F2EEE2' + dim;

    var rk = el('span');
    rk.style.cssText = 'width:20px;display:flex;align-items:center;gap:3px';
    var bar = el('span');
    bar.style.cssText = 'width:3px;height:14px;background:' + mark;
    rk.appendChild(bar);
    rk.appendChild(cell_(String(pos), 'font-size:11px;font-weight:900;color:#2A2A2A'));
    row.appendChild(rk);

    var av = el('span');
    av.style.cssText = 'width:19px;height:19px;border-radius:50%;overflow:hidden;flex-shrink:0;'
      + 'background:#F7F3E6;border:1px solid #E4DCC4;display:flex;align-items:center;'
      + 'justify-content:center;font-size:7px;font-weight:800;color:#B3A57F';
    av.appendChild(imgTry(CONFIG.img.manager(t.name), function(){
      av.textContent = t.name.substring(0,2).toUpperCase();
    }));
    var ai = av.firstChild;
    if (ai && ai.style) ai.style.cssText = 'width:100%;height:100%;object-fit:cover';
    row.appendChild(av);

    row.appendChild(cell_(String(t.name).toUpperCase(),
      'flex:1;min-width:0;font-size:10px;font-weight:800;letter-spacing:.3px;color:#2A2A2A;'
      + 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis'));

    var pld = t.played === undefined ? t.pld : t.played;
    row.appendChild(cell_(String(pld), 'width:24px;text-align:right;font-size:10px;color:#9A9284'));
    row.appendChild(cell_(String(t.w), 'width:20px;text-align:right;font-size:10px;font-weight:800;color:#2A2A2A'));
    row.appendChild(cell_(String(t.d), 'width:18px;text-align:right;font-size:10px;color:#9A9284'));
    row.appendChild(cell_(String(t.l), 'width:18px;text-align:right;font-size:10px;color:#9A9284'));
    row.appendChild(cell_(String(t.f), 'width:36px;text-align:right;font-size:10px;color:#9A9284'));
    row.appendChild(cell_(String(t.a === undefined ? '' : t.a),
      'width:36px;text-align:right;font-size:10px;color:#9A9284'));
    row.appendChild(cell_((t.pd > 0 ? '+' : '') + t.pd,
      'width:34px;text-align:right;font-size:10px;font-weight:700;color:'
      + (t.pd > 0 ? '#2A2A2A' : '#B8901F')));
    row.appendChild(cell_(String(t.pts),
      'width:24px;text-align:right;font-size:14px;font-weight:900;color:#2A2A2A;letter-spacing:-.5px'));
    wrap.appendChild(row);
  });
  return wrap;
}

function goldKey_(items){
  var k = el('div');
  k.style.cssText = 'padding:0 16px 16px;display:flex;gap:16px;align-items:center;'
    + 'justify-content:center;flex-wrap:wrap';
  items.forEach(function(it){
    var s = el('span');
    s.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:9px;'
      + 'font-weight:800;letter-spacing:.8px;color:#fff';
    var b = el('span');
    b.style.cssText = 'width:3px;height:12px;background:' + it[0];
    s.appendChild(b);
    s.appendChild(cell_(it[1]));
    k.appendChild(s);
  });
  return k;
}

/* =====================================================================
   THE SCORELINE ROW
   One fixture component for every competition. The bar under the
   winning score takes the competition's own colour, so the Cup is red,
   the H2H is cyan and the gold pages are gold - one component, three
   identities, rather than three components drifting apart.
   ===================================================================== */

function scoreRow_(home, hs, away, as, accent, opt){
  opt = opt || {};
  var played = hs !== null && hs !== undefined && hs !== ''
    && as !== null && as !== undefined && as !== '';
  var hw = played && num(hs) > num(as);
  var aw = played && num(as) > num(hs);

  var row = el('div');
  row.style.cssText = 'display:flex;align-items:center;background:#fff;padding:9px 14px;'
    + (opt.tight ? '' : 'margin-bottom:9px;') + (opt.click ? 'cursor:pointer;' : '');

  row.appendChild(cell_(home,
    'flex:1;text-align:right;font-size:12px;font-weight:800;letter-spacing:.6px;color:'
    + (played && !hw ? '#8F877B' : '#2A2A2A')
    + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis'));

  row.appendChild(faceDot_(home));
  row.appendChild(scoreCell_(played ? num(hs) : '\u2013', hw, accent));
  row.appendChild(cell_(opt.label || 'FT',
    'font-size:10px;font-weight:800;color:#C4BCB0;margin:0 5px;align-self:flex-start;'
    + 'padding-top:4px;letter-spacing:.5px'));
  row.appendChild(scoreCell_(played ? num(as) : '\u2013', aw, accent));
  row.appendChild(faceDot_(away));

  row.appendChild(cell_(away,
    'flex:1;font-size:12px;font-weight:800;letter-spacing:.6px;color:'
    + (played && !aw ? '#8F877B' : '#2A2A2A')
    + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis'));

  if (opt.right) row.appendChild(cell_(opt.right,
    'width:70px;text-align:right;font-size:10px;font-weight:700;color:#C4BCB0'));
  return row;
}

function faceDot_(name){
  var d = el('span');
  d.style.cssText = 'width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0;'
    + 'margin:0 10px;background:#F7F3E6;border:1px solid #E4DCC4;display:flex;'
    + 'align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#B3A57F';
  d.appendChild(imgTry(CONFIG.img.manager(name), function(){
    d.textContent = String(name).substring(0,2).toUpperCase();
  }));
  var i = d.firstChild;
  if (i && i.style) i.style.cssText = 'width:100%;height:100%;object-fit:cover';
  return d;
}

function scoreCell_(v, win, accent){
  var s = el('span');
  s.style.cssText = 'display:flex;flex-direction:column;align-items:center;width:32px;flex-shrink:0';
  s.appendChild(cell_(String(v),
    'font-size:18px;font-weight:900;letter-spacing:-.6px;line-height:1.05;color:'
    + (win ? '#2A2A2A' : '#B3ABA0')));
  var b = el('span');
  b.style.cssText = 'height:3px;width:22px;margin-top:3px;background:'
    + (win ? accent : 'transparent');
  s.appendChild(b);
  return s;
}


/* =====================================================================
   SUPERLIGA
   All 22, everyone twice, no knockout. The table at GW38 is the
   answer, so the page is the table, the fixtures, and a scrubber to
   wind the table back to any gameweek.
   ===================================================================== */

var SL_VIEW = 'table';
var SL_GW = null;

function renderSuperLiga(){
  var host = document.getElementById('p-sliga');
  if (loaded.sliga) return;
  loaded.sliga = true;
  paintSuperLiga(host);
}

function paintSuperLiga(host){
  clear(host);
  var body = goldField_(host);

  body.appendChild(goldMast_('SUPERLIGA',
    SL_VIEW === 'table' ? 'LEAGUE TABLE' : 'FIXTURES',
    'EVERYONE TWICE', '22 MANAGERS', 'superliga'));
  body.appendChild(goldTabs_([['table','Table'],['fix','Fixtures']], SL_VIEW,
    function(v){ SL_VIEW = v; paintSuperLiga(host); }));
  body.appendChild(goldRule_());

  var table = superLigaTable_();
  if (!table.length){
    body.appendChild(goldNote_(txt('empty.superliga',
      'SuperLiga has not been built yet. Generate its fixtures and rebuild it from the sheet.')));
    return;
  }

  if (SL_VIEW === 'fix') return superLigaFixtures_(body, host);

  /* the scrubber, same idea as the League tab */
  var maxGw = superLigaMaxGw_();
  if (SL_GW === null || SL_GW > maxGw) SL_GW = maxGw;
  if (maxGw) body.appendChild(goldScrub_(maxGw, host));

  var shown = SL_GW && SL_GW < maxGw ? superLigaTableAt_(SL_GW) : table;

  var pad = el('div');
  pad.style.cssText = 'padding:4px 16px 16px';
  pad.appendChild(goldTable_(shown, { medals: true, spoon: true }));
  body.appendChild(pad);

  body.appendChild(goldKey_([['#D4AF37','CHAMPION'],['#9CA3AF','SECOND'],
    ['#B45309','THIRD'],['#C0392B','WOODEN SPOON']]));
}

/* The table as published, or wound back to a gameweek using the
   Positions sheet - so the standings rules stay in the workbook. */
function superLigaTable_(){
  var g = DATA.superliga;
  if (!g) return [];
  if (g.table && g.table.length) return g.table;
  if (g.groups && g.groups[''] && g.groups[''].length) return g.groups[''];
  return (g.a || []).concat(g.b || []);
}

function superLigaMaxGw_(){
  var c = DATA.positions && DATA.positions['SuperLiga'];
  if (!c) return 0;
  var gws = Object.keys(c).map(Number);
  return gws.length ? Math.max.apply(null, gws) : 0;
}

function superLigaTableAt_(gw){
  var c = DATA.positions && DATA.positions['SuperLiga'];
  if (!c || !c[gw]) return superLigaTable_();
  var snap = c[gw];
  return Object.keys(snap).map(function(n){
    var r = snap[n];
    return { name:n, pos:r.pos, pld:r.pld, w:r.w, d:r.d, l:r.l,
             f:r.f, a:r.a, pd:r.pd, pts:r.pts };
  }).sort(function(a,b){ return a.pos - b.pos; });
}

function goldScrub_(maxGw, host){
  var bar = el('div');
  bar.style.cssText = 'padding:13px 22px 10px;display:flex;align-items:center;gap:12px';

  function step(d){
    return function(){
      SL_GW = Math.max(1, Math.min(maxGw, (SL_GW || maxGw) + d));
      paintSuperLiga(host);
    };
  }
  function btn(icon, fn){
    var b = el('button', null, icon);
    b.style.cssText = 'width:26px;height:26px;border:1px solid rgba(255,255,255,.7);'
      + 'background:none;color:#fff;cursor:pointer;font:inherit;font-size:12px;'
      + 'display:flex;align-items:center;justify-content:center;flex-shrink:0';
    b.addEventListener('click', fn);
    return b;
  }
  bar.appendChild(btn('\u2039', step(-1)));
  bar.appendChild(cell_('GW ' + (SL_GW || maxGw),
    'font-size:9px;font-weight:800;letter-spacing:1.2px;color:#fff;white-space:nowrap;min-width:46px'));

  var track = el('div');
  track.style.cssText = 'flex:1;height:4px;background:rgba(255,255,255,.35);position:relative;cursor:pointer';
  var fill = el('span');
  fill.style.cssText = 'position:absolute;left:0;top:0;bottom:0;background:#fff;width:'
    + ((SL_GW || maxGw) / maxGw * 100) + '%';
  track.appendChild(fill);
  track.addEventListener('click', function(e){
    var r = track.getBoundingClientRect();
    SL_GW = Math.max(1, Math.round((e.clientX - r.left) / r.width * maxGw));
    paintSuperLiga(host);
  });
  bar.appendChild(track);

  bar.appendChild(btn('\u203a', step(1)));
  bar.appendChild(cell_(SL_GW >= maxGw ? 'LATEST' : 'REWOUND',
    'font-size:9px;font-weight:800;letter-spacing:1.2px;color:rgba(255,255,255,.75);white-space:nowrap'));
  return bar;
}

var SL_FX = { gw: null };

function superLigaFixtures_(body, host){
  var fx = (DATA.fixtures || []).filter(function(f){ return f.comp === 'SuperLiga'; });
  if (!fx.length){
    body.appendChild(goldNote_(txt('empty.fixtures', 'No fixtures to come.')));
    return;
  }
  body.appendChild(gwFixtureScroller_(fx, GOLD_DEEP, SL_FX,
    function(){ paintSuperLiga(host); }));
}

/* One gameweek at a time, with arrows - the same mechanic the Head to
   Head page uses. A hundred and ten fixtures in one scroll is a wall;
   eleven at a time is a matchday.

   `state` is an object with a .gw the caller owns, so each page keeps
   its own place rather than sharing one global. */
function gwFixtureScroller_(fixtures, accent, state, repaint){
  var wrap = el('div');
  wrap.style.cssText = 'padding:0 0 20px';

  var byGw = {}, gws = [];
  fixtures.forEach(function(f){
    if (!byGw[f.gw]) { byGw[f.gw] = []; gws.push(f.gw); }
    byGw[f.gw].push(f);
  });
  gws.sort(function(a,b){ return a - b; });
  if (!gws.length) return wrap;

  if (state.gw === null || gws.indexOf(state.gw) < 0) state.gw = latestPlayedGw_(gws);
  var idx = gws.indexOf(state.gw);

  var bar = el('div');
  bar.style.cssText = 'display:flex;align-items:center;gap:10px;padding:14px 22px 12px';

  function arrow(sym, d, on){
    var b = el('button', null, sym);
    b.style.cssText = 'width:28px;height:28px;border:1px solid rgba(255,255,255,'
      + (on ? '.7' : '.25') + ');background:none;color:rgba(255,255,255,' + (on ? '1' : '.35')
      + ');font:inherit;font-size:14px;cursor:' + (on ? 'pointer' : 'default')
      + ';display:flex;align-items:center;justify-content:center;flex-shrink:0';
    if (on) b.addEventListener('click', function(){ state.gw = gws[idx + d]; repaint(); });
    return b;
  }
  bar.appendChild(arrow('\u2039', -1, idx > 0));
  bar.appendChild(cell_('GAMEWEEK ' + state.gw,
    'font-size:15px;font-weight:900;color:#fff;letter-spacing:.5px;min-width:132px;text-align:center'));
  bar.appendChild(arrow('\u203a', 1, idx < gws.length - 1));
  bar.appendChild(cell_((idx + 1) + ' of ' + gws.length,
    'margin-left:auto;font-size:10px;font-weight:800;letter-spacing:1.1px;color:rgba(255,255,255,.72)'));
  wrap.appendChild(bar);

  var grid = el('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));'
    + 'gap:9px;padding:0 16px';
  byGw[state.gw].forEach(function(f){
    var hs = DATA.scores[f.home] && DATA.scores[f.home][f.gw];
    var as = DATA.scores[f.away] && DATA.scores[f.away][f.gw];
    grid.appendChild(scoreRow_(f.home, hs, f.away, as, accent, { tight: true }));
  });
  wrap.appendChild(grid);
  return wrap;
}

/* Open on the most recent gameweek that has been played, not on
   gameweek one - nobody wants to arrive in August in March. */
function latestPlayedGw_(gws){
  var best = gws[0];
  gws.forEach(function(g){
    var any = Object.keys(DATA.scores).some(function(n){
      return DATA.scores[n][g] !== undefined;
    });
    if (any) best = g;
  });
  return best;
}

/* Fixtures grouped by gameweek, drawn with the scoreline row. */
function gwFixtureList_(fixtures, accent){
  var wrap = el('div');
  wrap.style.cssText = 'padding:14px 16px 20px';

  var byGw = {}, order = [];
  fixtures.forEach(function(f){
    if (!byGw[f.gw]) { byGw[f.gw] = []; order.push(f.gw); }
    byGw[f.gw].push(f);
  });
  order.sort(function(a,b){ return a - b; });

  order.forEach(function(gw){
    wrap.appendChild(cell_('GAMEWEEK ' + gw,
      'display:block;font-size:9px;font-weight:900;letter-spacing:2.2px;color:#fff;margin:8px 0 9px'));
    byGw[gw].forEach(function(f){
      var hs = DATA.scores[f.home] && DATA.scores[f.home][gw];
      var as = DATA.scores[f.away] && DATA.scores[f.away][gw];
      wrap.appendChild(scoreRow_(f.home, hs, f.away, as, accent));
    });
  });
  return wrap;
}

function goldNote_(text){
  var n = el('div');
  n.style.cssText = 'margin:20px 16px 26px;background:#fff;padding:16px 18px;'
    + 'font-size:13px;line-height:1.6;color:#5a6570';
  n.textContent = text;
  return n;
}


/* =====================================================================
   SUPERCOPA
   Two halves of four groups, a two-legged knockout in each, then the
   Copa between the two winners.
   ===================================================================== */

var SC_HALF = 'apertura';
var SC_VIEW = 'stand';
var SC_TIE_OPEN = null;
var SC_FX = { gw: null };

function renderSupercopa(){
  var host = document.getElementById('p-super');
  if (loaded.super) return;
  loaded.super = true;
  paintSupercopa(host);
}

function paintSupercopa(host){
  clear(host);
  var body = goldField_(host);

  var isCopa = SC_HALF === 'copa';
  var name = SC_HALF === 'clausura' ? 'Supercopa Clausura'
           : SC_HALF === 'apertura' ? 'Supercopa Apertura' : 'Copa del Campeones';

  body.appendChild(goldMast_('SUPERCOPA',
    isCopa ? 'COPA DEL CAMPEONES' : SC_HALF.toUpperCase(),
    isCopa ? 'TWO LEGS' : 'GROUP STAGE',
    isCopa ? 'GW37\u201338' : (SC_HALF === 'apertura' ? 'GW1\u201318' : 'GW19\u201336'),
    'supercopa'));

  body.appendChild(goldTabs_([['apertura','Apertura'],['clausura','Clausura'],
    ['copa','Copa del Campeones']], SC_HALF,
    function(v){ SC_HALF = v; SC_TIE_OPEN = null; paintSupercopa(host); }));
  body.appendChild(goldRule_());

  if (isCopa) return copaPanel_(body, host);

  /* the second bar: which part of this half you are looking at */
  body.appendChild(scSubTabs_(host));
  body.appendChild(goldRule_());

  var g = SC_HALF === 'apertura' ? DATA.apertura : DATA.clausura;
  var groups = g && g.groups ? g.groups : null;

  if (!groups || !Object.keys(groups).length){
    body.appendChild(goldNote_(txt('empty.supercopa',
      'This half has not been built yet. Fill in the Group Draws, generate the '
      + 'Supercopa fixtures and rebuild it.')));
    return;
  }

  if (SC_VIEW === 'fix'){
    var fx = (DATA.fixtures || []).filter(function(f){
      return f.comp === name && (f.stage.indexOf('Group') === 0 || f.stage === 'Idle');
    });
    if (!fx.length){
      body.appendChild(goldNote_('No group fixtures generated for this half yet.'));
      return;
    }
    body.appendChild(gwFixtureScroller_(fx, GOLD_DEEP, SC_FX,
      function(){ paintSupercopa(host); }));
    return;
  }

  if (SC_VIEW === 'ko'){
    var ties = knockoutTies_(name);
    if (!ties.length){
      body.appendChild(goldNote_('The knockout is drawn once the groups have finished.'));
      return;
    }
    body.appendChild(knockoutBlock_(ties, host));
    return;
  }

  var grid = el('div');
  /* two by two, not auto-fit. On a wide screen auto-fit put three
     groups in the first row and one orphan underneath, which is not
     how a four group draw reads. */
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(2,minmax(0,1fr));'
    + 'gap:12px;padding:16px';
  Object.keys(groups).sort().forEach(function(letter){
    var teams = groups[letter];
    if (!teams || !teams.length) return;
    var col = el('div');
    col.appendChild(cell_('GROUP ' + letter + '  \u00b7  ' + teams.length,
      'display:block;text-align:center;font-size:11px;font-weight:900;letter-spacing:2px;'
      + 'color:#fff;padding-bottom:7px'));
    col.appendChild(goldTable_(teams, { qualify: 3 }));
    grid.appendChild(col);
  });
  body.appendChild(grid);
  body.appendChild(goldKey_([[GOLD_DARK,'TOP THREE ADVANCE']]));
}

function scSubTabs_(host){
  var bar = el('div');
  bar.style.cssText = 'display:flex;gap:20px;padding:12px 22px 10px;overflow-x:auto';
  [['stand','Standings'],['fix','Fixtures'],['ko','Knockout']].forEach(function(v){
    var on = SC_VIEW === v[0];
    var b = el('button', null, v[1].toUpperCase());
    b.style.cssText = 'font:inherit;font-size:10px;font-weight:900;letter-spacing:1.4px;'
      + 'cursor:pointer;background:none;border:none;white-space:nowrap;padding:0 0 6px;'
      + 'color:' + (on ? '#fff' : 'rgba(255,255,255,.55)')
      + ';border-bottom:2px solid ' + (on ? '#fff' : 'transparent');
    b.addEventListener('click', function(){
      if (on) return;
      SC_VIEW = v[0];
      SC_TIE_OPEN = null;
      paintSupercopa(host);
    });
    bar.appendChild(b);
  });
  return bar;
}

/* Ties assembled by pairing M<n> leg 1 with M<n> leg 2. */
function knockoutTies_(comp){
  var stages = { 'Play-off':1, 'Quarter-final':2, 'Semi-final':3, 'Final':4 };
  var byTie = {};
  (DATA.fixtures || []).forEach(function(f){
    if (f.comp !== comp || !stages[f.stage]) return;
    var m = String(f.note || '').match(/^M(\d+)\s+leg\s+(\d+)/i);
    if (!m) return;
    if (!byTie[m[1]]) byTie[m[1]] = { id: num(m[1]), stage: f.stage, legs: {} };
    byTie[m[1]].legs[num(m[2])] = f;
  });
  return Object.keys(byTie).map(function(k){ return byTie[k]; })
    .filter(function(t){ return t.legs[1]; })
    .sort(function(a,b){ return (stages[a.stage] - stages[b.stage]) || (a.id - b.id); });
}

/* Aggregate on the row, both legs underneath when you click it. */
function knockoutBlock_(ties, host){
  var wrap = el('div');
  wrap.style.cssText = 'padding:16px 16px 20px';
  var lastStage = null;

  ties.forEach(function(t){
    if (t.stage !== lastStage){
      lastStage = t.stage;
      var gws = [t.legs[1] ? t.legs[1].gw : null, t.legs[2] ? t.legs[2].gw : null]
        .filter(Boolean).map(function(g){ return 'GW' + g; }).join(' AND ');
      wrap.appendChild(cell_(t.stage.toUpperCase() + (gws ? '  \u00b7  ' + gws : ''),
        'display:block;font-size:9px;font-weight:900;letter-spacing:2.2px;color:#fff;margin:8px 0 9px'));
    }

    var l1 = t.legs[1], l2 = t.legs[2];
    var home = l1.home, away = l1.away;

    function pt(n, gw){
      var v = DATA.scores[n] && DATA.scores[n][gw];
      return v === undefined || v === '' ? null : num(v);
    }
    var h1 = pt(home, l1.gw), a1 = pt(away, l1.gw);
    var h2 = l2 ? pt(home, l2.gw) : null, a2 = l2 ? pt(away, l2.gw) : null;
    var done = h1 !== null && a1 !== null && h2 !== null && a2 !== null;

    var box = el('div');
    box.style.cssText = 'background:#fff;margin-bottom:9px';

    var row = scoreRow_(home, done ? h1 + h2 : null, away, done ? a1 + a2 : null,
      GOLD_DEEP, { tight: true, label: 'AGG', click: done });
    if (done){
      var chev = el('span', null, SC_TIE_OPEN === t.id ? '\u2303' : '\u2304');
      chev.style.cssText = 'margin-left:8px;color:#C4BCB0;font-size:13px;flex-shrink:0';
      row.appendChild(chev);
      row.addEventListener('click', function(){
        SC_TIE_OPEN = SC_TIE_OPEN === t.id ? null : t.id;
        paintSupercopa(host);
      });
    }
    box.appendChild(row);

    if (done && SC_TIE_OPEN === t.id){
      var legs = el('div');
      legs.style.cssText = 'border-top:1px solid #F2EEE2;background:#FCFAF4';
      [[l1, h1, a1, home, away], [l2, h2, a2, away, home]].forEach(function(L, i){
        if (!L[0]) return;
        var hs = i === 0 ? L[1] : L[2], as = i === 0 ? L[2] : L[1];
        var lr = el('div');
        lr.style.cssText = 'display:flex;align-items:center;padding:7px 14px;font-size:11px';
        lr.appendChild(cell_('LEG ' + (i + 1),
          'width:58px;font-size:9px;font-weight:800;letter-spacing:1px;color:#B8901F'));
        lr.appendChild(cell_(L[3], 'flex:1;text-align:right;font-weight:700;color:'
          + (hs > as ? '#2A2A2A' : '#A39B8C')));
        lr.appendChild(cell_(hs + ' \u2013 ' + as,
          'width:64px;text-align:center;font-size:13px;font-weight:900;color:#2A2A2A'));
        lr.appendChild(cell_(L[4], 'flex:1;font-weight:700;color:'
          + (as > hs ? '#2A2A2A' : '#A39B8C')));
        lr.appendChild(cell_('GW' + L[0].gw,
          'width:44px;text-align:right;font-size:9px;color:#C4BCB0;font-weight:700'));
        legs.appendChild(lr);
      });
      box.appendChild(legs);
    }
    wrap.appendChild(box);
  });
  return wrap;
}

function copaPanel_(body, host){
  var ties = knockoutTies_('Copa del Campeones');
  if (!ties.length){
    body.appendChild(goldNote_(txt('empty.copa',
      'TBC - the Copa is decided at GW36, when both Supercopa finals have been played. '
      + 'The Apertura winner meets the Clausura winner over two legs. If the same manager '
      + 'wins both, the two losing finalists compete for the second place.')));
    return;
  }
  body.appendChild(knockoutBlock_(ties, host));

  /* the winners badge */

  var t2 = el('div');
  t2.style.cssText = 'flex:1;min-width:0';
  t2.appendChild(cell_('CHAMPION OF CHAMPIONS',
    'display:block;font-size:8px;font-weight:900;letter-spacing:2.2px;color:rgba(255,255,255,.85)'));
  t2.appendChild(cell_(champ.toUpperCase(),
    'display:block;font-size:29px;font-weight:900;color:#fff;letter-spacing:-.9px;line-height:1.05;margin-top:1px'));
  badge.appendChild(t2);

    'display:block;font-size:23px;font-weight:900;color:#fff;letter-spacing:-.7px'));

    'display:block;font-size:8px;font-weight:800;letter-spacing:1.2px;color:rgba(255,255,255,.85);margin-top:2px'));
  badge.appendChild(sc);

  pad.appendChild(badge);
  body.appendChild(pad);
}

/* Which manager holds a trophy, read from USER_CHAMPIONS.

   THE COLUMN AND THE CARD RARELY SPELL IT THE SAME WAY
   The card says HEAD TO HEAD, the sheet says "FFS H2H". Matching on
   the label alone found nothing and the panel showed a dash - which
   looks exactly like "nobody has won this yet" rather than "these two
   words are different".

   So each competition carries the spellings it answers to, and the
   league prefix is stripped off before comparing. A column may be
   "FFS H2H", "Head to Head" or "H2H" and all three land.          */

var COMP_ALIASES = {
  'OVERALL LEAGUE':     ['overall league', 'league'],
  'HEAD TO HEAD':       ['head to head', 'head-to-head', 'h2h'],
  'CUP':                ['cup'],
  'SUPERLIGA':          ['superliga', 'super liga'],
  'SUPERCOPA APERTURA': ['supercopa apertura', 'apertura'],
  'SUPERCOPA CLAUSURA': ['supercopa clausura', 'clausura'],
  'COPA DEL CAMPEONES': ['copa del campeones', 'copa', 'champion of champions']
};

/* "FFS H2H" -> { league:'ffs', comp:'h2h' } */
function splitCompKey_(key){
  var s = String(key || '').toLowerCase().trim();
  var league = null;
  CONFIG.leagues.forEach(function(l){
    if (league) return;
    var p = String(l.name || '').toLowerCase().replace(' league', '').trim();
    if (p && s.indexOf(p + ' ') === 0){ league = p; s = s.slice(p.length + 1).trim(); }
  });
  return { league: league, comp: s };
}

function holderFor_(row, compLabel, leagueName){
  if (!row) return null;

  var aliases = COMP_ALIASES[compLabel] || [String(compLabel).toLowerCase()];
  var lg = leagueName
    ? String(leagueName).toLowerCase().replace(' league', '').trim() : null;
  var keys = Object.keys(row.by || {});

  /* a column that names its league wins outright */
  for (var i = 0; i < keys.length; i++){
    var p = splitCompKey_(keys[i]);
    if (aliases.indexOf(p.comp) < 0) continue;
    if (p.league && lg && p.league === lg) return row.by[keys[i]];
  }

  /* an unqualified column belongs to the draft league only, so an
     archive written before the second league existed still reads
     correctly without putting its winners on the wrong panel */
  var draft = CONFIG.leagues[0];
  if (leagueName && leagueName !== draft.name) return null;

  for (var j = 0; j < keys.length; j++){
    var q = splitCompKey_(keys[j]);
    if (q.league) continue;
    if (aliases.indexOf(q.comp) >= 0) return row.by[keys[j]];
  }
  return null;
}

/* Which season's artwork to show for a trophy. This season if it
   exists, otherwise the most recent one that does.

   The list comes from USER_CHAMPIONS, so it only ever looks for
   seasons you have actually recorded rather than guessing backwards
   through years that never happened.                                */
function seasonWithArt_(imgKey){
  var now = CONFIG.seasonCode;
  var seasons = (DATA.champions || []).map(function(r){
    return String(r.season || '').replace(/\D/g, '');
  }).filter(Boolean);

  if (seasons.indexOf(now) >= 0 || !seasons.length){
    return { season: now, old: false, label: '' };
  }
  /* newest first, and USER_CHAMPIONS is already sorted that way */
  var prev = seasons[0];
  return { season: prev, old: true,
           label: prev.slice(0,2) + '/' + prev.slice(2) };
}

  var out = [];
  var sc = DATA.scores || {};
  var names = Object.keys(sc);
  if (!names.length) return out;

  var hi = { v: -1 }, lo = { v: 1e9 };
  names.forEach(function(n){
    Object.keys(sc[n]).forEach(function(g){
      var v = num(sc[n][g]);
      if (v > hi.v) hi = { v: v, n: n, g: g };
      if (v < lo.v) lo = { v: v, n: n, g: g };
    });
  });
  if (hi.v >= 0) out.push({ value: String(hi.v), label: 'HIGHEST GAMEWEEK',
    who: hi.n, when: 'GW' + hi.g + ' \u00b7 ' + CONFIG.season, colour: '#00A651' });
  if (lo.v < 1e9) out.push({ value: String(lo.v), label: 'LOWEST GAMEWEEK',
    who: lo.n, when: 'GW' + lo.g + ' \u00b7 ' + CONFIG.season, colour: '#DC2626' });

  var best = { v: -1 };
  (DATA.fixtures || []).forEach(function(f){
    var h = sc[f.home] && sc[f.home][f.gw], a = sc[f.away] && sc[f.away][f.gw];
    if (h === undefined || a === undefined) return;
    var m = Math.abs(num(h) - num(a));
    if (m > best.v) best = { v: m, f: f, h: num(h), a: num(a) };
  });
  if (best.v >= 0) out.push({ value: String(best.v), label: 'BIGGEST WIN',
    who: (best.h > best.a ? best.f.home + ' ' + best.h + '\u2013' + best.a + ' ' + best.f.away
        : best.f.away + ' ' + best.a + '\u2013' + best.h + ' ' + best.f.home),
    when: best.f.comp + ' \u00b7 GW' + best.f.gw, colour: '#003399' });

  var tot = names.map(function(n){
    var t = 0;
    Object.keys(sc[n]).forEach(function(g){ t += num(sc[n][g]); });
    return { n: n, t: t };
  }).sort(function(a,b){ return b.t - a.t; });
  if (tot.length) out.push({ value: String(tot[0].t), label: 'MOST POINTS THIS SEASON',
    who: tot[0].n, when: CONFIG.season, colour: '#0091DA' });

  return out;
}

/* ---- OUTTAKES ---- */
function honOuttakes(pad){
  pad.appendChild(honHead_('Outtakes'));

  var grid = el('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px';
  pad.appendChild(grid);

  var count = el('div');
  count.style.cssText = 'margin-top:14px;font-size:11px;color:#8a939c';
  pad.appendChild(count);

  var found = [];
  var misses = 0;
  var stop = CONFIG.img.outtakeStopAfter || 3;
  var max = CONFIG.img.outtakeMax || 200;

  /* Walk upwards, keeping what exists and counting what does not.
     Three misses in a row means the end - which tolerates a gap in
     the numbering without running to two hundred requests. */
  function look(n){
    if (n > max || misses >= stop){ done(); return; }
    var probe = new Image();
    var tried = 0;
    var base = CONFIG.img.outtake(n);
    probe.onload = function(){
      found.push({ img: base, name: '', kit: null, n: n });
      misses = 0;
      add(found.length - 1);
      look(n + 1);
    };
    probe.onerror = function(){
      tried++;
      if (tried < CONFIG.img.types.length){
        probe.src = base + CONFIG.img.types[tried];
        return;
      }
      misses++;
      look(n + 1);
    };
    probe.src = base + CONFIG.img.types[0];
  }

  function add(i){
    var sl = found[i];
    var cell = el('div');
    cell.style.cssText = 'aspect-ratio:4/3;background:#f1f4f7;overflow:hidden;cursor:pointer;'
      + 'display:flex;align-items:center;justify-content:center';
    var im = imgTry(sl.img, function(){
      if (cell.parentNode) cell.parentNode.removeChild(cell);
    });
    im.style.cssText = 'width:100%;height:100%;object-fit:cover';
    cell.appendChild(im);
    cell.addEventListener('click', function(){ openLightbox(found, i); });
    grid.appendChild(cell);
  }

  function done(){
    if (!found.length){
      clear(count);
      pad.appendChild(bigNote_(txt('empty.outtakes', 'No outtakes yet.')));
      return;
    }
    count.textContent = found.length + ' outtake'
      + (found.length === 1 ? '' : 's') + '. Drop another into img/outtakes as outtake-'
      + (found[found.length - 1].n + 1) + ' and it appears here.';
  }

  look(1);
}

/* How many distinct clubs the archive thinks there are. A healthy
   season has twenty. One or two means the column is a dragged formula
   with a locked reference, or a paste that filled down - which is the
   sort of thing that looks like a lookup bug for two days. */
function archiveClubs(){
  if (!DATA.prior){ console.log('no archive loaded'); return null; }

  var rows = Object.keys(DATA.prior.byCode).map(function(k){ return DATA.prior.byCode[k]; });
  if (!rows.length) rows = Object.keys(DATA.prior.byId).map(function(k){ return DATA.prior.byId[k]; });

  var count = {};
  rows.forEach(function(r){
    var c = String(r.club || '(blank)');
    count[c] = (count[c] || 0) + 1;
  });
  var names = Object.keys(count).sort(function(a,b){ return count[b] - count[a]; });

  console.log('archive clubs');
  console.log('  rows            ', rows.length);
  console.log('  distinct clubs  ', names.length,
    names.length < 15 ? '  *** a Premier League season has twenty' : '');
  names.slice(0, 25).forEach(function(n){
    console.log('     ' + n + '  ' + count[n]);
  });
  if (names.length < 15){
    console.log('');
    console.log('  The Club column in USER_2526 Players is not one club per player.');
    console.log('  Check it for a formula with a locked reference, or a fill-down.');
  }
  return count;
}

function playerCheckAll_(){
  var live = DATA.players || [];

  console.log('player data');
  console.log('  transfer list           ', live.length);
  console.log('  with a code             ', live.filter(function(p){ return p.code; }).length);
  console.log('  RAW_Players rows        ', stats ? Object.keys(stats.byId).length : 0);
  console.log('  RAW_Players columns     ', stats ? Object.keys(stats.cols).length : 0,
    stats && Object.keys(stats.cols).length < 40
      ? '  *** looks like the old pull - re-run "Pull raw data"' : '');
  console.log('  archive rows            ', prior ? Object.keys(prior.byId).length : 0);
  console.log('  archive indexed by code ', prior ? Object.keys(prior.byCode).length : 0,
    prior && !Object.keys(prior.byCode).length

function pcKeys(e){ if (e.key === 'Escape') closePlayer(); }

/* Everything known about a player, from whichever season is selected.

   `val` takes both a live column name and an archive header so the
   same card works off two differently-shaped sources without the
   caller caring which is loaded. */
function playerRecord_(id, name){
  var live = null;
  (DATA.players || []).forEach(function(x){
    if (live) return;
    if (id && String(x.id) === String(id)) live = x;
    else if (!id && name && x.web === name) live = x;
  });

  var pid  = live ? String(live.id) : (id ? String(id) : '');
  var nm   = (live && live.web) || name || '';
  /* the code is the one thing that survives a season */
  var code = (live && String(live.code || '')) || '';

  /* MATCH ON CODE, NOT ID

     FPL reassigns element ids every summer, so last season's id 12 is
     somebody else entirely this year. Looking the archive up by id
     returned a different player wearing the right name - Haaland came
     back as a Newcastle defender, which is the sort of wrong that
     looks like a data problem rather than a lookup problem.

     The code is permanent. It is what the photographs are keyed on
     too, for the same reason.                                       */
  /* THE LIVE SHEET may be indexed by either. The ARCHIVE is matched on
     code ALONE.

     Falling back to a name match across seasons is how Haaland came
     back as a Newcastle midfielder: the name found a row, the row was
     somebody else, and the card showed the right name above the wrong
     club with a straight face.

     No last season beats the wrong last season. If the code does not
     match, there is no second tab and nothing to mislead anybody. */
  function lookLive(){
    if (!DATA.stats) return null;
    if (code && DATA.stats.byCode[code]) return DATA.stats.byCode[code];
    if (pid && DATA.stats.byId[pid]) return DATA.stats.byId[pid];
    return DATA.stats.byName[String(nm).toLowerCase()] || null;
  }
  var now = lookLive();

  /* the transfer list may not carry the code, but the raw sheet does */
  if (!code && now && now.code) code = String(now.code);

  var prior = (code && DATA.prior && DATA.prior.byCode)
    ? (DATA.prior.byCode[code] || null) : null;

  /* NO ID FALLBACK. NONE.

     This used to say: if the archive has no code column, fall back to
     matching on id. That is the original bug wearing a hat. Element
     ids are reassigned every summer, so id 12 finds whoever holds it
     now - which is how Haaland kept coming back from Newcastle.

     If the codes are not readable the answer is no last season, and
     playerCheck() will say why. A missing tab is a puzzle; a wrong
     club is a lie.                                                  */
  var priorLoose = false;

  if (!live && !now && !prior) return null;

  var use = PC_SEASON === 'prior' ? prior : now;
  var any = use || now || prior;

  return {
    id: pid,
    web: nm || (any && any.web) || '',
    pos: (any && any.pos) || (live && live.pos) || '',
    club: (any && any.club) || (live && live.club) || '',
    clubName: (any && any.club) || (live && live.club) || '',
    owner: (live && live.team) || '',
    hasPrior: !!prior,
    priorLoose: priorLoose,
    /* liveKey is the snake_case name in RAW_Players, archiveKey the
       Title Case one in the archive. Falls back to the transfer list
       for the handful of fields that predate the full pull. */
    val: function(liveKey, archiveKey){
      var src = PC_SEASON === 'prior' ? prior : now;
      if (src){
        var v = src.get(PC_SEASON === 'prior' ? archiveKey : liveKey);
        if (v !== undefined && v !== null && v !== '') return v;
      }
      if (PC_SEASON !== 'prior' && live){
        var w = live[liveKey];
        if (w !== undefined && w !== null) return w;
      }
      return '';
    }
  };
}

/* Amber under 100, red at zero, with the reason spelled out. */
function availabilityBand_(p){
  var chance = p.val('chance_of_playing_next_round', 'chance next round %');
  var news = String(p.val('news', 'news') || '').trim();

  var c = chance === '' || chance === null ? null : num(chance);
  if (c === null && !news) return null;
  if (c === 100 && !news) return null;

  var red = c === 0;
  var band = el('div');
  band.style.cssText = 'background:' + (red ? '#C0392B' : '#E8A317') + ';color:#fff;'
    + 'padding:8px 18px;display:flex;align-items:center;gap:9px';
  band.appendChild(cell_(red ? '\u2715' : '\u26a0', 'font-size:14px;flex-shrink:0'));

  var t = el('span');
  t.style.cssText = 'flex:1;min-width:0';
  t.appendChild(cell_(red ? 'UNAVAILABLE' : (c === null ? 'DOUBTFUL' : c + '% CHANCE'),
    'display:block;font-size:9px;font-weight:900;letter-spacing:1.2px;opacity:.85'));
  if (news) t.appendChild(cell_(news,
    'display:block;font-size:12px;font-weight:700;margin-top:1px'));
  band.appendChild(t);
  return band;
}

/* Eight stats that mean something for the position being looked at.
   Bonus is on every one of them. */
function breakdownFor_(p){
  function v(a, b){ return p.val(a, b); }
  var common = [[v('bonus','bonus'), 'BONUS'], [v('starts','starts'), 'STARTS']];

  if (p.pos === 'GK'){
    return [[v('saves','saves'),'SAVES'], [v('clean_sheets','clean sheets'),'CLEAN SHEETS'],
            [v('goals_conceded','goals conceded'),'CONCEDED'], [v('penalties_saved','pens saved'),'PENS SAVED']]
           .concat(common)
           .concat([[v('bps','bps'),'BPS'], [v('expected_goals_conceded','xgc'),'xGC']]);
  }
  if (p.pos === 'DEF'){
    return [[v('clean_sheets','clean sheets'),'CLEAN SHEETS'], [v('goals_conceded','goals conceded'),'CONCEDED'],
            [v('goals_scored','goals'),'GOALS'], [v('assists','assists'),'ASSISTS']]
           .concat(common)
           .concat([[v('clearances_blocks_interceptions','cbi'),'CBI'], [v('defensive_contribution','def contribution'),'DEF CONTRIB']]);
  }
  return [[v('goals_scored','goals'),'GOALS'], [v('assists','assists'),'ASSISTS'],
          [v('expected_goals','xg'),'xG'], [v('expected_assists','xa'),'xA']]
         .concat(common)
         .concat([[v('minutes','minutes'),'MINUTES'], [v('threat','threat'),'THREAT']]);
}

/* Who takes what. Only shown when the API says someone is on them. */
function setPieces_(p){
  var out = [];
  [['penalties_order','penalties order','PENALTIES'],
   ['corners_and_indirect_freekicks_order','corners order','CORNERS'],
   ['direct_freekicks_order','direct fk order','FREE KICKS']].forEach(function(x){
    var v = p.val(x[0], x[1]);
    if (v === '' || v === null) return;
    var n = num(v);
    if (!n) return;
    out.push([x[2] + '  ' + ordinal(n), true]);
  });
  return out;
}

function ownerStats_(p){
  var out = [];
  var d = DATA.byLeague[LEAGUE.key];
  var sq = d && d.squads;
  var row = null;
  if (sq) sq.players.forEach(function(x){
    if (!row && x.manager === p.owner && x.name === p.web) row = x;
  });

  if (row){
    if (row.fee !== null) out.push([money_(row.fee), 'FEE']);
    out.push([String(row.totalPts), 'SCORED']);
    out.push([String(row.xiPts), 'FOR TEAM']);
    out.push([String(row.starts), 'STARTS']);
    if (row.fee) out.push([(row.xiPts / row.fee).toFixed(1), 'PTS PER \u00a3M']);
  } else {
    out.push([String(p.val('total_points','total points') || 0), 'SCORED']);
  }
  return out;
}

/* =====================================================================
   LIGHTBOX
   One popout for every image on the site. Arrows and the keyboard move
   through the set without closing, because clicking twelve outtakes
   one at a time is not a thing anyone should have to do.
   ===================================================================== */

var LB = { slides: [], i: 0 };

function openLightbox(slides, index){
  closeLightbox();
  LB.slides = slides || [];
  LB.i = index || 0;
  if (!LB.slides.length) return;

  var veil = el('div');
  veil.id = 'lb-veil';
  veil.style.cssText = 'position:fixed;inset:0;z-index:300;background:rgba(12,35,64,.72);'
    + 'display:flex;align-items:center;justify-content:center;padding:20px';
  veil.addEventListener('click', function(e){ if (e.target === veil) closeLightbox(); });

  var body = el('div');
  body.id = 'lb-body';
  body.style.cssText = 'width:100%;max-width:480px';
  veil.appendChild(body);

  [['\u2039', -1, 'left:22px'], ['\u203a', 1, 'right:22px']].forEach(function(a){
    var b = el('span', null, a[0]);
    b.style.cssText = 'position:absolute;' + a[2] + ';top:50%;transform:translateY(-50%);'
      + 'width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);'
      + 'display:flex;align-items:center;justify-content:center;cursor:pointer;'
      + 'color:#fff;font-size:22px;user-select:none';
    b.addEventListener('click', function(e){ e.stopPropagation(); lbStep(a[1]); });
    veil.appendChild(b);
  });

  var x = el('span', null, '\u2715');
  x.style.cssText = 'position:absolute;right:22px;top:20px;font-size:19px;'
    + 'color:rgba(255,255,255,.8);cursor:pointer';
  x.addEventListener('click', closeLightbox);
  veil.appendChild(x);

  document.body.appendChild(veil);
  document.addEventListener('keydown', lbKeys);
  lbPaint();
}

function lbStep(d){
  if (!LB.slides.length) return;
  LB.i = (LB.i + d + LB.slides.length) % LB.slides.length;
  lbPaint();
}

function lbKeys(e){
  if (e.key === 'Escape') return closeLightbox();
  if (e.key === 'ArrowLeft') return lbStep(-1);
  if (e.key === 'ArrowRight') return lbStep(1);
}

function closeLightbox(){
  var v = document.getElementById('lb-veil');
  if (v && v.parentNode) v.parentNode.removeChild(v);
  document.removeEventListener('keydown', lbKeys);
}

function lbPaint(){

    av.appendChild(imgTry(CONFIG.img.manager(sl.name), function(){

var plPos = 'ALL', plOwn = 'ALL', plQ = '', plSort = 'pts', plLimit = 60;
var PPC = { GK:['#eef6ff','#1d4ed8'], DEF:['#effaf1','#15803d'], MID:['#fffbeb','#a16207'], FWD:['#fff1f3','#be123c'] };

/* =====================================================================
   PLAYERS

   The reference view for the whole season. The Portal owns draft
   night; this is where you come to look somebody up in March.

   TWO THINGS THIS REBUILD FIXES

   The columns were every one a fixed pixel width with nothing
   flexible, so the table stopped at about 550px and the right half of
   the page was empty. Numbers want fixed widths; the name and the
   owner want the room that is left.

   And the masthead carried a dashed box reading IMAGE SLOT that
   pointed at nothing and never had. It is now a spotlight on whoever
   is actually leading, which needs no artwork and changes as the
   season runs.
   ===================================================================== */

var PL_POS = 'ALL', PL_OWN = 'ALL', PL_SORT = 'pts', PL_Q = '';
var PL_SHOW = 60;

function renderPlayers(){
  var host = document.getElementById('p-players');
  if (loaded.players) return;
  if (!DATA.players || !DATA.players.length){
    clear(host);
    host.appendChild(el('div','err',
      txt('error.sheet', 'Could not load the Transfer Player List sheet.')));
    return;
  }
  loaded.players = true;
  paintPlayers(host);
}

function paintPlayers(host){
  clear(host);

  /* rank within position - 130 points is excellent for a defender and
     ordinary for a forward, and the raw number says neither */
  var rank = {};
  ['GK','DEF','MID','FWD'].forEach(function(pp){
    DATA.players.filter(function(p){ return p.pos === pp; })
      .sort(function(a,b){ return b.pts - a.pts; })
      .forEach(function(p, i){ rank[p.id] = i + 1; });
  });

  host.appendChild(playersMast_());

  var trim = el('div','pl-trim');
  ['#00D9C0','#00FF87','#E90052'].forEach(function(c){
    var sp = el('span');
    sp.style.cssText = 'flex:1;background:' + c;
    trim.appendChild(sp);
  });
  host.appendChild(trim);

  var bar = el('div');
  bar.style.cssText = 'padding:13px 18px 11px;display:flex;gap:9px;align-items:center;'
    + 'flex-wrap:wrap;border-bottom:0.5px solid #e3e8ee';
  host.appendChild(bar);

  var wrap = el('div');
  wrap.style.cssText = 'overflow-x:auto';
  var tbl = el('div');
  tbl.style.cssText = 'min-width:900px';
  wrap.appendChild(tbl);
  host.appendChild(wrap);

  /* ---- filters ---- */
  var box = el('div');
  box.style.cssText = 'flex:1;min-width:180px;max-width:340px;border:1px solid #dbe2e9;'
    + 'padding:7px 11px;display:flex;align-items:center';
  var inp = document.createElement('input');
  inp.placeholder = 'Search player or club';
  inp.value = PL_Q;
  inp.style.cssText = 'border:none;outline:none;font:inherit;font-size:12px;'
    + 'width:100%;background:transparent;color:#0C2340';
  box.appendChild(inp);
  bar.appendChild(box);

  function pills(vals, current, colour, onPick){
    var g = el('div');
    g.style.cssText = 'display:flex;gap:3px;flex-wrap:wrap';
    vals.forEach(function(v){
      var on = current === v[0];
      var b = el('button', null, v[1]);
      b.style.cssText = 'font:inherit;font-size:9px;font-weight:800;letter-spacing:.5px;'
        + 'padding:6px 9px;cursor:pointer;border:1px solid '
        + (on ? 'transparent' : '#dbe2e9') + ';background:' + (on ? colour : '#fff')
        + ';color:' + (on ? '#fff' : '#5a6570');
      b.addEventListener('click', function(){ onPick(v[0]); });
      g.appendChild(b);
    });
    return g;
  }

  bar.appendChild(pills([['ALL','ALL'],['GK','GK'],['DEF','DEF'],['MID','MID'],['FWD','FWD']],
    PL_POS, '#37003C', function(v){ PL_POS = v; PL_SHOW = 60; paintPlayers(host); }));
  bar.appendChild(pills([['ALL','ALL'],['FREE','FREE'],['OWNED','OWNED']],
    PL_OWN, '#00A85A', function(v){ PL_OWN = v; PL_SHOW = 60; paintPlayers(host); }));

  var right = el('div');
  right.style.cssText = 'margin-left:auto;display:flex;align-items:center;gap:8px';
  var count = el('span');
  count.style.cssText = 'font-size:10px;color:#8a939c;white-space:nowrap';
  right.appendChild(count);
  right.appendChild(pills([['pts','PTS'],['ppg','PPG'],['val','VALUE']],
    PL_SORT, '#E90052', function(v){ PL_SORT = v; paintPlayers(host); }));
  bar.appendChild(right);

  /* ---- table ---- */
  var COLS = [
    ['',        'width:28px'],
    ['PLAYER',  'flex:1.6;min-width:132px'],
    ['POS',     'width:40px'],
    ['RNK',     'width:34px;text-align:right'],
    ['CLUB',    'width:38px'],
    ['FEE',     'width:44px;text-align:right'],
    ['PTS',     'width:40px;text-align:right'],
    ['PPG',     'width:34px;text-align:right'],
    ['G',       'width:30px;text-align:right'],
    ['A',       'width:30px;text-align:right'],
    ['CS',      'width:30px;text-align:right'],
    ['BON',     'width:34px;text-align:right'],
    ['VAL',     'width:44px;text-align:right'],
    ['OWNER',   'flex:1;min-width:92px;padding-left:12px']
  ];

  var head = el('div');
  head.style.cssText = 'display:flex;align-items:center;gap:8px;padding:9px 18px 8px;'
    + 'border-bottom:1px solid #dbe2e9;font-size:8px;font-weight:800;'
    + 'letter-spacing:.9px;color:#8a939c';
  COLS.forEach(function(c){ head.appendChild(cell_(c[0], c[1])); });
  tbl.appendChild(head);

  var body = el('div');
  tbl.appendChild(body);

  var POSCOL = { GK:['#eef6ff','#1d4ed8'], DEF:['#effaf1','#15803d'],
                 MID:['#fffbeb','#a16207'], FWD:['#fff1f3','#be123c'] };

  function draw(){
    clear(body);

    var rows = DATA.players.filter(function(p){
      if (PL_POS !== 'ALL' && p.pos !== PL_POS) return false;
      if (PL_OWN === 'FREE' && p.team) return false;
      if (PL_OWN === 'OWNED' && !p.team) return false;
      if (PL_Q && (p.web + ' ' + p.club).toLowerCase().indexOf(PL_Q) < 0) return false;
      return true;
    });

    rows.sort(function(a,b){
      if (PL_SORT === 'ppg') return b.ppg - a.ppg;
      if (PL_SORT === 'val') return playerValue_(b) - playerValue_(a);
      return b.pts - a.pts;
    });

    count.textContent = rows.length + ' player' + (rows.length === 1 ? '' : 's');

    if (!rows.length){
      var n = el('div', null, 'No players match those filters');
      n.style.cssText = 'padding:34px;text-align:center;color:#a3adb7;font-size:12px';
      body.appendChild(n);
      return;
    }

    rows.slice(0, PL_SHOW).forEach(function(p){
      body.appendChild(playerRow_(p, rank, COLS, POSCOL));
    });

    if (rows.length > PL_SHOW){
      var more = el('button', null,
        'Show ' + Math.min(60, rows.length - PL_SHOW) + ' more  \u00b7  '
        + (rows.length - PL_SHOW) + ' left');
      more.style.cssText = 'display:block;width:100%;font:inherit;font-size:11px;'
        + 'font-weight:800;padding:12px;cursor:pointer;background:#f7f9fb;'
        + 'border:none;border-top:0.5px solid #e3e8ee;color:#37003C';
      more.addEventListener('click', function(){ PL_SHOW += 60; draw(); });
      body.appendChild(more);
    }
  }

  inp.addEventListener('input', function(){
    PL_Q = inp.value.toLowerCase();
    PL_SHOW = 60;
    draw();
  });
  draw();
}

/* Points per million. The actual question in a money draft is whether
   somebody was worth what they cost. */
/* The Transfer Player List carries the pool and the ownership; the raw
   sheet carries the rest of the season's numbers. Joining them once at
   boot means the Players table can show points per game, minutes and
   the availability flag without every page doing its own lookup.

   Matched on code where both have one, because element ids are
   reassigned between seasons and the code is not.                    */
function fillPlayerStats_(){
  var st = DATA.stats;
  if (!st || !DATA.players) return;

  var joined = 0;
  DATA.players.forEach(function(p){
    var rec = (p.code && st.byCode[String(p.code)])
      || (p.id && st.byId[String(p.id)])
      || st.byName[String(p.web || '').toLowerCase()];
    if (!rec) return;
    joined++;

    function g(k){
      var v = rec.get(k);
      return v === undefined || v === null || v === '' ? null : v;
    }
    var ppg = g('points_per_game');
    if (ppg !== null) p.ppg = num(ppg);
    if (g('minutes') !== null) p.minutes = num(g('minutes'));
    if (g('starts') !== null) p.starts = num(g('starts'));
    if (g('ict_index') !== null) p.ict = num(g('ict_index'));

    /* availability, so the list can flag a player who has left the
       league before anybody bids on him */
    var chance = g('chance_of_playing_next_round');
    p.chance = chance === null ? 100 : num(chance);
    p.news = String(g('news') || '');
  });

  DATA.statsJoined = joined;
}

function playerValue_(p){
  var fee = num(p.fee);
  return fee > 0 ? p.pts / fee : 0;
}

function playerRow_(p, rank, COLS, POSCOL){
  var chance = playerChance_(p);
  var news = playerNews_(p);
  var gone = chance === 0;
  var doubt = chance !== null && chance > 0 && chance < 100;

  var row = el('div');
  row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:7px 18px;'
    + 'border-bottom:0.5px solid #f2f4f7;cursor:pointer' + (gone ? ';opacity:.62' : '');

  var ph = playerPhoto(p.id, p.web, 28);
  ph.style.flexShrink = '0';
  row.appendChild(ph);

  /* name, with the availability flag in front of it where it cannot
     be missed while scanning */
  var nm = el('span');
  nm.style.cssText = COLS[1][1] + ';display:flex;align-items:center;gap:5px;min-width:0';
  if (gone || doubt){
    var flag = el('span', null, '!');
    flag.style.cssText = 'width:13px;height:13px;flex-shrink:0;display:flex;'
      + 'align-items:center;justify-content:center;font-size:9px;font-weight:900;'
      + 'color:#fff;background:' + (gone ? '#C0392B' : '#E8A317');
    flag.title = news || (gone ? 'Unavailable' : chance + '% chance of playing');
    nm.appendChild(flag);
  }
  /* amber at 50, red at 0, with the reason on hover. Seeing it in the
     list matters more than seeing it on the card - on draft night
     nobody opens a card before they bid. */
  if (p.chance !== undefined && p.chance < 100){
    var flag = el('span', null, '!');
    flag.title = p.news || (p.chance === 0 ? 'Unavailable' : p.chance + '% chance of playing');
    flag.style.cssText = 'width:13px;height:13px;flex-shrink:0;display:flex;'
      + 'align-items:center;justify-content:center;font-size:9px;font-weight:900;'
      + 'color:#fff;background:' + (p.chance === 0 ? '#C0392B' : '#E8A317');
    nm.appendChild(flag);
    if (p.chance === 0) row.style.opacity = '.62';
  }

  nm.appendChild(cell_(p.web,
    'font-size:13px;font-weight:800;color:#0C2340;white-space:nowrap;'
    + 'overflow:hidden;text-overflow:ellipsis'));
  row.appendChild(nm);

  var pc = POSCOL[p.pos] || ['#f1f4f7','#5a6570'];
  var pos = el('span');
  pos.style.cssText = COLS[2][1];
  pos.appendChild(cell_(p.pos,

    || DATA.stats.byId[String(p.id)]);

   League 1 only on the first two. The Audit League has no draft, no

var PORTAL_VIEW = 'draft';
var PO_POS = 'ALL';

/* =====================================================================
   THE LIVE LINK

   The rest of the site reads published CSVs, which Google caches for
   about five minutes. That is fine for a league table and useless on
   draft night, where a signing needs to be on screen while everyone is
   still looking at it.

   So the Portal asks the Apps Script web app directly instead. JSONP
   rather than fetch, because the dashboard is on github.io and the
   script is on script.google.com - a script tag has no cross-origin
   problem to negotiate.

   Set LIVE_URL below to the web app's /exec address. Leave it empty
   and nothing changes: the Portal falls back to the register CSV and
   behaves exactly as it did.
   ===================================================================== */

/* The url is NOT set here. It is typed into USER_TEXT, against the
   key live.url, because a value edited in a 320KB script file can
   take the whole site down over one missing quote - and it did.

   A cell in a sheet cannot do that. The worst a bad url can do now is
   fail to poll. */
function liveUrl_(){
  var u = txt('live.url', '');
  u = String(u || '').trim();
  /* anything that is not obviously a web app address is ignored
     rather than trusted */
  return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(u) ? u : '';
}

var LIVE_EVERY = 4000;
var LIVE_TIMER = null;
var LIVE_SEQ = 0;

function liveOn(){ return !!liveUrl_() && PORTAL_VIEW !== 'audit'; }

function livePoll(){
  if (!liveOn()) return;

  var cb = 'ffsLive' + (++LIVE_SEQ);
  var tag = document.createElement('script');
  var done = false;

  window[cb] = function(data){
    done = true;
    if (data && data.ok){
      DATA.live = data;
      applyLive_(data);
    }
    cleanup();
  };

  function cleanup(){
    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
    if (tag.parentNode) tag.parentNode.removeChild(tag);
  }

  tag.onerror = cleanup;
  var url = liveUrl_();
  tag.src = url + (url.indexOf('?') < 0 ? '?' : '&')
    + 'q=live&cb=' + cb + '&t=' + Date.now();
  document.head.appendChild(tag);

  /* a poll that never answers must not leak a script tag every four
     seconds for the rest of the evening */
  setTimeout(function(){ if (!done) cleanup(); }, LIVE_EVERY * 2);
}

/* Only repaint when something has actually changed, or the page would
   flicker every four seconds all night. */
var LIVE_LAST = '';

function applyLive_(data){
  var stamp = data.register.length + ':' + data.phase;
  if (stamp === LIVE_LAST) return;
  LIVE_LAST = stamp;

  DATA.register = data.register.map(function(r){
    return { ts: r.ts, leagueKey: 'L1', action: String(r.action || '').toUpperCase(),
             elementId: String(r.elementId || ''), player: r.player,
             manager: r.manager, fee: num(r.fee), note: r.note || '' };
  });

  /* ownership follows the register, so the available list is right */
  var owned = {};
  DATA.register.forEach(function(r){
    if (r.action === 'SIGN') owned[r.elementId] = r.manager;
    else if (r.action === 'RELEASE') delete owned[r.elementId];
  });
  (DATA.players || []).forEach(function(p){
    p.team = owned[String(p.id)] || '';
  });

  if (route === 'portal') paintPortal(document.getElementById('p-portal'));
}

function liveStart(){
  if (LIVE_TIMER) clearInterval(LIVE_TIMER);
  if (!liveOn()) return;
  livePoll();
  LIVE_TIMER = setInterval(livePoll, LIVE_EVERY);
}

function liveStop(){
  if (LIVE_TIMER) { clearInterval(LIVE_TIMER); LIVE_TIMER = null; }
}

function renderPortal(){
  var host = document.getElementById('p-portal');

}

/* The subtitle says which phase the workbook is in, so the page is
   honest about whether anything is actually happening. */
function draftSub_(){
  var draft = CONFIG.leagues[0];
  var reg = DATA.register || [];
  var signed = reg.filter(function(r){ return r.action === 'SIGN'; }).length;
  return draft.name.toUpperCase() + '  \u00b7  '
    + (signed ? signed + ' SIGNINGS' : 'NOTHING SIGNED YET');
}

/* Everyone in the draft league, whether they have signed anybody yet
   or not.

   This used to read the Squads sheet first, which lists only managers
   who already have a squad. Before the draft that sheet is empty or
   stale, so the budget board showed one manager instead of twelve -
   and the eleven with nothing signed are exactly the ones you need to
   see on the night.

   The league table has every manager from the moment the raw pull
   runs, so it goes first.                                            */
function draftManagers_(){
  var names = (DATA.table || []).map(function(t){ return t.name; });
  if (names.length) return names;

  var d = DATA.byLeague[CONFIG.leagues[0].key];
  if (d && d.squads && d.squads.summary.length){
    return d.squads.summary.map(function(m){ return m.name; });
  }
  return [];
}

function portalDraftDay_(wrap, host){
  wrap.appendChild(portalTicker_());

  var left = el('div', 'po-left');

/* Built from the register, so it says what actually happened rather
   than anything invented. */
function portalTicker_(){
  var reg = (DATA.register || []).filter(function(r){ return r.action === 'SIGN'; });
  if (!reg.length) return el('span');

  var bits = reg.slice(-8).reverse().map(function(r){
    return r.player + ' to ' + r.manager + ', ' + money_(r.fee);
  });
  var text = bits.join('  \u2022  ') + '  \u2022  ';

  var bar = el('div');
  bar.style.cssText = 'background:' + PO_YELLOW + ';display:flex;align-items:stretch;'
    + 'height:36px;overflow:hidden';

  var tag = el('div', null, 'BREAKING');
  tag.style.cssText = 'background:' + PO_DARK + ';color:' + PO_YELLOW + ';font-size:11px;'
    + 'font-weight:900;letter-spacing:1.4px;display:flex;align-items:center;'
    + 'padding:0 14px;flex-shrink:0';
  bar.appendChild(tag);

  var mask = el('div');
  mask.style.cssText = 'flex:1;overflow:hidden;display:flex;align-items:center';
  var track = el('div', 'po-track');
  /* two identical copies and one transform - the standard pattern.
     The absolute-positioning versions are what used to fight the
     layout, so there is none here. */
  [0,1].forEach(function(){
    var sp = el('span', null, text);
    sp.style.cssText = 'font-size:12px;font-weight:800;color:' + PO_DARK
      + ';white-space:nowrap;padding-right:44px';
    track.appendChild(sp);
  });
  mask.appendChild(track);
  bar.appendChild(mask);
  return bar;
}

    av.textContent = last.manager.substring(0,2).toUpperCase();
  }));
  var ai = av.firstChild;
  if (ai && ai.style) ai.style.cssText = 'width:100%;height:100%;object-fit:cover';
  to.appendChild(av);

  var tt = el('div');
  tt.style.cssText = 'text-align:right';
  tt.appendChild(cell_('SIGNED BY',
    'display:block;font-size:9px;font-weight:800;color:#6b6b6b;letter-spacing:1.1px'));

    'display:block;font-size:16px;font-weight:900;color:#fff;margin-top:1px'));
  tt.appendChild(cell_(money_(last.fee),
    'display:block;font-size:20px;font-weight:900;color:' + PO_YELLOW
    + ';letter-spacing:-.6px;margin-top:1px'));

  row.appendChild(to);

  pad.appendChild(row);
  return pad;
}

/* The board alternates between the slot blocks and the same thing in
   words. Blocks are ambient; the words are what you actually want at
   a glance, so it shows both rather than choosing.                  */
function portalBoard_(){
  var pad = el('div');
  pad.style.cssText = 'padding:14px 17px 8px';

  var head = el('div');
  head.style.cssText = 'display:flex;align-items:center;justify-content:space-between;'
    + 'margin-bottom:11px;gap:10px;flex-wrap:wrap';
  head.appendChild(cell_('SQUAD BOARD',
    'font-size:11px;font-weight:900;letter-spacing:1.3px;color:' + PO_YELLOW));

  var right = el('div');
  right.style.cssText = 'display:flex;align-items:center;gap:10px';
  var leg = el('div');
  leg.style.cssText = 'display:flex;gap:11px;font-size:9px;font-weight:700;color:#6b6b6b';
  right.appendChild(leg);
  var dots = el('div');
  dots.style.cssText = 'display:flex;gap:4px';
  right.appendChild(dots);
  head.appendChild(right);
  pad.appendChild(head);

  var cols = el('div');
  cols.style.cssText = 'display:flex;align-items:center;gap:9px;padding-bottom:8px;'
    + 'border-bottom:1px solid #333;font-size:8px;font-weight:800;letter-spacing:.9px;color:#6b6b6b';
  pad.appendChild(cols);

  var body = el('div');
  pad.appendChild(body);

  var rows = boardRows_();
  var lims = CONFIG.squad ? CONFIG.squad.limits : { GK:2, DEF:5, MID:5, FWD:3 };
  var order = ['GK','DEF','MID','FWD'];

  function draw(){
    clear(leg); clear(cols); clear(body); clear(dots);

    if (PO_BOARD === 0){
      ['SIGNED','#4CAF50','NEEDED',''].length;
      var l1 = el('span');
      l1.style.cssText = 'display:flex;align-items:center;gap:4px';
      var sw = el('span'); sw.style.cssText = 'width:9px;height:9px;background:#4CAF50';
      l1.appendChild(sw); l1.appendChild(cell_('SIGNED'));
      var l2 = el('span');
      l2.style.cssText = 'display:flex;align-items:center;gap:4px';
      var sw2 = el('span'); sw2.style.cssText = 'width:9px;height:9px;border:1px solid #4a4a4a';
      l2.appendChild(sw2); l2.appendChild(cell_('NEEDED'));
      leg.appendChild(l1); leg.appendChild(l2);

      cols.appendChild(cell_('', 'width:34px'));
      cols.appendChild(cell_('TEAM', 'flex:1'));
      order.forEach(function(pos){
        cols.appendChild(cell_(pos,
          'width:' + ((lims[pos] || 3) * 12 + 6) + 'px;text-align:center'));
      });
      cols.appendChild(cell_('REMAINING', 'width:66px;text-align:right'));
      cols.appendChild(cell_('SQUAD', 'width:44px;text-align:right'));
    } else {
      leg.appendChild(cell_('STILL TO SIGN'));
      cols.appendChild(cell_('', 'width:34px'));
      cols.appendChild(cell_('TEAM', 'width:84px'));
      cols.appendChild(cell_('REQUIREMENTS', 'flex:1'));
      cols.appendChild(cell_('REMAINING', 'width:66px;text-align:right'));
      cols.appendChild(cell_('SQUAD', 'width:44px;text-align:right'));
    }

    rows.forEach(function(t){
      var kit = kitFor(t.name);
      var done = t.count >= (CONFIG.squad ? CONFIG.squad.size : 15);

      var row = el('div');
      row.style.cssText = 'display:flex;align-items:center;gap:9px;height:42px;'
        + 'border-bottom:1px solid #2b2b2b' + (done ? ';opacity:.72' : '');

      var av = el('span');
      av.style.cssText = 'width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;'
        + 'background:' + kit.main + ';color:' + kit.text + ';display:flex;align-items:center;'
        + 'justify-content:center;font-size:11px;font-weight:900';
      av.appendChild(imgTry(CONFIG.img.manager(t.name), function(){
        av.textContent = t.name.substring(0,2).toUpperCase();
      }));
      var ai = av.firstChild;
      if (ai && ai.style) ai.style.cssText = 'width:100%;height:100%;object-fit:cover';
      row.appendChild(av);

      if (PO_BOARD === 0){
        row.appendChild(cell_(t.name,
          'flex:1;font-size:14px;font-weight:800;color:#fff;white-space:nowrap;'
          + 'overflow:hidden;text-overflow:ellipsis'));
        order.forEach(function(pos){
          var cap = lims[pos] || 3, got = t.by[pos] || 0;
          var slot = el('span');
          slot.style.cssText = 'width:' + (cap * 12 + 6) + 'px;text-align:center;'
            + 'display:inline-flex;gap:3px;justify-content:center';
          for (var k = 0; k < cap; k++){
            var b = el('span');
            b.style.cssText = 'width:9px;height:14px;box-sizing:border-box;'
              + (k < got ? 'background:#4CAF50' : 'border:1px solid #545454');
            slot.appendChild(b);
          }
          row.appendChild(slot);
        });
      } else {
        row.appendChild(cell_(t.name,
          'width:84px;font-size:14px;font-weight:800;color:#fff;white-space:nowrap'));
        var need = [];
        order.forEach(function(pos){
          var cap = lims[pos] || 3, got = t.by[pos] || 0;
          if (got < cap) need.push((cap - got) + ' ' + pos);
        });
        row.appendChild(cell_(done ? 'Squad complete' : need.join('  \u00b7  '),
          'flex:1;font-size:12px;font-weight:700;color:' + (done ? '#4CAF50' : '#F5A800')
          + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis'));
      }

      row.appendChild(cell_(t.left === null ? '\u2013' : t.left.toFixed(1) + 'm',
        'width:66px;text-align:right;font-size:15px;font-weight:900;color:' + moneyCol_(t.left)));
      row.appendChild(cell_(t.count + '/' + (CONFIG.squad ? CONFIG.squad.size : 15),
        'width:44px;text-align:right;font-size:12px;font-weight:800;color:'
        + (done ? '#4CAF50' : '#8a8a8a')));
      body.appendChild(row);
    });

    [0,1].forEach(function(i){
      var d = el('span');
      d.style.cssText = 'width:16px;height:3px;cursor:pointer;background:'
        + (i === PO_BOARD ? PO_YELLOW : '#4a4a4a');
      d.addEventListener('click', function(){
        PO_BOARD = i;
        if (PO_BOARD_TIMER) { clearInterval(PO_BOARD_TIMER); PO_BOARD_TIMER = null; }
        draw();
      });
      dots.appendChild(d);
    });
  }

  draw();
  PO_BOARD_TIMER = setInterval(function(){
    PO_BOARD = (PO_BOARD + 1) % 2;
    draw();
  }, 5000);

  return pad;
}

/* Money left and slots filled, per manager, out of the Squads sheet -
   which already knows the fees, the positions and the budget. */
/* Squads built from the register, not from the Squads sheet.

   The Squads sheet is a derived thing that rebuilds when the workbook
   is told to. On draft night that is far too slow - a signing appeared
   in the feed and the manager's budget did not move, because the board
   was reading a sheet last built that morning.

   The register is the source of truth for who owns whom, so the board
   is built from it directly. Position and club come from the player
   pool by element id; the fee comes from the register row.

   Falls back to the Squads sheet only when there is no register at
   all, which is the rest of the year.                                */
function liveSquads_(){
  var budget = CONFIG.squad ? CONFIG.squad.budget : 100;
  var reg = DATA.register || [];

  var pos = {};
  (DATA.players || []).forEach(function(p){ pos[String(p.id)] = p.pos; });

  var out = {};
  draftManagers_().forEach(function(n){
    out[n] = { name: n, by: { GK:0, DEF:0, MID:0, FWD:0 },
               count: 0, spent: 0, players: [] };
  });

  if (reg.length){
    /* replayed in order, so a release genuinely gives the money back
       and a re-signing lands on the new owner */
    var held = {};
    reg.forEach(function(r){
      var id = String(r.elementId || '');
      if (!id) return;
      if (r.action === 'SIGN') held[id] = { manager: r.manager, fee: num(r.fee), player: r.player };
      else if (r.action === 'RELEASE') delete held[id];
    });

    Object.keys(held).forEach(function(id){
      var h = held[id];
      var m = out[h.manager];
      if (!m) return;
      var p = pos[id] || '';
      if (m.by[p] !== undefined) m.by[p]++;
      m.count++;
      m.spent += h.fee;
      m.players.push({ id: id, name: h.player, pos: p, fee: h.fee });
    });
  } else {
    /* no register loaded - fall back to the sheet */
    var d = DATA.byLeague[CONFIG.leagues[0].key];
    var sq = d && d.squads;
    if (sq) draftManagers_().forEach(function(n){
      var mine = sq.byManager[n];
      if (!mine) return;
      mine.players.forEach(function(p){
        if (out[n].by[p.pos] !== undefined) out[n].by[p.pos]++;
        out[n].count++;
        if (p.fee !== null) out[n].spent += p.fee;
        out[n].players.push(p);
      });
    });
  }

  Object.keys(out).forEach(function(n){
    out[n].left = Math.round((budget - out[n].spent) * 10) / 10;
  });
  return out;
}

function boardRows_(){
  var sq = liveSquads_();
  return Object.keys(sq).map(function(n){ return sq[n]; })
    .sort(function(a,b){ return a.left - b.left || a.name.localeCompare(b.name); });
}

function moneyCol_(v){
  if (v === null) return '#8a8a8a';
  return v < 3 ? '#E85C6A' : v < 10 ? '#F5A800' : '#4CAF50';
}

function money_(v){
  return '\u00a3' + (Math.round(num(v) * 10) / 10).toFixed(1) + 'm';
}

function ago_(ts){
  if (!ts) return '';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  var mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' minute' + (mins === 1 ? '' : 's') + ' ago';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ' + (mins % 60) + 'm ago';
  return d.toISOString().slice(0, 10);
}

/* Latest, or biggest fees. A manual toggle rather than a rotation -
   the board rotates because it is ambient, but you come to the feed
   deliberately and it should not move under you. */
function portalFeed_(host){
  var pad = el('div');
  pad.style.cssText = 'padding:12px 17px 22px';

  var head = el('div');
  head.style.cssText = 'display:flex;align-items:center;justify-content:space-between;'
    + 'margin-bottom:10px;gap:10px;flex-wrap:wrap';
  var title = el('div');
  title.style.cssText = 'font-size:11px;font-weight:900;letter-spacing:1.3px;color:' + PO_YELLOW;
  head.appendChild(title);

  var btns = el('div');
  btns.style.cssText = 'display:flex;gap:3px';
  head.appendChild(btns);
  pad.appendChild(head);

  var body = el('div');
  pad.appendChild(body);

  var reg = (DATA.register || []).filter(function(r){ return r.action === 'SIGN'; });
  var pool = {};
  (DATA.players || []).forEach(function(p){ pool[String(p.id)] = p; });

  function draw(){
    title.textContent = PO_FEED === 0 ? 'LATEST' : 'BIGGEST FEES';
    clear(btns); clear(body);

    ['LATEST','BIGGEST'].forEach(function(l, i){
      var on = PO_FEED === i;
      var b = el('button', null, l);
      b.style.cssText = 'font:inherit;font-size:9px;font-weight:800;letter-spacing:.7px;'
        + 'padding:5px 10px;cursor:pointer;border:1px solid ' + (on ? PO_YELLOW : '#3d3d3d')
        + ';background:' + (on ? PO_YELLOW : 'transparent')
        + ';color:' + (on ? PO_DARK : '#8a8a8a');
      b.addEventListener('click', function(){ PO_FEED = i; draw(); });
      btns.appendChild(b);
    });

    if (!reg.length){
      var n = el('div', null, 'Nothing signed yet.');
      n.style.cssText = 'padding:18px 0;color:#6b6b6b;font-size:12px';
      body.appendChild(n);
      return;
    }

    var list = reg.slice();
    if (PO_FEED === 0) list.reverse();
    else list.sort(function(a,b){ return num(b.fee) - num(a.fee); });

    list.slice(0, 12).forEach(function(r, i){
      var kit = kitFor(r.manager);
      var p = pool[String(r.elementId)];

      var row = el('div');
      row.style.cssText = 'display:flex;align-items:center;gap:10px;height:40px;'
        + 'border-bottom:1px solid #2b2b2b';

      row.appendChild(cell_(PO_FEED === 0 ? ago_(r.ts).replace(' ago','') : String(i + 1),
        'width:46px;flex-shrink:0;font-size:' + (PO_FEED === 0 ? '10px' : '15px')
        + ';font-weight:' + (PO_FEED === 0 ? '700' : '900') + ';color:'
        + (PO_FEED === 1 && i < 3 ? PO_YELLOW : PO_FEED === 0 ? '#6b6b6b' : '#5a5a5a')
        + ';letter-spacing:-.4px'));

      var ph = playerPhoto(r.elementId, r.player, 30);
      ph.style.flexShrink = '0';
      row.appendChild(ph);
      clickable_(row, r.elementId, r.player);

      var t = el('span');
      t.style.cssText = 'flex:1;min-width:0';
      t.appendChild(cell_(r.player,
        'display:block;font-size:13px;font-weight:800;color:#fff;white-space:nowrap;'
        + 'overflow:hidden;text-overflow:ellipsis'));
      t.appendChild(cell_(p ? p.club + '  \u00b7  ' + p.pts + ' pts' : '',
        'display:block;font-size:9px;color:#7a7a7a'));
      row.appendChild(t);

      var to = el('span');
      to.style.cssText = 'display:flex;align-items:center;gap:8px;flex-shrink:0';
      var av = el('span');
      av.style.cssText = 'width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0;'
        + 'background:' + kit.main + ';color:' + kit.text + ';display:flex;align-items:center;'
        + 'justify-content:center;font-size:8px;font-weight:900';
      av.appendChild(imgTry(CONFIG.img.manager(r.manager), function(){
        av.textContent = r.manager.substring(0,2).toUpperCase();
      }));
      var ai = av.firstChild;
      if (ai && ai.style) ai.style.cssText = 'width:100%;height:100%;object-fit:cover';
      to.appendChild(av);
      to.appendChild(cell_(r.manager,
        'font-size:12px;font-weight:800;color:#d8d8d8;white-space:nowrap'));
      row.appendChild(to);

      row.appendChild(cell_(money_(r.fee),
        'width:60px;text-align:right;flex-shrink:0;font-size:14px;font-weight:900;color:' + PO_YELLOW));
      body.appendChild(row);
    });
  }

  draw();
  return pad;
}


/* =====================================================================
   SQUADS
   Every slot shown whether it is filled or not, so the empty ones are
   the story - on the night you are watching dashes turn into names.
   ===================================================================== */

function portalSquads_(wrap){
  /* the same live source as the budget board - the Squads sheet is
     rebuilt on a schedule and on the night that is far too slow */
  var live = liveSquads_();
  var anyone = Object.keys(live).some(function(n){ return live[n].count > 0; });

  if (!anyone){
    wrap.appendChild(portalNote_(txt('empty.squad',
      'No squads yet. They appear as soon as the first player is signed.')));
    return;
  }

  var lims = CONFIG.squad ? CONFIG.squad.limits : { GK:2, DEF:5, MID:5, FWD:3 };
  var order = ['GK','DEF','MID','FWD'];
  var budget = CONFIG.squad ? CONFIG.squad.budget : 100;

  var grid = el('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));'
    + 'gap:10px;padding:16px';

  draftManagers_().forEach(function(name){
    var mine = live[name];
    var kit = kitFor(name);
    var by = {};
    order.forEach(function(p){ by[p] = []; });
    var spent = 0;
    if (mine) mine.players.forEach(function(p){
      if (by[p.pos]) by[p.pos].push(p);
      if (p.fee !== null) spent += p.fee;
    });
    var count = mine ? mine.players.length : 0;

    var card = el('div');
    card.style.cssText = 'background:' + PO_PANEL;

    var head = el('div');
    head.style.cssText = 'display:flex;align-items:center;gap:10px;padding:11px 12px;'
      + 'background:' + kit.main + ';color:' + kit.text;
    var av = el('span');
    av.style.cssText = 'width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;'
      + 'background:rgba(255,255,255,.28);display:flex;align-items:center;'
      + 'justify-content:center;font-size:11px;font-weight:900';
    av.appendChild(imgTry(CONFIG.img.manager(name), function(){
      av.textContent = name.substring(0,2).toUpperCase();
    }));
    var ai = av.firstChild;
    if (ai && ai.style) ai.style.cssText = 'width:100%;height:100%;object-fit:cover';
    head.appendChild(av);
    head.appendChild(cell_(name,
      'flex:1;font-size:16px;font-weight:900;letter-spacing:-.3px'));
    var hr = el('span');
    hr.style.cssText = 'text-align:right';
    hr.appendChild(cell_((Math.round((budget - spent) * 10) / 10).toFixed(1) + 'm',
      'display:block;font-size:15px;font-weight:900;letter-spacing:-.4px'));
    hr.appendChild(cell_(count + '/' + (CONFIG.squad ? CONFIG.squad.size : 15),
      'display:block;font-size:8px;font-weight:800;letter-spacing:1px;opacity:.8'));
    head.appendChild(hr);
    card.appendChild(head);

    order.forEach(function(pos){
      var cap = lims[pos] || 3, got = by[pos];
      var sub = 0;
      got.forEach(function(p){ if (p.fee !== null) sub += p.fee; });

      var ph = el('div');
      ph.style.cssText = 'display:flex;align-items:center;gap:7px;padding:8px 12px 4px';
      ph.appendChild(cell_(pos,
        'font-size:9px;font-weight:900;letter-spacing:1.2px;width:26px;color:'
        + (PO_POSCOL[pos] || '#8a8a8a')));
      ph.appendChild(cell_(got.length + '/' + cap,
        'font-size:9px;font-weight:700;color:' + (got.length === cap ? '#4CAF50' : '#6b6b6b')));
      var ln = el('span'); ln.style.cssText = 'flex:1;height:1px;background:#333';
      ph.appendChild(ln);
      ph.appendChild(cell_(sub ? sub.toFixed(1) + 'm' : '',
        'font-size:10px;font-weight:800;color:#6b6b6b'));
      card.appendChild(ph);

      for (var i = 0; i < cap; i++){
        var p = got[i];
        var row = el('div');
        row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:4px 12px'
          + (p ? '' : ';opacity:.4');

        if (p){
          var pp = playerPhoto(null, p.name, 20);
          pp.style.flexShrink = '0';
          row.appendChild(pp);
          clickable_(row, null, p.name);
        } else {
          var dot = el('span');
          dot.style.cssText = 'width:20px;height:20px;border-radius:50%;flex-shrink:0;'
            + 'border:1px dashed #4a4a4a';
          row.appendChild(dot);
        }

        row.appendChild(cell_(p ? p.name : '\u2013',
          'flex:1;min-width:0;font-size:12px;font-weight:' + (p ? '700' : '500')
          + ';color:' + (p ? '#fff' : '#5a5a5a')
          + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis'));
        row.appendChild(cell_(p ? p.club : '',
          'width:34px;font-size:10px;font-weight:700;color:#7a7a7a;flex-shrink:0'));
        row.appendChild(cell_(p && p.fee !== null ? p.fee.toFixed(1) + 'm' : '',
          'width:44px;text-align:right;font-size:12px;font-weight:800;color:#d8d8d8;flex-shrink:0'));
        card.appendChild(row);
      }
    });

    var tot = el('div');
    tot.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 12px;'
      + 'margin-top:6px;border-top:2px solid ' + PO_YELLOW;
    tot.appendChild(cell_('TOTAL',
      'flex:1;font-size:12px;font-weight:900;letter-spacing:1.3px;color:' + PO_YELLOW));
    tot.appendChild(cell_('', 'width:34px'));
    tot.appendChild(cell_(money_(spent),
      'width:44px;text-align:right;font-size:15px;font-weight:900;color:' + PO_YELLOW));
    card.appendChild(tot);

    grid.appendChild(card);
  });

  wrap.appendChild(grid);
}


/* =====================================================================
   AUDIT LEAGUE
   A shell until RAW_Transactions exists. The FPL Draft API has an
   endpoint that gives every waiver and free agent move with both
   sides, the gameweek and whether it went through - which is exactly
   this page. Until that is pulled into the workbook there is nothing
   honest to show, so it says so.
   ===================================================================== */

function portalAudit_(wrap){
  wrap.appendChild(portalNote_('Weekly moves appear here once the transactions pull is '
    + 'added to the workbook. The Audit League trades through FPL rather than a draft, '
    + 'so there are no fees and no budget - just who picked up whom, and when.'));
}

function portalNote_(text){
  var n = el('div');
  n.style.cssText = 'margin:18px;padding:18px 20px;background:' + PO_PANEL
    + ';border-left:3px solid ' + PO_YELLOW + ';font-size:13px;line-height:1.6;'
    + 'color:#b8b8b8;max-width:640px';
  n.textContent = text;
  return n;
}

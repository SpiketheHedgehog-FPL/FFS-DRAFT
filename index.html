      + 'align-items:center;justify-content:center;color:#EDEFF2;font-size:15px;font-weight:800;flex-shrink:0;overflow:hidden';
    var aim = imgTry(CONFIG.img.manager(win.name), function(){ av.textContent = win.name.substring(0,2); });
    aim.style.cssText='width:100%;height:100%;object-fit:cover';
    av.appendChild(aim);
    pnl.appendChild(av);
    var m = el('div'); m.style.flex='1';
    var l = el('div', null, 'WINNERS OF THE FFS CUP');
    l.style.cssText='font-size:8px;font-weight:900;letter-spacing:2.2px;color:#5C646E';
    var nm = el('div', null, win.name.toUpperCase());
    nm.style.cssText='font-size:27px;font-weight:900;color:#22262B;letter-spacing:-.9px;line-height:1.05;margin-top:1px';
    m.appendChild(l); m.appendChild(nm);
    pnl.appendChild(m);
    var tro = el('div');
    tro.style.cssText='width:56px;height:56px;border:1px dashed #8A929C;display:flex;align-items:center;justify-content:center;'
      + 'flex-shrink:0;font-size:6px;font-weight:800;letter-spacing:.7px;color:#5C646E;overflow:hidden';
    var tim = document.createElement('img');
    tim = imgTry(CONFIG.img.trophy('cup'), null);
    tim.style.cssText='width:100%;height:100%;object-fit:contain';
    tim.addEventListener('error', function(){ if(tim.parentNode) tim.parentNode.removeChild(tim); tro.textContent='TROPHY'; });
    tro.appendChild(tim);
    pnl.appendChild(tro);
    var r = el('div'); r.style.textAlign='right';
    var nt = el('div', null, win.note || '');
    nt.style.cssText='font-size:11px;font-weight:800;letter-spacing:.6px;color:#5C646E';

/* =====================================================================
   SQUADS
   ===================================================================== */
var MGR = { name: null, view: 'squad' };

/* =====================================================================
   MANAGERS

   One page per manager, in their own kit: who they have, who they play
   next, everything they have played, and their record against every
   other manager whichever competition the meetings happened in.

   The kit does the work. The header block is their Main with their
   Text on it, the competitions panel is their Second with their 4th,
   and the trim beneath inverts the two so it reads as kit trim rather
   than a divider. Everything below stays white, because a fifteen row
   table needs somewhere calm to sit.
   ===================================================================== */

var MGR_VIEWS = [['squad','Squad'],['next','Next up'],['fix','Fixtures'],
                 ['res','Results'],['rec','Record']];

function renderManagers(){
  var host = document.getElementById('p-managers');
  if (loaded.managers) return;
  loaded.managers = true;
  paintManagers(host);
}

function paintManagers(host){
  clear(host);

  var data = (DATA.byLeague[LEAGUE.key] || {}).squads;
  var names = data && data.summary.length
    ? data.summary.map(function(m){ return m.name; })
    : ((DATA.table || []).map(function(t){ return t.name; }));

  if (!names.length){
    var note = el('div','note');
    note.style.margin = '28px 24px';
    note.textContent = 'No managers yet. They appear once the raw pull has run.';
    host.appendChild(note);
    return;
  }

  if (!MGR.name || names.indexOf(MGR.name) < 0) MGR.name = names[0];
  var kit = kitFor(MGR.name);
  var sum = data && data.byManager[MGR.name] ? data.byManager[MGR.name].summary : null;

  host.appendChild(mgrPicker(names, host));
  host.appendChild(mgrHeader(kit, sum));
  host.appendChild(mgrTabs(kit, host));
  host.appendChild(mgrTiles(kit, sum));

  var body = el('div');
  body.style.cssText = 'padding:2px 24px 36px';
  host.appendChild(body);

  if (MGR.view === 'squad')      mgrSquad(body, data);
  else if (MGR.view === 'next')  mgrNext(body);
  else if (MGR.view === 'fix')   mgrList(body, false);
  else if (MGR.view === 'res')   mgrList(body, true);
  else                           mgrRecord(body);
}

/* ---- the picker: a row of names, not a dropdown ---- */
function mgrPicker(names, host){
  var bar = el('div');
  bar.style.cssText = 'display:flex;align-items:center;gap:6px;flex-wrap:wrap;'

/* Where they stand in each competition. The Copa is a status, not a
   position - nobody has a fixture in it until two managers do.     */
function mgrCompStandings(){
  var out = [];
  var lt = (DATA.table || []).filter(function(t){ return t.name === MGR.name; })[0];
  out.push(['Overall league', lt ? ordinal(lt.pos) : '\u2013']);

  var h = DATA.h2h && DATA.h2h.table
    ? DATA.h2h.table.filter(function(t){ return t.name === MGR.name; })[0] : null;
  out.push(['Head to Head', h ? ordinal(h.pos) : '\u2013']);

  var cupPos = null;
  if (DATA.cup){
    ['a','b'].forEach(function(g){
      (DATA.cup[g] || []).forEach(function(t, i){
        if (t.name === MGR.name) cupPos = ordinal(i+1) + ' ' + g.toUpperCase();
      });
    });
  }
  out.push([LEAGUE.cupName || 'Cup', cupPos || '\u2013']);

  var sl = DATA.superliga && DATA.superliga.groups
    ? flatFind(DATA.superliga, MGR.name) : null;
  out.push(['SuperLiga', sl ? ordinal(sl.pos) : '\u2013']);

  return out;
}

function flatFind(g, name){
  var hit = null;
  Object.keys(g.groups || {}).forEach(function(k){
    (g.groups[k] || []).forEach(function(t, i){
      if (t.name === name && !hit) hit = { pos: i+1, group: k };
    });
  });
  return hit;
}

/* ---- five tiles, alternating main and second ---- */
function mgrTiles(kit, sum){
  var fx = managerFixtures(MGR.name).filter(function(f){ return f.played; });
  var best = 0, total = 0;
  var sc = DATA.scores[MGR.name] || {};
  var weeks = Object.keys(sc);
  weeks.forEach(function(g){ var v = num(sc[g]); total += v; if (v > best) best = v; });
  var avg = weeks.length ? Math.round(total / weeks.length) : 0;
  var spend = sum && sum.spent !== null && sum.spent !== undefined ? sum.spent : null;

  var vals = [
    [String(total), 'POINTS'],
    [String(best), 'BEST GW'],
    [String(avg), 'AVERAGE'],
    [spend === null ? '\u2013' : spend.toFixed(1) + 'm', 'SPEND'],
    [spend ? (total / spend).toFixed(1) : '\u2013', 'PTS PER \u00a3M']
  ];

  var g = el('div');
  g.style.cssText = 'margin:14px 24px 10px;display:grid;'
    + 'grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px';
  vals.forEach(function(v, i){
    var odd = i % 2 === 1;
    var d = el('div');
    d.style.cssText = 'padding:11px 12px;background:' + (odd ? kit.second : kit.main)
      + ';color:' + (odd ? kit.fourth : kit.text);
    var b = el('div', null, v[0]);
    b.style.cssText = 'font-size:19px;font-weight:800;letter-spacing:-.6px';
    var l = el('div', null, v[1]);
    l.style.cssText = 'font-size:9px;font-weight:700;letter-spacing:1px;opacity:.78;margin-top:3px';
    d.appendChild(b); d.appendChild(l);
    g.appendChild(d);
  });
  return g;
}

function recordAgainst(opp, comp){
  var r = { p:0, w:0, d:0, l:0 };
  managerFixtures(MGR.name).forEach(function(f){
    if (f.opp !== opp || !f.played) return;
    if (comp && f.comp !== comp) return;
    r.p++;
    if (f.result === 'W') r.w++; else if (f.result === 'L') r.l++; else r.d++;
  });
  return r;
}

  lbl.appendChild(cell_(MGR.name.toUpperCase() + ' WINS'));
  lbl.appendChild(cell_('DRAWN'));
  lbl.appendChild(cell_(r.opp.toUpperCase() + ' WINS'
    + (oc.using === 'main' ? '' : '  \u00b7  ' + oc.using.toUpperCase())));
  card.appendChild(lbl);

  var fh = el('div');
  fh.style.cssText = 'display:flex;gap:8px;padding:8px 15px 5px;border-top:0.5px solid #e3e8ee;'
    + 'font-size:9px;font-weight:700;letter-spacing:.8px;color:#8a939c';
  [['COMPETITION','flex:1'],['ROUND','width:96px'],['GW','width:44px'],
   ['SCORE','width:64px;text-align:right'],['','width:22px']].forEach(function(c){
    fh.appendChild(cell_(c[0], c[1]));
  });
  card.appendChild(fh);

  r.fx.forEach(function(f){
    var row = el('div');
    row.style.cssText = 'display:flex;gap:8px;padding:6px 15px;font-size:12px;'
      + 'align-items:center;border-top:0.5px solid #f2f4f7';
    row.appendChild(cell_(f.comp, 'flex:1;color:#0C2340'));
    row.appendChild(cell_(f.stage || '', 'width:96px;font-size:11px;color:#8a939c'));
    row.appendChild(cell_('GW' + f.gw, 'width:44px;font-size:11px;color:#8a939c'));
    row.appendChild(cell_(f.mine + ' - ' + f.theirs, 'width:64px;text-align:right;color:#5a6570'));
    var mk = el('span');
    mk.style.cssText = 'width:22px;display:flex;justify-content:flex-end';
    var blk = el('span');
    blk.style.cssText = 'width:9px;height:16px;background:'
      + (f.result === 'W' ? kit.main : f.result === 'L' ? oc.bg : '#B4B2A9');
    mk.appendChild(blk);
    row.appendChild(mk);
    card.appendChild(row);
  });

  return card;
}

function cell_(text, css){
  var sp = el('span', null, text === undefined ? '' : text);
  if (css) sp.style.cssText = css;
  return sp;
}

function note_(text){
  var n = el('div','note', text);
  n.style.cssText = 'margin:24px 0;font-size:13px;color:#5a6570';
  return n;
}

/* =====================================================================
   PLAYERS
   ===================================================================== */
var plPos = 'ALL', plOwn = 'ALL', plQ = '', plSort = 'pts', plLimit = 60;
var PPC = { GK:['#eef6ff','#1d4ed8'], DEF:['#effaf1','#15803d'], MID:['#fffbeb','#a16207'], FWD:['#fff1f3','#be123c'] };

function renderPlayers(){
  var host = document.getElementById('p-players');
  if (loaded.players) return;
  if (!DATA.players || !DATA.players.length){
    clear(host); host.appendChild(el('div','err','Could not load the Transfer Player List sheet.')); return;
  }
  loaded.players = true;
  clear(host);

  var rank = {};
  ['GK','DEF','MID','FWD'].forEach(function(pp){
    DATA.players.filter(function(p){ return p.pos === pp; })
      .sort(function(a,b){ return b.pts - a.pts; })
      .forEach(function(p, i){ rank[p.id] = i + 1; });
  });

  var mast = el('div','pl-mast');
  var L = el('div','l');
  L.appendChild(el('div','k','SEASON ' + CONFIG.season));
  L.appendChild(el('h2', null, 'Players'));
  L.appendChild(el('div','s','Every player in the game, ranked and priced.'));
  mast.appendChild(L);
  var slot = el('div','pl-slot','IMAGE SLOT');
  mast.appendChild(slot);
  host.appendChild(mast);

  var trim = el('div','pl-trim');
  ['#04F5FF','#00FF87','#E90052'].forEach(function(c){
    var sp = el('span'); sp.style.cssText = 'flex:1;background:'+c; trim.appendChild(sp);
  });
  host.appendChild(trim);

  var filters = el('div','pl-filters');
  var r1 = el('div'); r1.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:9px';
  var srch = el('div','pl-search');
  var inp = document.createElement('input');
  inp.placeholder = 'Search player or club';
  srch.appendChild(inp);
  r1.appendChild(srch);
  var pills = el('div','pl-pills');
  ['ALL','GK','DEF','MID','FWD'].forEach(function(v){
    var b = document.createElement('button'); b.textContent = v; b.setAttribute('data-p', v);
    if (v === 'ALL') b.className = 'on';
    pills.appendChild(b);
  });
  r1.appendChild(pills);
  filters.appendChild(r1);

  var r2 = el('div'); r2.style.cssText = 'display:flex;gap:6px;align-items:center';
  var owns = el('div','pl-pills');
  ['ALL','AVAILABLE','OWNED'].forEach(function(v){
    var b = document.createElement('button'); b.textContent = v; b.setAttribute('data-o', v);
    if (v === 'ALL') b.className = 'on';
    owns.appendChild(b);
  });
  r2.appendChild(owns);
  var spacer = el('span'); spacer.style.flex = '1'; r2.appendChild(spacer);
  var count = el('span'); count.style.cssText = 'font-size:10px;font-weight:700;color:var(--ink3)';
  r2.appendChild(count);
  var sortLbl = el('span', null, 'Sort:'); sortLbl.style.cssText = 'font-size:10px;font-weight:600;color:var(--ink3)';
  r2.appendChild(sortLbl);
  var sorts = el('div','pl-sort'); sorts.style.display = 'flex'; sorts.style.gap = '3px';
  [['pts','PTS'],['ppg','PPG'],['val','VALUE']].forEach(function(v){
    var b = document.createElement('button'); b.textContent = v[1]; b.setAttribute('data-s', v[0]);
    if (v[0] === 'pts') b.className = 'on';
    sorts.appendChild(b);
  });
  r2.appendChild(sorts);
  filters.appendChild(r2);
  host.appendChild(filters);

  var tbl = el('div','pl-tbl');
  var head = el('div','plh');
  [['',24],['PLAYER',80],['POS',30],['RANK',30],['CLUB',30],['FEE',34],['PTS',30],['PPG',28],['G',18],['A',18],['CS',22],['BON',24],['VAL',30],['OWNER',70]]
    .forEach(function(c){
      var sp = el('span', null, c[0]);
      sp.style.width = c[1] + 'px';
      if (['PTS','PPG','G','A','CS','BON','VAL','FEE','RANK'].indexOf(c[0]) >= 0) sp.style.textAlign = 'right';
      if (c[0] === 'OWNER') sp.style.textAlign = 'right';
      head.appendChild(sp);
    });
  tbl.appendChild(head);
  var rowsHost = el('div');
  tbl.appendChild(rowsHost);
  host.appendChild(tbl);

  var moreWrap = el('div','pl-more');
  var moreBtn = document.createElement('button');
  moreWrap.appendChild(moreBtn);
  host.appendChild(moreWrap);

  function paint(){
    var list = DATA.players.filter(function(p){
      if (plPos !== 'ALL' && p.pos !== plPos) return false;
      if (plOwn === 'AVAILABLE' && p.team) return false;
      if (plOwn === 'OWNED' && !p.team) return false;
      if (plQ && (p.web + ' ' + p.club + ' ' + p.team).toLowerCase().indexOf(plQ) < 0) return false;
      return true;
    });
    list.sort(function(a,b){
      if (plSort === 'pts') return b.pts - a.pts;
      if (plSort === 'ppg') return (b.pts/38) - (a.pts/38);
      return (b.fee ? b.pts/b.fee : 0) - (a.fee ? a.pts/a.fee : 0);
    });
    count.textContent = list.length + ' players';
    clear(rowsHost);
    list.slice(0, plLimit).forEach(function(p){
      var row = el('div','plr');
      row.appendChild(playerPhoto(p.id, p.web, 24));
      var nm = el('span','pl-nm', p.web); row.appendChild(nm);
      var pw = el('span'); pw.style.width = '30px';
      var pill = el('span','pp', p.pos);
      var pc = PPC[p.pos] || ['#f2f4f7','#5a6570'];
      pill.style.background = pc[0]; pill.style.color = pc[1];
      pw.appendChild(pill); row.appendChild(pw);
      var rk = el('span','pl-n', String(rank[p.id] || '-'));
      rk.style.width='30px'; rk.style.fontWeight='700';
      rk.style.color = (rank[p.id] || 99) <= 3 ? '#37003C' : 'var(--ink3)';
      row.appendChild(rk);
      var cl = el('span','pl-n', p.club); cl.style.width='30px'; cl.style.textAlign='left'; row.appendChild(cl);
      var fee = el('span','pl-n', p.fee ? p.fee.toFixed(1) : '-'); fee.style.width='34px'; row.appendChild(fee);
      var pts = el('span','pl-n', String(p.pts));
      pts.style.cssText = 'width:30px;text-align:right;font-size:13px;font-weight:800;color:#37003C';
      row.appendChild(pts);
      [[ (p.pts/38).toFixed(1),28],[p.goals,18],[p.assists,18],[p.cs,22],[p.bonus||0,24]].forEach(function(c){
        var sp = el('span','pl-n', String(c[0])); sp.style.width = c[1]+'px'; row.appendChild(sp);
      });
      var val = el('span','pl-n', p.fee ? (p.pts/p.fee).toFixed(1) : '-');
      val.style.cssText = 'width:30px;text-align:right;font-weight:700;color:#E90052';
      row.appendChild(val);
      var own = el('span','pl-own');
      var dot = el('i');
      var kit = CONFIG.managers[p.team];
      dot.style.background = p.team ? (kit ? kit.body : '#8a939c') : '#00A85A';
      own.appendChild(dot);
      var ot = el('span', null, p.team || 'Available');
      ot.style.color = p.team ? 'var(--ink2)' : '#00A85A';
      ot.style.whiteSpace='nowrap'; ot.style.overflow='hidden'; ot.style.textOverflow='ellipsis';
      own.appendChild(ot);
      row.appendChild(own);
      rowsHost.appendChild(row);
    });
    if (list.length > plLimit){
      moreBtn.textContent = 'Show more (' + (list.length - plLimit) + ' remaining)';
      moreWrap.style.display = 'block';
    } else {
      moreWrap.style.display = 'none';
    }
  }

  pills.addEventListener('click', function(e){
    var b = e.target.closest('button[data-p]'); if (!b) return;
    pills.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); plPos = b.getAttribute('data-p'); plLimit = 60; paint();
  });
  owns.addEventListener('click', function(e){
    var b = e.target.closest('button[data-o]'); if (!b) return;
    owns.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); plOwn = b.getAttribute('data-o'); plLimit = 60; paint();
  });
  sorts.addEventListener('click', function(e){
    var b = e.target.closest('button[data-s]'); if (!b) return;
    sorts.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); plSort = b.getAttribute('data-s'); paint();
  });
  inp.addEventListener('input', function(){ plQ = inp.value.toLowerCase(); plLimit = 60; paint(); });
  moreBtn.addEventListener('click', function(){ plLimit += 100; paint(); });

  paint();
}

/* =====================================================================
   TRANSFER PORTAL
   ===================================================================== */
var poPos = 'ALL', poQ = '';

function renderPortal(){
  var host = document.getElementById('p-portal');
  if (loaded.portal) return;
  if (!DATA.players || !DATA.players.length){
    clear(host); host.appendChild(el('div','err','Could not load the Transfer Player List sheet.')); return;
  }
  loaded.portal = true;
  clear(host);

  var wrap = el('div','po');
  var top = el('div','po-top');
  var chevs = el('div'); chevs.style.cssText = 'display:flex;gap:3px';
  for (var i = 0; i < 3; i++) chevs.appendChild(el('span','po-chev'));
  top.appendChild(chevs);
  var td = el('div');
  td.appendChild(el('h2', null, 'DEADLINE DAY'));
  td.appendChild(el('p', null, 'FFS DRAFT - TRANSFER PORTAL'));
  top.appendChild(td);
  wrap.appendChild(top);

  var body = el('div','po-wrap');

  /* left: available */
  var left = el('div','po-left');
  left.appendChild(el('h3', null, 'AVAILABLE'));
  var srch = el('div','po-srch');
  var inp = document.createElement('input'); inp.placeholder = 'Search';
  srch.appendChild(inp); left.appendChild(srch);
  var pills = el('div','po-pills');
  ['ALL','GK','DEF','MID','FWD'].forEach(function(v){
    var b = document.createElement('button'); b.textContent = v; b.setAttribute('data-p', v);
    if (v === 'ALL') b.className = 'on';
    pills.appendChild(b);
  });
  left.appendChild(pills);
  var list = el('div','po-list');
  left.appendChild(list);
  body.appendChild(left);

  /* right */
  var right = el('div','po-right');
  right.appendChild(el('div','po-h','SQUAD BOARD'));
  var board = el('div');
  right.appendChild(board);
  right.appendChild(el('div','po-h','BIGGEST FEES'));
  var feed = el('div');
  right.appendChild(feed);
  body.appendChild(right);
  wrap.appendChild(body);
  host.appendChild(wrap);

  var note = el('div','note');
  note.style.margin = '0';
  note.style.background = '#1E1E1E';
  note.style.borderColor = '#333';
  note.style.color = 'rgba(255,255,255,.5)';
  note.textContent = 'A live signing feed needs a timestamp column from the Apps Script. Until then this shows the '
    + 'biggest fees paid rather than the most recent deals.';
  wrap.appendChild(note);

  function paintList(){
    clear(list);
    var avail = DATA.players.filter(function(p){
      if (p.team) return false;
      if (poPos !== 'ALL' && p.pos !== poPos) return false;
      if (poQ && (p.web + ' ' + p.club).toLowerCase().indexOf(poQ) < 0) return false;
      return true;
    }).sort(function(a,b){ return b.pts - a.pts; }).slice(0, 40);

    if (!avail.length){
      var n2 = el('div', null, 'No players match');
      n2.style.cssText = 'padding:20px 0;text-align:center;color:#6b6b6b;font-size:11px';
      list.appendChild(n2); return;
    }
    avail.forEach(function(p){
      var row = el('div','po-p');
      row.appendChild(playerPhoto(p.id, p.web, 22));
      var mid2 = el('span'); mid2.style.cssText = 'flex:1;min-width:0';
      var n1 = el('span', null, p.web);
      n1.style.cssText = 'display:block;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
      var n2b = el('span');
      n2b.style.cssText = 'display:block;font-size:9px;color:#7a7a7a;margin-top:1px';
      var pcol = { GK:'#5b8def', DEF:'#4CAF50', MID:'#E8B84B', FWD:'#E85C6A' }[p.pos] || '#8a8a8a';
      var ps = el('span', null, p.pos); ps.style.cssText = 'color:' + pcol + ';font-weight:700';
      n2b.appendChild(ps); n2b.appendChild(document.createTextNode(' - ' + p.club));
      mid2.appendChild(n1); mid2.appendChild(n2b);
      row.appendChild(mid2);
      var r2 = el('span'); r2.style.cssText = 'text-align:right;flex-shrink:0';
      var pv = el('span', null, String(p.pts));
      pv.style.cssText = 'display:block;font-size:12px;font-weight:800;color:#FFDF00';
      r2.appendChild(pv);
      row.appendChild(r2);
      list.appendChild(row);
    });
  }

  /* squad board */
  var LIM = [['GK',2],['DEF',5],['MID',5],['FWD',3]];
  var owners = {};
  Object.keys(CONFIG.managers).forEach(function(m){ owners[m] = { GK:0, DEF:0, MID:0, FWD:0, spend:0, n:0 }; });
  DATA.players.forEach(function(p){
    if (!p.team || !owners[p.team]) return;
    if (owners[p.team][p.pos] !== undefined) owners[p.team][p.pos]++;
    owners[p.team].spend += p.fee;
    owners[p.team].n++;
  });

  var bh = el('div','po-bh');
  [['TEAM',62],['GK',26],['DEF',56],['MID',56],['FWD',36],['REMAINING','flex'],['SQUAD',34]].forEach(function(c){
    var sp = el('span', null, c[0]);
    if (c[1] === 'flex') { sp.style.flex = '1'; sp.style.textAlign = 'right'; }
    else { sp.style.width = c[1] + 'px'; if (c[0] !== 'TEAM') sp.style.textAlign = 'center'; }
    bh.appendChild(sp);
  });
  board.appendChild(bh);

  Object.keys(owners).sort(function(a,b){ return (100-owners[b].spend) - (100-owners[a].spend); }).forEach(function(m){
    var o = owners[m], rem = 100 - o.spend, done = o.n >= 15;
    var row = el('div','po-br');
    if (done) row.style.opacity = '.62';
    var nmw = el('span'); nmw.style.cssText = 'width:62px;display:flex;align-items:center;gap:6px';
    var dot = el('span');
    var kit = CONFIG.managers[m];
    dot.style.cssText = 'width:8px;height:8px;border-radius:50%;flex-shrink:0;background:' + (kit ? kit.body : '#888');
    var nm = el('span', null, m);
    nm.style.cssText = 'font-size:11px;font-weight:700;color:#e8e8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    nmw.appendChild(dot); nmw.appendChild(nm);
    row.appendChild(nmw);
    LIM.forEach(function(L, li){
      var w = [26,56,56,36][li];
      var cell = el('span'); cell.style.cssText = 'width:' + w + 'px;text-align:center';
      var pip = el('span','po-pip');
      for (var k = 0; k < L[1]; k++){
        var i2 = el('i');
        i2.style.background = k < o[L[0]] ? '#4CAF50' : 'transparent';
        i2.style.border = k < o[L[0]] ? 'none' : '1px solid #545454';
        pip.appendChild(i2);
      }
      cell.appendChild(pip);
      row.appendChild(cell);
    });
    var rm = el('span', null, rem.toFixed(1) + 'm');
    rm.style.cssText = 'flex:1;text-align:right;font-size:12px;font-weight:800;color:'
      + (rem < 3 ? '#E85C6A' : rem < 10 ? '#F5A800' : '#4CAF50');
    row.appendChild(rm);
    var sq = el('span', null, o.n + '/15');
    sq.style.cssText = 'width:34px;text-align:right;font-size:10px;font-weight:800;color:' + (done ? '#4CAF50' : '#8a8a8a');
    row.appendChild(sq);
    board.appendChild(row);
  });

  /* biggest fees */
  var signed = DATA.players.filter(function(p){ return p.team && p.fee; })
    .sort(function(a,b){ return b.fee - a.fee; }).slice(0, 10);
  if (!signed.length){
    var nf = el('div', null, 'No signings recorded in the Transfer Player List.');
    nf.style.cssText = 'padding:16px 0;color:#6b6b6b;font-size:11px;font-style:italic';
    feed.appendChild(nf);
  }
  signed.forEach(function(p, i){
    var row = el('div','po-fd');
    var n1 = el('span', null, String(i+1));
    n1.style.cssText = 'width:24px;font-size:13px;font-weight:900;color:' + (i < 3 ? '#FFDF00' : '#5a5a5a');
    row.appendChild(n1);
    row.appendChild(playerPhoto(p.id, p.web, 22));
    var mid3 = el('span'); mid3.style.cssText = 'flex:1;min-width:0';
    var a1 = el('span', null, p.web);
    a1.style.cssText = 'display:block;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    var a2 = el('span', null, p.club);
    a2.style.cssText = 'display:block;font-size:9px;color:#7a7a7a';
    mid3.appendChild(a1); mid3.appendChild(a2);
    row.appendChild(mid3);
    var ow = el('span'); ow.style.cssText = 'display:flex;align-items:center;gap:5px;flex-shrink:0';
    var od = el('span');
    var kit2 = CONFIG.managers[p.team];
    od.style.cssText = 'width:7px;height:7px;border-radius:50%;background:' + (kit2 ? kit2.body : '#888');
    var on = el('span', null, p.team);
    on.style.cssText = 'font-size:11px;font-weight:700;color:#d8d8d8;white-space:nowrap';
    ow.appendChild(od); ow.appendChild(on);
    row.appendChild(ow);
    var fe = el('span', null, p.fee.toFixed(1) + 'm');
    fe.style.cssText = 'width:54px;text-align:right;font-size:12px;font-weight:800;color:#FFDF00';
    row.appendChild(fe);
    feed.appendChild(row);
  });

  pills.addEventListener('click', function(e){
    var b = e.target.closest('button[data-p]'); if (!b) return;
    pills.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); poPos = b.getAttribute('data-p'); paintList();
  });
  inp.addEventListener('input', function(){ poQ = inp.value.toLowerCase(); paintList(); });
  paintList();
}

   START
   ===================================================================== */
buildNav();
boot();
